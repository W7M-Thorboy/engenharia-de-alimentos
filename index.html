stão 3 (2,5 pontos)", "blocks": [{"type": "p", "text": "Item a) Funções perdidas do açúcar e sistema substituto light (1,0 pt) Além da doçura, o açúcar confere agente de corpo , textura (desidratação da ATM), brilho e cor , estabilidade , redução da atividade de água ( a_w ) e conservação . Retirando 40% da sacarose, a ATM não gelifica adequadamente e a a_w sobe. O sistema substituto requer: (i) pectina BTM (ex.: 2,0%) ou amidada + CaCl₂ (ex.: 50 mg/g pectina) ; (ii) agentes de corpo como sorbitol e/ou CMC ; (iii) edulcorantes (sacarina/ciclamato 1:1, stevia ou sucralose); e (iv) conservantes pela maior a_w"}, {"type": "bullet", "text": "benzoato de sódio (maior ação contra bactérias e leveduras ) e sorbato de potássio (maior ação contra fungos/bolores )."}, {"type": "p", "text": "Termos-chave obrigatórios: agente de corpo, brilho, textura, redução de a_w, conservação; pectina BTM/amidada + CaCl₂; sorbitol e/ou CMC; edulcorantes; benzoato de sódio (bactérias/leveduras) vs. sorbato de potássio (fungos). Item b) Goma xantana vs. Goma gelana em chutney (0,8 pt) A goma xantana destaca-se pela alta estabilidade ao ácido/pH , manutenção da viscosidade em altas temperaturas prolongadas , elevada resistência ao cisalhamento , estabilidade congelamento-descongelamento e eficiência como agente de suspensão (sinérgica com goma guar para viscosidade e locusta/jataí para cremosidade). A goma gelana atua em concentrações mínimas, entregando melhor liberação de sabor , transparência, suspensão e flexibilidade textural conforme o grau de acilação ( baixo acil = géis firmes e frágeis; alto acil = flexíveis e elásticos; doses mínimas = géis fluidos)."}, {"type": "p", "text": "Termos-chave obrigatórios: goma xantana (estabilidade ao ácido, calor e cisalhamento; suspensão; sinergia guar/locusta); goma gelana (baixos níveis de uso; liberação de sabor; transparência; alto acil vs. baixo acil). Item c) Concentrador a vácuo vs. tacho aberto e pectina cítrica vs. maçã (0,7 pt) Deve-se escolher o concentrador a vácuo , pois reduz a temperatura de ebulição e o estresse térmico, prevenindo caramelização, escurecimento, degradação de pigmentos termosensíveis (antocianinas), perda de voláteis e hidrólise da pectina (comuns em tacho aberto). Para uma geleia clara e firme , recomenda-se pectina cítrica (coloração clara bege/branco, menor PM 60–90 kDa , géis mais firmes e elásticos, embora mais sujeita à sinérese mecânica e sabor neutro a amargo); caso a prioridade seja menor sinérese, maior mouthfeel e sabor frutado (aceitando tom marromamarelado), justifica-se a pectina de maçã (maior PM 90–130 kDa , sem terpenos, esterificação regular)."}, {"type": "p", "text": "Termos-chave obrigatórios: concentrador a vácuo (menor temperatura de ebulição, preservação de pigmentos/pectina) vs. tacho aberto; pectina cítrica (cor clara, gel firme/elástico, maior sinérese mecânica) vs. pectina de maçã (menos sinérese, maior mouthfeel, sabor frutado)."}]}, {"num": 4, "title": "Gabarito — Questão 4 (2,5 pontos)", "blocks": [{"type": "p", "text": "Item a) Proposta de produto inovador (0,8 pt)"}, {"type": "p", "text": "Exemplos válidos: Geleia funcional 100% fruta de mirtilo com suco concentrado de maçã e FOS (agrega valor a fruta pequena altamente perecível, substitui sacarose por adoçante natural rico em pectina e adiciona fibra prebiótica não calórica para o público wellness ) ou Coxinha vegana de jaca imatura com chutney de manga (usa \"carne de jaca\" como análogo cárneo fibroso para consumidores veganos e flexitarianos)."}, {"type": "p", "text": "Termos-chave obrigatórios: ingredientes dos slides (mirtilo + suco concentrado de maçã + FOS; biomassa de banana verde; ou jaca imatura/leguminosas); diferencial nutricional/funcional e público-alvo. Item b) Fluxograma e três etapas críticas (1,0 pt) Geleia funcional: Lavagem/sanitização → Despolpamento → Dissolução da pectina → Concentração a vácuo → Adição final de ácido → Envase a quente e resfriamento. Etapas críticas: (1) concentração a vácuo rápida (protege antocianinas e pectina); (2) dissolução da pectina a 60–71 °C (evita grumos); (3) ajuste de pH ao final ( 3,5–5,0 BTM/amidada ou ~3,2 ATM). Coxinha de jaca imatura: Sanitização → Untagem com óleo e assamento → Desfiamento e refogado → Massa → Modelagem/empanamento → Fritura e escorrimento. Etapas críticas: (1) sanitização em duas etapas ( 0,010% v/v cloro ativo por 10 min + enxágue 0,005% v/v por 5 min ); (2) untar casca com óleo (seiva) e assar inteira a 140–160 °C ; (3) fritura a ~180 °C em pequenas porções."}, {"type": "p", "text": "Termos-chave obrigatórios: fluxograma sequencial coerente; 3 etapas críticas com parâmetros numéricos dos slides (60–71 °C, pH, vácuo; ou 0,010%/0,005% cloro ativo, 140–160 °C, 180 °C). Item c) Sistema estabilizante e estratégia de conservação (0,7 pt) Na geleia reduzida em açúcar, usa-se pectina BTM ou amidada ( 40–64 mg Ca²⁺/g , estabilizando também antocianinas pelo baixo DE) ou goma gelana (doses mínimas, alta liberação de sabor), aliada a tratamento térmico + envase a quente hermético para dispensar conservantes químicos (ou sorbato de potássio contra fungos se a a_w exigir). Na linha vegana de jaca/leguminosas, substituise o ovo por água + farinha ou hidrocoloides ( goma xantana / metilcelulose ), com conservação por congelamento ( ≤ -12 °C ou -18 °C )."}, {"type": "p", "text": "Termos-chave obrigatórios: gelificante/ligante adequado à matriz (BTM/amidada + Ca² ⁺ , gelana ou xantana/água+farinha); barreira de conservação coerente (envase a quente/hermeticidade, a_w, congelamento ou sorbato)."}]}]}}, {"id": "aula7", "short": "Aula 7 · Doces e Osmose", "title": "Aula 7 — Doces Cremosos, Frutas Cristalizadas e Glaceadas", "subtitle": "Atividade de água (aw), evaporação, desidratação osmótica, firmeza (Ca²⁺/PME) e banhos de sacarose", "badge": "Aula 7", "accent": "#ea580c", "hasSimulado": true, "guia": [{"type": "h2", "text": "Remoção de água e adição de açúcar definem textura e estabilidade"}, {"type": "p", "text": "Guia didático de Engenharia de Alimentos (Aula 7) sobre doces cremosos, frutas cristalizadas, glaceadas e desidratação osmótica — com fluxogramas críticos, mecanismos físico-químicos, simulado dissertativo e gabarito comentado."}, {"type": "h2", "text": "a = p / p w 0"}, {"type": "p", "text": "A conservação não depende da umidade total, mas da fração de água disponível para micro-organismos e reações hidrolíticas (escala de 0 a 1)."}, {"type": "h2", "text": "Matéria-prima e padronização condicionam a integridade"}, {"type": "p", "text": "Nos processos baseados em remoção de água e incorporação de açúcar, o desempenho das operações unitárias começa na seleção estrutural e composicional do tecido vegetal. Alimentos com a mesma umidade total exibem perecibilidades muito diferentes porque a estabilidade responde à intensidade com que a água está ligada a constituintes não aquosos — ou seja, à atividade de água (a w ) . Para derivados em pedaços (frutas e hortaliças cristalizadas ou glaceadas), a firmeza inicial e o nível endógeno de cálcio são determinantes: tecidos excessivamente maduros perdem rigidez na parede celular e na lamela média sob aquecimento, colapsando antes de atingir a saturação."}, {"type": "h3", "text": "Padronização dimensional"}, {"type": "p", "text": "Cortes uniformes garantem aquecimento homogêneo no cozimento de doces cremosos e padronizam a distância de difusão de água e açúcar na desidratação osmótica."}, {"type": "h3", "text": "Sólidos, pigmentos e cultivares"}, {"type": "p", "text": "Em purês e polpas (como cultivares de batata-doce de diferentes cores de casca e polpa ou abóbora), a formulação considera teor de sólidos, pigmentos naturais e capacidade de estruturação."}, {"type": "h3", "text": "Padrão para panificação"}, {"type": "p", "text": "Cubos destinados a massas exigem controle de dimensões e integridade (resistência à mistura), textura e aderência (separação e mastigação), umidade/a w , sabor/cor e higiene da embalagem."}, {"type": "h2", "text": "Três fluxogramas dominam a tecnologia de açúcar e remoção de água"}, {"type": "p", "text": "A escolha da rota depende de um divisor estrutural claro: nos doces cremosos , a desestruturação do tecido vegetal faz parte do processo; nas frutas cristalizadas e glaceadas , o desafio é remover água e incorporar açúcar preservando a forma dos pedaços."}, {"type": "h3", "text": "A. Doce cremoso / de massa (modelo: doce de abóbora)"}, {"type": "p", "text": "01 Seleção e preparo Descarte de defeitos, descasque e corte em pedaços uniformes para evitar cozimento desigual."}, {"type": "p", "text": "Ponto crítico: tamanho e uniformidade dos pedaços 02 Cozimento Aquecimento para amolecer e desestruturar os tecidos vegetais antes do despolpamento."}, {"type": "p", "text": "Cuidado: excesso térmico degrada cor e sabor 03 Despolpamento Separação de fibras e redução de partículas, definindo a textura base (doce liso vs. com fibras). Polpa homogênea melhora a transferência de calor na concentração."}, {"type": "p", "text": "Ponto crítico: granulometria e uniformidade da polpa 04 Formulação e Mistura na proporção polpa:açúcar definida e evaporação de concentração água sob agitação contínua para evitar pontos de queima e incrustação."}, {"type": "p", "text": "Ponto crítico: proporção polpa:açúcar, agitação e tempo de residência 05 Controle do ponto Verificação integrada de sólidos solúveis (°Brix — lembrando que final e envase outros solutos contribuem), consistência (afetada pela temperatura), pH e a w no produto formulado, além de massa/rendimento (registrando perdas e adições). Resfriamento controlado evita cristalização arenosa."}, {"type": "p", "text": "Parâmetros: °Brix, consistência, pH, a w e rendimento"}, {"type": "h3", "text": "B. Frutas e hortaliças cristalizadas e glaceadas (processo convencional)"}, {"type": "p", "text": "01 Seleção, pesagem, Padronização de frutos firmes, balanço de massa e controle lavagem e higiênico inicial. sanificação 02 Preparo e Corte uniforme e proteção estrutural via adição de sais de cálcio estabilização de ou ativação enzimática da PME antes do cozimento."}, {"type": "p", "text": "textura Faixas: Ca²⁺ a 0,1–0,25% (como cálcio) ou PME a 70–82 °C por 3–15 min 03 Imersão em xarope e Início em xarope de baixa concentração com tempo de cozimento cozimento ajustado ao fruto: insuficiente prejudica absorção de açúcar; excessivo desestrutura fibras."}, {"type": "p", "text": "Cuidado: repousar na mesma panela (nunca de cobre) para evitar dano mecânico 04 Saturação gradual Elevação progressiva da concentração do xarope até equilíbrio (banhos sucessivos) entre perda de água e ganho de açúcar, medindo °Brix no refratômetro antes e depois do contato para corrigir diluição."}, {"type": "p", "text": "Parâmetros: ex. ilustrativo 30 → 40 → 50 → 60 → 70 °Brix; repouso de 12 a 24 h 05 Acabamento Cristalizado: secagem a 40–50 °C por vários dias, ou xarope (cristalizado ou final 1:1 açúcar:água (4 a 6 pedaços/vez até perda momentânea glaceado) de transparência), ou passagem em açúcar cristal/refinado. Glaceado: mistura sacarose:glicose 3:1, regas rápidas sucessivas e escorrimento/resfriamento em peneira. 06 Embalagem, Recipientes plásticos ou bandejas de poliestireno expandido com rotulagem e filme de PVC. Sem necessidade de fechamento hermético ou armazenagem tratamento térmico posterior, mas exige controle de umidade ambiente contra pegajosidade."}, {"type": "h3", "text": "C. Desidratação osmótica sob vácuo e cristalização a vácuo"}, {"type": "p", "text": "01 Seleção, lavagem e Descarte de frutos fora de padrão, sanitização em solução de preparo hipoclorito de sódio, corte e descasque (remoção de casca e sementes)."}, {"type": "p", "text": "Parâmetro: NaClO a 50 mg de cloro ativo/L por 15 min 02 Branqueamento Inativação enzimática e permeabilização controlada do tecido térmico vegetal antes da imersão."}, {"type": "p", "text": "Parâmetro: vapor fluente a 100 °C por 2 min 03 Imersão em xarope Imersão em xarope de sacarose acidificado e conservado, formulado e DO sob seguida de tratamento osmótico sob pressão reduzida para vácuo acelerar a perda de água e a impregnação."}, {"type": "p", "text": "Xarope: 65 °Brix + benzoato de sódio 0,1% + ácido cítrico"}, {"type": "p", "text": "q.s.p. pH = 3,0 | DO: 65 °C / 3 h / 660 mmHg 04 Remoção, secagem Separação do xarope e secagem complementar para ajustar em estufa e umidade e a w final. embalagem"}, {"type": "p", "text": "Estufa: 65 °C por 12 h (na rota cristalizada a vácuo: xarope 25–30 °Brix sob vácuo + estufa 60–70 °C)"}, {"type": "h3", "text": "Banhos graduais de 30 a 70 °Brix mantêm a transferência de massa sem"}, {"type": "h3", "text": "colapsar o tecido"}, {"type": "p", "text": "80 70 °Brix ) x 60 i r B ° ( s e i v 40 ú l o s s o d il ó 20 S 0 Banho 1 Banho 2 Banho 3 Banho 4 Banho 5 Repouso de 12 a 24 h entre banhos + medição e ajuste no refratômetro Sequência ilustrativa do princípio de saturação gradativa (°Brix). O processo real ajusta concentrações conforme a matéria-prima; iniciar em concentração máxima eleva a viscosidade e prejudica a transferência de massa."}, {"type": "h2", "text": "Mecanismos físico-químicos e bioquímicos por trás do processo"}, {"type": "h3", "text": "1. Quatro rotas de remoção de água e limites da evaporação"}, {"type": "p", "text": "A remoção de água reduz a atividade de água (a w ), inibe micro-organismos e enzimas e diminui massa e volume. A conservação efetiva resulta sempre da combinação de barreiras : açúcar e concentração, aquecimento, pH, higiene, embalagem e armazenamento. Processo Mecanismo principal Aplicação tecnológica Evaporação Ebulição e saída de água sob a forma de Polpas e doces concentrados. vapor. Secagem Transferência simultânea de calor e Frutas desidratadas e ajuste massa. final. Desidratação Transferência de massa em solução Pré-tratamento e impregnação. osmótica concentrada. Liofilização Sublimação do gelo sob vácuo. Produtos porosos e sensíveis. Na evaporação , o vapor de aquecimento cede energia ao condensar e concentra sólidos totais. Um evaporador reúne alimentação, câmara de evaporação (superfície de aquecimento e saída do concentrado), separador de vapor e condensador ligado ao sistema de vácuo — com configurações de tubos horizontais, tubos verticais longos, tubos verticais curtos ou circulação forçada. Os efeitos a controlar são a perda de compostos voláteis (aromas arrastados pelo vapor, recuperáveis por destilação fracionada como essência), o escurecimento não enzimático (intensificação da cor) e o aumento da viscosidade , que piora circulação e transferência de calor, favorecendo incrustação e superaquecimento. O resfriamento rápido (ex.: nebulização em câmara) evita dano térmico prolongado, e pré-concentrar líquidos antes de secagem, congelamento ou esterilização economiza energia."}, {"type": "h3", "text": "2. Desidratação osmótica: fluxos simultâneos e seletividade celular"}, {"type": "h3", "text": "A membrana íntegra restringe a sacarose e faz a saída de água superar o"}, {"type": "h3", "text": "ganho de soluto"}, {"type": "p", "text": "XAROPE CONCENTRADO"}, {"type": "h3", "text": "Água sai do tecido"}, {"type": "h3", "text": "Açúcar entra"}, {"type": "p", "text": "TECIDO DA FRUTA (fluxo dominante em células íntegr (sacarose: molécula maior) Oferece resistência à transferência Solutos nativos saem (reduz acidez e altera sabor) Dano térmico elimina membranas seletivas e aumenta a impregnação de açúcar Esquema dos três fluxos simultâneos na desidratação osmótica. Cinco variáveis governam a cinética: concentração/composição do xarope, tempo/temperatura, tamanho dos pedaços (distância de difusão), proporção fruta:xarope + agitação (diluição e resistência externa) e estrutura tecidual + pressão. Como pré-tratamento para frutas de umidade intermediária, a desidratação osmótica oferece cinco ganhos diretos: melhora o sabor e reduz a acidez, previne escurecimento enzimático, reduz perda de compostos voláteis na secagem, pode diminuir o encolhimento estrutural e encurta o tempo de secagem subsequente."}, {"type": "h3", "text": "3. Firmeza tecidual: sais de cálcio versus ativação enzimática da PME"}, {"type": "h3", "text": "Via química: sais de Ca²⁺ (0,1–0,25% como cálcio)"}, {"type": "p", "text": "Cloreto, citrato, sulfato ou lactato de cálcio estabilizam membranas e promovem ligações cruzadas entre íons Ca²⁺ e grupos carboxila livres da pectina, formando pectatos de cálcio que enrijecem a lamela média e a parede celular mesmo sob aquecimento. Limites: baixa solubilidade de vários sais, risco de sabor amargo em excesso e dependência da disponibilidade de grupos carboxila."}, {"type": "h3", "text": "Via enzimática sem aditivos: ativação da PME"}, {"type": "p", "text": "Enquanto o branqueamento convencional ( 88–100 °C / 3 min ) inativa a pectina metilesterase (PME), o branqueamento em baixa temperatura ( 70–82 °C / 3–15 min ) a ativa. A PME hidrolisa o metanol (CH₃OH) esterificado aos grupos carboxila, gerando ácidos pécticos e pectínicos ricos em grupos −COO⁻ livres, que insolubilizam na presença de Ca²⁺ endógeno ou adicionado e mantêm textura firme."}, {"type": "h3", "text": "4. Papel dos açúcares e ação dual do vácuo"}, {"type": "p", "text": "Impregnação (interior) e acabamento (superfície) são etapas independentes"}, {"type": "bullet", "text": "passar uma fruta em açúcar não substitui a impregnação interna. A sacarose participa da impregnação e forma cristais no acabamento e na estocagem; já a glicose e o açúcar invertido modificam a fase açucarada, modulando cristalização, higroscopicidade e textura (no glaceamento, sacarose:glicose 3:1 produz frutas tenras, translúcidas e de cobertura lisa). O vácuo atua de duas maneiras distintas: na evaporação , reduz a pressão e abaixa a temperatura de ebulição (concentração sob menor estresse térmico); na impregnação , acelera a saída de água e, via ciclos de pressão, favorece a entrada de solução nos poros do tecido — resultado condicionado à porosidade, à pressão aplicada e à recuperação da pressão."}, {"type": "h3", "text": "Pré-tratamento osmótico com sacarose a 50% eleva aparência e sabor na"}, {"type": "h3", "text": "secagem a 60 °C"}, {"type": "p", "text": "DO 50% sacarose (60 °C) Não tratada (60 °C) DO 50% sacarose (70 °C) Não tratada (70 °C)"}, {"type": "table", "rows": [["", "", "", "5,4b", "", "", ""], ["", "", "", "", "5", "", ""]]}, {"type": "p", "text": "7,4b Aparência Textura Sabor Média 0 2,0 4,0 6,0 8,0 Nota média na análise sensorial Médias na mesma linha seguidas de letras diferentes diferem estatisticamente (p ≤ 0,05). Fonte: dados experimentais da Aula 7 (slide 62)."}, {"type": "h2", "text": "Matriz de defeitos tecnológicos: da evidência à correção"}, {"type": "p", "text": "Cada defeito no produto acabado denuncia um desvio específico em formulação, transferência de calor/massa ou armazenamento. Use esta matriz para diagnósticos rápidos de prova. Estratégias de Prevenção/Correção Causas (Processo ou (Ingredientes e Etapas de Defeito Formulação) Processo) Doce cremoso Concentração insuficiente ou Ajustar formulação, prolongar muito fluido proporção polpa:açúcar evaporação, conferir °Brix inadequada; leitura de (considerando outros solutos), consistência distorcida pela consistência considerando temperatura temperatura alta. e balanço de massa/rendimento. Sabor de Aquecimento localizado, agitação Garantir agitação constante, inspecionar queimado e insuficiente, permanência perfil térmico e superfície de troca, incrustação excessiva e queda de reduzir tempo de residência e operar transferência térmica pelo sob vácuo quando aplicável. aumento da viscosidade. Textura arenosa Cristalização indesejada de Modular composição com glicose ou (cremosos) sacarose por desbalanceamento açúcar invertido e controlar a etapa de da fase açucarada ou resfriamento após a concentração. resfriamento inadequado. Separação de Instabilidade estrutural da matriz Revisar formulação líquido por formulação desbalanceada ou (sólidos/estruturação), uniformizar o condições inadequadas de despolpamento e controlar condições de estocagem. armazenamento. Amolecimento / Tecido excessivamente maduro, Selecionar frutos firmes, ajustar tempo fibras cozimento excessivo no xarope ou de cozimento, aplicar Ca²⁺ (0,1–0,25%) desestruturadas dano mecânico na transferência ou PME (70–82 °C / 3–15 min) e entre tachos. repousar na mesma panela. Impregnação Cozimento insuficiente, início Executar banhos graduais (12–24 h de interna deficiente direto em xarope muito repouso), medir e corrigir diluição no concentrado/viscoso ou apenas refratômetro ou aplicar DO sob vácuo. polvilhamento externo em açúcar. Pegajosidade Secagem insuficiente, absorção Validar ponto final por a w e umidade superficial de umidade ambiente (não apenas aparência), balancear (higroscopicidade) ou embalagem glicose/açúcar invertido e controlar inadequada. umidade ambiente e embalagem. Cubos Intensidade excessiva na Ajustar tempo e temperatura de excessivamente secagem complementar pós- secagem equilibrando umidade, a w e duros impregnação. maciez/comportamento na massa. Estratégias de Prevenção/Correção Causas (Processo ou (Ingredientes e Etapas de Defeito Formulação) Processo) Escurecimento Temperatura elevada e residência Concentrar sob vácuo, resfriar não enzimático e longa na evaporação/secagem; rapidamente, recuperar voláteis por perda de aroma arraste de voláteis pelo vapor destilação fracionada e usar DO como d'água. pré-tratamento antes da secagem. Sabor amargo Concentração elevada de sais de Respeitar 0,1–0,25% como cálcio, (frutas firmadas) cálcio. selecionar sal adequado ou adotar ativação da PME com cálcio endógeno. Contaminação Repouso da fruta no xarope em Proibir absolutamente tachos de cobre tóxica (azinhavre tacho de cobre frio (oxidação na etapa de repouso, empregando / zinabre) gerando hidróxido de cobre recipientes inertes. esverdeado)."}, {"type": "h2", "text": "Comparações e decisões de engenharia"}, {"type": "p", "text": "Em questões dissertativas de aplicação industrial, o avaliador espera a escolha justificada entre rotas concorrentes com base em transferência de massa, estabilidade estrutural e perfil sensorial. Critério de escolha e Dilema técnico Diferença operacional justificativa Doce cremoso vs. Cremoso desestrutura o tecido Define se o calor deve amolecer Fruta cristalizada (cozimento + despolpamento + totalmente a matriz ou ser evaporação); cristalizada preserva equilibrado com Ca²⁺/PME para forma e pedaços (impregnação + manter integridade celular. secagem). Cristalizado vs. Cristalizado: processo mais Optar pelo glaceamento quando se Glaceado demorado, pequenos cristais busca textura tenra, aspecto perceptíveis. Glaceado: cobertura translúcido e modulação da lisa e semitransparente com cristalização pela glicose. sacarose:glicose 3:1. Banhos graduais Banhos graduais (30 → 70 °Brix, 12– Alta concentração isolada não vs. Xarope inicial 24 h) controlam a impregnação; acelera nem melhora o produto; concentrado xarope inicial extremo eleva banhos graduais preservam viscosidade e altera difusão. qualidade tecidual e uniformidade interna. Critério de escolha e Dilema técnico Diferença operacional justificativa Sais de Ca²⁺ vs. Ca²⁺ (0,1–0,25%): ação direta, mas Escolher PME quando se quer evitar Ativação da PME baixa solubilidade e risco de aditivos e amargor, validando amargor. PME (70–82 °C / 3–15 tempo–temperatura por matériamin): firma sem aditivos diretos prima (evitando 88–100 °C / 3 min, usando Ca²⁺ endógeno. que inativa a PME). Convencional vs. Convencional exige múltiplos O vácuo acelera saída de água e Processo sob vácuo banhos (12–24 h) e secagem lenta entrada de solução nos poros em (40–50 °C por dias); vácuo opera tecidos porosos, encurtando o ciclo em ciclos curtos (65 °C / 3 h / 660 e reduzindo estresse térmico. mmHg + estufa 65 °C / 12 h). Pedaços íntegros Pedaços exigem parede celular Em purês moldados, o foco técnico vs. Purês moldados intacta e controle difusional; purês desloca-se da firmeza celular para (ex.: batata-doce roxa) permitem teor de sólidos, estabilidade de cores e formatos moldados. pigmentos e capacidade de estruturação."}, {"type": "h2", "text": "Três regras críticas que derrubam diagnósticos na prova"}, {"type": "h3", "text": "1. Zero tacho de cobre no repouso"}, {"type": "p", "text": "Quando frio, o cobre oxida em contato com o meio e forma uma camada esverdeada de hidróxido de cobre (azinhavre ou zinabre) de alta toxidez."}, {"type": "h3", "text": "2. °Brix do banho ≠ °Brix da fruta"}, {"type": "p", "text": "A fruta dilui o xarope ao liberar água e absorver açúcar. Homogeneíze o banho, meça antes e depois no refratômetro e controle higiene se houver reaproveitamento."}, {"type": "h3", "text": "3. Aparência seca ≠ estabilidade"}, {"type": "p", "text": "Na secagem pós-impregnação, superfície seca não garante estabilidade microbiológica: o ponto final exige medição de umidade, a w e comportamento na massa ."}], "simulado": {"intro": [{"type": "h2", "text": "no estilo da prova (10,0 pontos)"}, {"type": "p", "text": "Resolva as quatro questões abaixo fundamentando cada resposta em operações unitárias, parâmetros operacionais e mecanismos físico-químicos ou bioquímicos. Em seguida, utilize a Parte 3 para conferir o gabarito comentado e os termos-chave obrigatórios."}], "questions": [{"num": 1, "title": "Questão 1 — Processo e Mecanismo de Impregnação e Conservação", "blocks": [{"type": "p", "text": "2,5 pontos Uma indústria de derivados vegetais produz frutas cristalizadas em pedaços pelo método convencional. Na revisão do procedimento operacional, um analista sugeriu eliminar os banhos graduais e iniciar diretamente em xarope de alta concentração para ganhar produtividade, além de adotar apenas a umidade total como critério de liberação microbiológica. a. Apresente o fluxograma sequencial completo do processo convencional de frutas cristalizadas e refute tecnicamente a proposta de iniciar diretamente em xarope de alta concentração, justificando os banhos graduais (12–24 h de repouso) e o controle no refratômetro. (0,9 pt) b. Explique os três fluxos simultâneos de transferência de massa na desidratação osmótica, detalhando como o tamanho molecular da sacarose (frente à água e ao NaCl) e o dano térmico às membranas alteram a relação entre perda de água e ganho de soluto. (0,8 pt) c. Justifique por que a umidade total não é um indicador confiável de perecibilidade (diferenciando-a de a w = p / p 0 ) e explique qual combinação de barreiras dispensa fechamento hermético e tratamento térmico posterior nas frutas cristalizadas. (0,8 pt)"}]}, {"num": 2, "title": "Questão 2 — Diagnóstico de Defeitos, Ingredientes e Parâmetros", "blocks": [{"type": "p", "text": "2,5 pontos Você foi acionado para diagnosticar desvios simultâneos em duas linhas: (I) doce cremoso de abóbora com sabor de queimado , textura arenosa após o resfriamento e consistência muito fluida em outro turno; (II) cubos cristalizados de hortaliça para panificação apresentando amolecimento excessivo no cozimento e pegajosidade superficial na estocagem. a. Para os três defeitos do doce cremoso de abóbora, indique a causa tecnológica e as ações corretivas de processo/controle (incluindo cuidados na interpretação do °Brix e da consistência no ponto final). (0,9 pt) b. Explique duas estratégias tecnológicas distintas — uma com sais de cálcio e outra por controle enzimático sem aditivos diretos — para prevenir o amolecimento tecidual, detalhando mecanismos bioquímicos, faixas operacionais e restrições de cada rota. (0,9 pt) c. Explique as causas da pegajosidade nos cubos cristalizados, as evidências a investigar no lote e o significado técnico da afirmação \"a aparência seca não confirma estabilidade microbiológica\". (0,7 pt)"}]}, {"num": 3, "title": "Questão 3 — Decisão Técnica e Comparação de Tecnologias 2,5 pontos", "blocks": [{"type": "p", "text": "A equipe de P&D precisa definir a rota tecnológica para duas novas linhas: (1) fruta de umidade intermediária com preservação de aparência e sabor em ciclo reduzido; e (2) frutas em pedaços com cobertura lisa, semitransparente e textura tenra (glaceadas), em contraste com o acabamento cristalizado tradicional. a. Justifique a escolha da desidratação osmótica sob vácuo seguida de secagem em estufa frente ao processo convencional atmosférico, detalhando o papel dual do vácuo (evaporação vs. impregnação), os parâmetros completos da rota a vácuo e o suporte dos resultados sensoriais de DO 50% sacarose vs. amostra não tratada a 60 °C e 70 °C. (1,3 pt) b. Compare os acabamentos cristalizado e glaceado quanto ao aspecto superficial, formulação de açúcares (sacarose vs. glicose/açúcar invertido e proporção recomendada) e procedimento de acabamento, explicando por que passar a fruta em açúcar não substitui a impregnação interna. (1,2 pt)"}]}, {"num": 4, "title": "Questão 4 — Visão de Engenheiro de Alimentos e Formulação 2,5 pontos", "blocks": [{"type": "p", "text": "Sua equipe projetará duas linhas diferenciadas de hortaliças: (A) cubos cristalizados de abóbora padronizados para massas de panificação; e (B) doces cristalizados moldados a partir de purê de batata-doce roxa. a. Compare as decisões tecnológicas centrais entre o produto em pedaços (A) e o produto moldado a partir de purê (B), abordando integridade tecidual, despolpamento, teor de sólidos, pigmentos/cultivares e capacidade de estruturação. (1,0 pt) b. Para a linha de cubos destinados à panificação (A), elabore um plano de controle cobrindo: (i) cuidados críticos no repouso do xarope (incluindo restrição de material de equipamento) e na secagem complementar; e (ii) os cinco atributos de padronização exigidos na entrega à panificadora e seu impacto funcional na massa. (1,5 pt)"}]}]}, "gabarito": {"intro": [{"type": "p", "text": "Clique em cada questão para expandir a resposta técnica completa e conferir os"}, {"type": "p", "text": "termos-chave obrigatórios de prova."}], "questions": [{"num": 1, "title": "Gabarito — Questão 1 (2,5 pontos)", "blocks": [{"type": "p", "text": "1(a) Fluxograma e refutação do xarope inicial concentrado (0,9 pt): Fluxograma sequencial: seleção → pesagem → pré-lavagem → sanificação → preparo dos frutos → preparo do xarope → imersão no xarope → cozimento → saturação gradual → preparo do xarope final → cristalização/secagem (40–50 °C por vários dias, xarope 1:1 ou açúcar cristal/refinado) → embalagem → rotulagem → armazenagem. Iniciar em concentração máxima é tecnicamente incorreto porque concentração elevada sozinha não garante rapidez nem qualidade: a alta viscosidade e a composição do xarope alteram a transferência de massa e comprometem o tecido. Banhos graduais (ex.: 30 → 40 → 50 → 60 → 70 °Brix) com repouso de 12–24 h promovem equilíbrio progressivo. Como a fruta dilui o banho (saída de água + entrada de açúcar), homogeneíza-se o xarope e mede-se o °Brix no refratômetro antes e depois do contato (°Brix do banho ≠ °Brix da fruta) para ajuste ou substituição."}, {"type": "p", "text": "Termos-chave: banhos graduais; repouso de 12 a 24 h; viscosidade do xarope; equilíbrio osmótico; diluição do banho; refratômetro (°Brix do banho vs. fruta). 1(b) Fluxos simultâneos, tamanho molecular e dano térmico (0,8 pt): Na DO ocorrem três fluxos simultâneos sob resistência do tecido: saída de água, entrada de açúcar e saída de solutos nativos. Membranas íntegras são permeáveis a moléculas pequenas (água e NaCl), mas dificultam a entrada da sacarose (molécula maior), fazendo a perda de água superar o ganho de soluto. Em tecidos com estrutura celular danificada por calor, a ausência de membranas seletivas eleva a impregnação de açúcar (cozimento insuficiente limita absorção; excessivo desestrutura fibras)."}, {"type": "p", "text": "Termos-chave: três fluxos simultâneos; seletividade de membrana; sacarose (molécula maior); perda de água > ganho de soluto; dano térmico celular. 1(c) Umidade vs. a w e barreiras (0,8 pt): Umidade mede água total, mas alimentos com mesma umidade têm perecibilidades distintas conforme a intensidade de associação da água a solutos não aquosos. A atividade de água (a w = p / p 0 , de 0 a 1, mesma temperatura) mede essa disponibilidade: água fortemente associada sustenta menos crescimento microbiano e reações hidrolíticas. A conservação sem fechamento hermético nem tratamento térmico posterior resulta da combinação de barreiras: baixa a w (açúcar + secagem), calor prévio (controle microbiano/enzimático), pH, higiene, embalagem (plástico ou bandeja de poliestireno expandido com filme de PVC) e armazenamento."}, {"type": "p", "text": "Termos-chave: umidade total vs. atividade de água; a w = p / p 0 ; água fortemente associada; combinação de barreiras; dispensa de fechamento hermético e tratamento térmico posterior."}]}, {"num": 2, "title": "Gabarito — Questão 2 (2,5 pontos)", "blocks": [{"type": "p", "text": "2(a) Defeitos no doce cremoso de abóbora (0,9 pt): Sabor de queimado: aquecimento localizado, agitação insuficiente ou permanência excessiva, agravados pelo aumento da viscosidade que reduz circulação e transferência de calor (incrustação) — corrigir com agitação contínua, revisão da superfície de troca/perfil térmico e menor residência. Textura arenosa: cristalização indesejada de sacarose — corrigir modulando açúcares (glicose/açúcar invertido) e controlando o resfriamento. Doce muito fluido: concentração insuficiente ou proporção polpa:açúcar inadequada"}, {"type": "bullet", "text": "corrigir formulação e estender evaporação, lembrando que outros solutos contribuem para o °Brix e que a temperatura altera a leitura de consistência (avaliar também pH, a w e rendimento)."}, {"type": "p", "text": "Termos-chave: aumento da viscosidade; incrustação e aquecimento localizado; agitação; cristalização indesejada; efeito da temperatura na consistência; outros solutos no °Brix. 2(b) Firmeza tecidual: Ca²⁺ vs. PME (0,9 pt): Sais de cálcio (0,1–0,25% como cálcio — cloreto, citrato, sulfato ou lactato): estabilizam membranas e formam pectatos de cálcio entre grupos carboxila livres da pectina, enrijecendo lamela média e parede celular sob calor; restrições: baixa solubilidade, sabor amargo em excesso e dependência de grupos carboxila disponíveis. Ativação enzimática da PME (sem aditivos diretos): branqueamento em baixa temperatura (70–82 °C / 3–15 min), ativando a PME em vez de inativá-la (como a 88–100 °C / 3 min); a PME hidrolisa o metanol esterificado, expondo grupos carboxila livres (ácidos pécticos e pectínicos) que se insolubilizam com Ca²⁺ endógeno ou adicionado; restrição: tempo– temperatura exige validação por matéria-prima."}, {"type": "p", "text": "Termos-chave: pectatos de cálcio; 0,1–0,25% como cálcio; lamela média e parede celular; sabor amargo; PME; 70–82 °C (3–15 min) vs. 88–100 °C (3 min); hidrólise de metanol; ácidos pécticos/pectínicos. 2(c) Pegajosidade e estabilidade microbiológica (0,7 pt): Causada por secagem insuficiente ou absorção de umidade ambiente (higroscopicidade). Investigar a w , umidade relativa do ambiente e barreira da embalagem. \"A aparência seca não confirma estabilidade microbiológica\" significa que uma crosta seca pode mascarar a w interna elevada, exigindo controle instrumental de umidade e a w e avaliação do comportamento na massa."}, {"type": "p", "text": "Termos-chave: absorção de umidade; secagem insuficiente; a w , umidade ambiente e embalagem; aparência seca ≠ estabilidade microbiológica."}]}, {"num": 3, "title": "Gabarito — Questão 3 (2,5 pontos)", "blocks": [{"type": "p", "text": "3(a) DO sob vácuo vs. convencional e suporte sensorial (1,3 pt): Papel dual do vácuo: na evaporação reduz o ponto de ebulição (menor dano térmico); na impregnação acelera a perda de água e ciclos de pressão favorecem entrada de solução nos poros do tecido (conforme porosidade, pressão aplicada e recuperação da pressão). Rota de DO sob vácuo: hipoclorito de sódio (50 mg cloro ativo/L por 15 min), corte/descasque, branqueamento em vapor fluente (100 °C / 2 min), xarope de sacarose 65 °Brix (benzoato de sódio 0,1% + ácido cítrico q.s.p. pH = 3,0), DO sob vácuo (65 °C / 3 h / 660 mmHg), remoção dos frutos e estufa (65 °C / 12 h). A DO melhora sabor, reduz acidez, previne escurecimento enzimático, retém voláteis e encurta a secagem. Sensorialmente, a 60 °C a DO 50% sacarose superou significativamente (p ≤ 0,05) a não tratada em Aparência (7,4 vs. 5,9), Sabor (7,0 vs. 5,4) e Média geral (7,0 vs. 5,7), superando também as médias obtidas a 70 °C (6,6 com DO vs. 6,0 não tratada)."}, {"type": "p", "text": "Termos-chave: papel dual do vácuo (ebulição vs. poros/porosidade); vapor fluente 100 °C/2 min; 65 °Brix; benzoato 0,1%; ácido cítrico pH 3,0; 65 °C/3 h/660 mmHg; estufa 65 °C/12 h; DO 50% a 60 °C (Aparência 7,4; Sabor 7,0; Média 7,0). 3(b) Cristalizado vs. Glaceado e Impregnação vs. Acabamento (1,2 pt): Cristalizado: processo mais demorado, pequenos cristais perceptíveis (secagem 40– 50 °C por dias, xarope 1:1 com 4–6 pedaços até perda momentânea de transparência, ou açúcar cristal/refinado). Glaceado: cobertura lisa, uniforme e semitransparente, regando os pedaços várias vezes e escorrendo/esfriando em peneira, com sacarose:glicose 3:1 . Sacarose promove impregnação e cristalização; glicose/açúcar invertido modulam cristalização, higroscopicidade e textura (frutas tenras e translúcidas). Impregnação (interior) e acabamento (superfície) são etapas independentes: passar em açúcar não garante impregnação interna."}, {"type": "p", "text": "Termos-chave: pequenos cristais vs. camada lisa semitransparente; sacarose:glicose 3:1; modulação da cristalização e higroscopicidade; frutas tenras e translúcidas; impregnação ≠ acabamento."}]}, {"num": 4, "title": "Gabarito — Questão 4 (2,5 pontos)", "blocks": [{"type": "p", "text": "4(a) Pedaços de abóbora vs. Purê moldado de batata-doce roxa (1,0 pt): Nos cubos de abóbora (A), a meta é retirar água e incorporar açúcar preservando forma e integridade celular (firmeza inicial, corte uniforme, cozimento controlado e eventual Ca²⁺/PME). Nos doces cristalizados de purê de batata-doce roxa (B), a desestruturação tecidual (cozimento + despolpamento) faz parte do processo, e as decisões críticas passam a ser seleção de cultivares por coloração de casca e polpa, estabilidade de pigmentos, teor de sólidos e capacidade de estruturação para moldagem e recobrimento."}, {"type": "p", "text": "Termos-chave: integridade celular vs. desestruturação controlada; despolpamento; cultivares e pigmentos; teor de sólidos; capacidade de estruturação e moldagem. 4(b) Controles críticos e padronização para panificação (1,5 pt): (i) Controles críticos: manter os cubos na mesma panela durante o repouso para evitar danos mecânicos e proibir tachos de cobre (oxidação a frio formando hidróxido de cobre / azinhavre ou zinabre tóxico); evitar secagem complementar excessiva para não produzir cubos duros, controlando umidade, a w e comportamento na massa. (ii) Cinco atributos de padronização do lote: (1) Dimensões e integridade (distribuição uniforme e resistência mecânica à mistura); (2) Textura e aderência (maciez ao mastigar e separação dos cubos); (3) Umidade e a w (interação hídrica com a massa e conservação); (4) Identidade, sabor e cor (padronização sensorial); (5) Embalagem e condição higiênica (proteção e rastreabilidade)."}, {"type": "p", "text": "Termos-chave: mesma panela no repouso; proibição de tacho de cobre (azinhavre/zinabre); cubos duros por secagem excessiva; dimensões/integridade; textura/aderência; umidade/a w ; identidade/sabor/cor; embalagem e rastreabilidade. Material de estudo e simulado dissertativo elaborado exclusivamente a partir dos slides da Aula 7 — Remoção de Água e Adição de Açúcar (Tecnologia de Frutas, Hortaliças e Derivados)."}]}]}}, {"id": "aula8", "short": "Aula 8 · Cacau e Chocolate", "title": "Aula 8 — Cacau, Processamento do Chocolate e Chocolate Ruby", "subtitle": "Variedades e clones (CCN 51 / PS 1319), fermentação, torra, fabricação e bioquímica do chocolate Ruby", "badge": "Aula 8", "accent": "#78350f", "hasSimulado": false, "guia": [{"type": "p", "text": "AULA 8 • PRODUÇÃO DE CHOCOLATES"}, {"type": "h2", "text": "Cacau e Processamento do Cacau"}, {"type": "p", "text": "Material de estudo consolidado com os fundamentos agronômicos, beneficiamento pós-colheita, processamento industrial, fabricação de chocolates e o estudo de caso bioquímico do chocolate Ruby. DOCENTE FONTE DO CONTEÚDO Profª. Drª. Ellen Silva Lago Vanzela Aula 8 — Cacau e Processamento do Cacau (46 slides)"}, {"type": "h2", "text": "Estrutura do Material"}, {"type": "p", "text": "01 O Cacaueiro e a Produção no Brasil Cultivo no cinturão tropical, recebimento industrial brasileiro (2025 e safra 2025/26) e expansão em São Paulo e Minas Gerais. 02 Variedades, Clones e Anatomia do Fruto Criollo , Forastero e Trinitario ; comparativo entre CCN 51 e PS 1319; ciclo vital, fases de desenvolvimento e anatomia interna. 03 Pré-processamento (Beneficiamento do Cacau) Colheita, quebra, bioquímica da fermentação (etapas anaeróbia e aeróbia) e comparativo dos cinco métodos de secagem. 04 Processamento Industrial e Fabricação do Chocolate Recepção, torra (reação de Maillard), descasque, moagem, prensagem (manteiga e cacau em pó), etapas de fabricação e tipos de chocolate."}, {"type": "p", "text": "05 Estudo de Caso: Chocolate Ruby Rotas de processamento, efeito do pH na PFO e nas antocianinas, patente comercial, estudo de Montoya et al. (2021) e delineamento experimental."}, {"type": "h2", "text": "1. O Cacaueiro e a Produção no Brasil"}, {"type": "p", "text": "A cadeia produtiva do chocolate inicia-se no cacaueiro ( Theobroma cacao L.), espécie cultivada globalmente no cinturão tropical . No Brasil, a produção concentra-se historicamente na Bahia e no Pará, que juntos respondem por mais de 93% das amêndoas recebidas pela indústria nacional (IBGE / PAM; SindiDados / AIPC)."}, {"type": "h2", "text": "Recebimento de amêndoas pela indústria brasileira (2025)"}, {"type": "p", "text": "Bahia 112,5 mil t 60,5% Espírito Santo 10.054 t 5,4% Demais estados 175 t 0,1% Fonte: SindiDados – Campos Consultores, divulgado pela AIPC. Dados referentes ao ano civil de 2025 (janeiro a dezembro); percentuais arredondados. Desempenho na safra 2025/26 No período da safra 2025/26 (outubro de 2025 a setembro de 2026), a indústria brasileira recebeu 226.497 toneladas de amêndoas, registrando alta de 25,3% em relação à safra anterior."}, {"type": "h2", "text": "Expansão em São Paulo e Minas Gerais"}, {"type": "p", "text": "Além dos polos tradicionais, a cacauicultura apresenta potencial de expansão em novas fronteiras com uso de irrigação, manejo adaptado e assistência técnica, avançando no noroeste paulista e ganhando escala no norte mineiro. São Paulo (CATI • fev/2026) Minas Gerais (Emater-MG • out/2025)"}, {"type": "h2", "text": "650 ha 480 ha"}, {"type": "p", "text": "120 propriedades em 65 municípios (contra 161 t/ano de produção estimada. 322 ha em 2018). O município de Jaíba concentra 256 ha. No Duas frentes de cultivo: Vale do Ribeira e norte mineiro, destaca-se o cultivo irrigado litoral (Iguape, Itariri, Juquiá e Eldorado) e em consórcio com banana. noroeste paulista (região de São José do Rio Preto, com plantios comerciais acompanhados pela CATI desde 2021 e cultivo integrado à seringueira). Área cultivada com cacau 322 ha 650 ha Municípios com cultivo 21 65 Fonte: CATI, Cenário atual da cacauicultura paulista e estratégias para expansão sustentável , Documento Técnico nº 137, Tabela 6 (atualizado até fevereiro de 2026). A área cultivada mapeada praticamente dobrou entre os levantamentos."}, {"type": "h2", "text": "2. Variedades, Clones e Anatomia do Fruto"}, {"type": "p", "text": "No Brasil, as variedades de cacau agrupam-se em três tipos principais: Criollo , Forastero e Trinitario . Na expansão do noroeste paulista (região de São José do Rio Preto), destacam-se os clones CCN 51 e PS 1319 , cujas diferenças morfológicas (formato e sulcos do fruto) e agronômicas impactam diretamente o rendimento."}, {"type": "h2", "text": "Comparação agronômica: CCN 51 vs. PS 1319"}, {"type": "p", "text": "Porte e produção Maior porte e vigor Porte médio e produção precoce Superfície e sulcos Casca rugosa, sulcos Casca lisa, sulcos rasos profundos Massa média da semente 1,76 g 1,43 g seca 1 1 Valores de referência apresentados na tabela da aula-base. Para avaliar o rendimento, deve-se considerar em conjunto o número de sementes por fruto e a massa seca por semente."}, {"type": "h2", "text": "Ciclo vital e desenvolvimento do fruto"}, {"type": "p", "text": "O cacaueiro pertence à classe de plantas com flores cujas sementes possuem embrião com dois cotilédones — estruturas embrionárias responsáveis pelo armazenamento ou transferência de reservas de nutrientes durante a germinação. O desenvolvimento reprodutivo progride em etapas bem definidas: 1. Floração: Almofada floral → Botões florais em desenvolvimento → Pré-antese → Flor de cacau (antese) → Inflorescência. 2. Frutificação inicial: Início da frutificação → Bilro inicial → Bilro em crescimento → Frutos jovens (bilros avançados). 3. Maturação: Crescimento vegetativo → Desenvolvimento do embrião → Fruto maduro, exibindo a cor característica do clone."}, {"type": "h2", "text": "Anatomia interna do fruto e da semente"}, {"type": "p", "text": "Na abertura (quebra) do fruto maduro, removem-se as camadas externas da casca para acessar as sementes envoltas por polpa mucilaginosa, que originam as amêndoas de cacau após o beneficiamento: Exocarpo: Superfície externa colorida do fruto, analisada para o índice VARI. Mesocarpo: Camada intermediária lenhosa e espessa. Endocarpo: Membrana interna que reveste a cavidade do fruto. Placenta (cibirra): Eixo central de sustentação ligado aos frutos pelo funículo. Polpa mucilaginosa: Camada que envolve as sementes, rica em açúcares (avaliada por °Brix e pH), fornecendo o substrato para a fermentação. Semente: Composta por testa (casca da semente), gérmen e dois cotilédones de reserva, que constituem a principal matéria-prima do chocolate."}, {"type": "h2", "text": "3. Pré-processamento (Beneficiamento do Cacau)"}, {"type": "p", "text": "O beneficiamento transforma os frutos maduros colhidos em campo em amêndoas fermentadas e secas estáveis para o processamento industrial."}, {"type": "p", "text": "FLUXO DO BENEFICIAMENTO: DA COLHEITA À AMÊNDOA SECA"}, {"type": "h3", "text": "2. Quebra"}, {"type": "h3", "text": "3. Fermentação 4. Secagem"}, {"type": "p", "text": "1. Colheita Separação das → → Etapas anaeróbias → Redução da Frutos maduros sementes com e aeróbias umidade polpa"}, {"type": "h2", "text": "Bioquímica e etapas da fermentação"}, {"type": "p", "text": "A fermentação é um processo natural decisivo para a formação de aroma e sabor do chocolate, ocorrendo em três fases sequenciais: 1 A polpa fornece substrato (fase anaeróbia): Leveduras e bactérias láticas atuam sobre os açúcares da polpa mucilaginosa, produzindo metabólitos como etanol e ácidos orgânicos. 2 A entrada de ar muda o processo (fase aeróbia): Bactérias acéticas oxidam o etanol. A produção de ácido acético e a elevação da temperatura penetram e afetam o interior da semente. 3 O cotilédone se transforma: Alterações bioquímicas no interior da amêndoa geram precursores de aroma e sabor que participarão das reações térmicas durante a torra. Controle operacional no cocho de fermentação As quatro variáveis essenciais a monitorar durante a fermentação são: tempo , temperatura , pH e revolvimento da massa."}, {"type": "h2", "text": "Métodos de secagem das amêndoas"}, {"type": "p", "text": "Após a fermentação, a secagem reduz a umidade das amêndoas. A escolha entre métodos tradicionais e artificiais equilibra custo, dependência climática, controle de processo e volume processado. Secagem aberta Tradicional Técnica de baixo custo. Dependência do clima; mão de obra intensiva. Secagem em estufa Tradicional Risco de contaminação Necessidade de ventilação física reduzido; economia adequada; complexidade de espaço. no manuseio. Secagem industrial Artificial Automatização e controle; Complexidade no manuseio processamento de grandes e operação; custo elevado volumes. de aquisição e operação."}, {"type": "h2", "text": "4. Processamento Industrial e Fabricação do Chocolate"}, {"type": "p", "text": "Na indústria, as amêndoas secas passam por inspeção e limpeza para remoção de matérias estranhas, seguindo para a obtenção dos nibs (grãos de cacau sem casca), da massa de cacau e seus derivados (ICCO)."}, {"type": "p", "text": "PROCESSAMENTO INDUSTRIAL: DA AMÊNDOA SECA À MANTEIGA, AO PÓ E AO CHOCOLATE Recepção e Torra e Prensagem ou Moagem limpeza descasque Chocolate → → Massa / liquor de → Verificação de Separação por ar Manteiga + torta cacau qualidade → nibs (pó)"}, {"type": "h2", "text": "Torra, quebra, descasque e moagem"}, {"type": "p", "text": "Duas rotas para obtenção dos nibs: É possível realizar primeiro a torração das amêndoas inteiras seguida de quebra e descascamento , ou realizar primeiro a quebra e descascamento e depois a torração direta dos nibs. Na separação por ar, a diferença entre as frações permite remover a casca. Aroma (reação de Maillard): Durante a torra, a reação de Maillard entre açúcares redutores e compostos amino contribui decisivamente para a formação de aromas característicos. Cor, acidez e controle térmico: O perfil térmico influencia o escurecimento e a liberação de compostos voláteis, incluindo ácidos. A combinação de tempo e temperatura depende da matéria-prima, do equipamento e do perfil sensorial desejado. Moagem e prensagem: A moagem dos nibs libera a gordura interna e forma uma pasta chamada massa de cacau (ou liquor de cacau ). Essa massa pode seguir diretamente para a fabricação de chocolate ou passar por prensagem , gerando manteiga de cacau e torta de cacau (que é moída para produzir o cacau em pó ). Boa prática na comparação de torras Para comparar diferentes perfis de torra com confiabilidade, utilize sempre o mesmo lote de amêndoas e registre rigorosamente o tempo e a temperatura aplicados."}, {"type": "h2", "text": "Fabricação do chocolate: da formulação à barra"}, {"type": "p", "text": "ETAPAS DE FABRICAÇÃO DO CHOCOLATE 3."}, {"type": "h3", "text": "2. Refino 4."}, {"type": "h3", "text": "1. Mistura Conchagem 5. Dosagem"}, {"type": "h3", "text": "→ Redução de → → Temperagem →"}, {"type": "p", "text": "Incorporação Sabor e Moldagem partículas Cristalização fluidez Mistura: Incorpora os ingredientes da formulação (massa de cacau, manteiga de cacau, açúcar e leite em pó, conforme o tipo desejado). Refino: Reduz o tamanho das partículas sólidas para conferir maciez sensorial. Conchagem: Modifica o sabor, a textura, a fluidez e promove a homogeneização da massa. Temperagem: Orienta a cristalização controlada da manteiga de cacau, garantindo textura adequada e homogeneização. Dosagem e moldagem: Após a moldagem nas formas, o chocolate é resfriado, desmoldado e embalado."}, {"type": "h2", "text": "Tipos de chocolate (composição qualitativa)"}, {"type": "p", "text": "Branco Ausente Presente (fração Presente Presente maior) Meio amargo Presente (fração Presente Ausente Presente predominante; varia conforme %)"}, {"type": "h2", "text": "5. Estudo de Caso: Chocolate Ruby e Química da Cor"}, {"type": "p", "text": "Amêndoas frescas de cacau contêm polifenóis — incluindo antocianinas , que conferem tonalidade violeta ao cotilédone. Compreender por que a amêndoa violeta normalmente produz chocolate marrom explica a base tecnológica do chocolate Ruby (Barry Callebaut). ROTA 1 • PROCESSAMENTO CONVENCIONAL (A PARTIR DA AMÊNDOA FRESCA COM POLIFENÓIS E ANTOCIANINAS) Pigmentos se Fermentação e secagem transformam Tonalidade marrom Transformações no → → Oxidação de parte dos A torra também contribui cotilédone polifenóis ROTA 2 • ROTA DESCRITA NA PATENTE (CHOCOLATE RUBY) Cacau pouco ou não Tratamento ácido dos Ingrediente de cacau"}, {"type": "h3", "text": "fermentado → nibs →"}, {"type": "p", "text": "Tonalidade vermelha ou Preservação inicial de Ácido cítrico como opção púrpura pigmentos preferida"}, {"type": "h2", "text": "Como o pH afeta a enzima e o pigmento"}, {"type": "p", "text": "01 / Escurecimento enzimático (PFO) 02 / Equilíbrio das antocianinas Compostos fenólicos + O 2 → ação da Em meio ácido, o equilíbrio químico das polifenol oxidase (PFO) → quinonas → antocianinas favorece o cátion flavílio , forma pigmentos escuros. estrutural de tonalidade avermelhada. Em pH ácido, a atividade da PFO pode A cor final observada depende também da diminuir. Para confirmar a inativação composição da matriz do alimento. enzimática, mede-se a atividade residual da PFO após o tratamento."}, {"type": "h2", "text": "O que se sabe sobre o processo comercial e a patente"}, {"type": "p", "text": "Divulgado pela fabricante (Barry Callebaut): Seleção das amêndoas e uso de ácido cítrico; fermentação, temperatura, tempo de conchagem e acidez atuam como variáveis críticas de processo. Exemplos descritos na patente: Nibs tratados em solução ácida (com uma rota indicando pH 2–4 como faixa preferida) e acidificação da massa de cacau diretamente na concha. A formulação e as condições exatas do processo comercial permanecem confidenciais."}, {"type": "h2", "text": "Evidência experimental: o ácido sozinho reteve a cor?"}, {"type": "p", "text": "No estudo de Montoya et al. (2021) ( LWT 138, 110671; doi.org/10.1016/j.lwt.2020.110671), avaliou-se a obtenção de cacau em pó a partir de amêndoas não fermentadas submetidas ao protocolo abaixo: PROTOCOLO DE MONTOYA ET AL. (2021) Imersão Moagem Branqueamento Secagem → Ácido cítrico 1,5 → → Obtenção do 95 °C por 5 min 50 °C por 18 h mol/L por 5 min cacau em pó Acidificação isolada (amostra S9): O cacau em pó perdeu a tonalidade rosa-avermelhada. Branqueamento + acidificação (amostra S4): O cacau em pó reteve a tonalidade rosaavermelhada."}, {"type": "h2", "text": "Discussão em sala: como separar o efeito do calor e do ácido?"}, {"type": "p", "text": "Com base no delineamento proposto a partir de Montoya et al. (2021), divide-se um mesmo lote de amêndoas em quatro tratamentos e medem-se, após o tratamento e depois da secagem, o pH , a atividade residual da PFO e a cor em CIELAB (coordenada a* no eixo verde– vermelho):"}, {"type": "h3", "text": "1. Controle 2. Só branqueamento 3. Só ácido 4. Branqueamento +"}, {"type": "p", "text": "ácido Questão para reflexão (Discussão em sala) \"Se o a* aumentar e a atividade residual da PFO continuar igual, qual hipótese ganha força?\""}], "simulado": {"intro": [], "questions": []}, "gabarito": {"intro": [], "questions": []}}], "quickParams": [["Processamento Mínimo (MMP)", "Vida útil / Temperatura / Sanitização", "4 a 7 dias (tecido vivo); cadeia do frio contínua (0–5 °C conforme sensibilidade); sanitização em água clorada gelada (0,010% v/v por 10 min + enxágue 0,005% v/v por 5 min)."], ["Aula 4 · Matéria-Prima", "Climatéricos vs. Não-Climatéricos", "Climatéricos: pico respiratório e autocatálise de etileno (C₂H₄) pós-colheita (banana, manga, mamão, maçã, tomate). Não-climatéricos: sem pico pós-colheita (citros, uva, morango, abacaxi)."], ["Aula 5 · Exóticas e PANCs", "Limiar de pH 4,5 & Toxicologia", "pH < 4,5 permite pasteurização; pH > 4,5 exige esterilização comercial (risco de C. botulinum). Carambola: ácido oxálico (nefrotóxico) e caramboxina (neurotoxina). Pitaia: betalaínas (pH 3–7)."], ["Aula 6 · Geleias e Molhos", "Pectina ATM vs. BTM", "ATM (DE > 50%): gelifica com pH 2,8–3,5 e ≥ 55–65 °Brix (pontes de H + interações hidrofóbicas). BTM (DE < 50%): gelifica com Ca²⁺ (modelo 'caixa de ovo'), ideal para geleias light/reduzidas em açúcar."], ["Aula 7 · Doces e Osmose", "aw, Banhos Osmóticos e Firmeza", "aw = p/p₀ (0 a 1). Banhos graduais de 30 → 70 °Brix evitam colapso celular. Firmeza: sais de Ca²⁺ (0,1–0,25% como Ca) ou ativação da PME. Proibido tacho de cobre no repouso (azinhavre)."], ["Aula 8 · Cacau e Chocolate", "Clones, Fermentação e Ruby", "Clones SP: CCN 51 (43 sem., 1,76 g) vs. PS 1319 (36 sem., 1,43 g). Fermentação: anaeróbia (leveduras → etanol) + aeróbia (BAL/BAA → ácido acético, 45–50 °C). Ruby: controle de pH/PFO preserva antocianinas róseas."]]}, "frutasInteractive": {"mmp": {"storageKey": "frutas_mmp_mastered_v1", "accent": "#059669", "tabBg": "#065f46", "pillBg": "#059669", "blocoLabels": [{"view": "bloco1", "label": "1. Matéria-Prima e Fluxograma"}, {"view": "bloco2", "label": "2. Estresse, Enzimas e Defeitos"}, {"view": "bloco3", "label": "3. Barreiras e Decisões"}, {"view": "guia", "label": "Guia Completo"}, {"view": "simulado", "label": "Simulado (4 Q)"}, {"view": "gabarito", "label": "Gabarito"}], "topics": [{"id": "mmp-1a", "bloco": "bloco1", "code": "1a", "shortTitle": "Conceito, Pós-Colheita e UR", "title": "1a. Conceito de MMP, Perecibilidade e Umidade Relativa (UR)", "slidesRef": "Processamento Mínimo · Seção 1.1", "diagramType": "mmp_ur_resp", "logic": ["<strong>Definição Tecnológica:<\/strong> Produtos minimamente processados (<em>fresh cut<\/em> / <em>ready to eat<\/em>) são frutas ou hortaliças fisicamente alteradas (remoção de cascas, talos e sementes + corte), <strong>sem congelamento e sem altas temperaturas<\/strong>. Permanecem como <strong>tecidos vivos<\/strong> metabolicamente ativos.", "<strong>Vida Útil Reduzida:<\/strong> Cai de semanas/meses (intacto) para apenas <strong>4 a 7 dias<\/strong> devido à alta umidade (<strong>80% a 95%<\/strong>), perda de barreiras naturais e salto respiratório.", "<strong>Seleção Rigorosa:<\/strong> MMP <strong>NÃO<\/strong> serve para reaproveitar vegetais parcialmente deteriorados — carga microbiana e enzimas comprometem o lote inteiro.", "<strong>Resistência à Difusão (RD) e Respiração:<\/strong> Alface cv. Baba tem altíssima respiração (<strong>75 mL kg⁻¹ h⁻¹<\/strong>) e baixíssima RD (<strong>0,084<\/strong>), sendo extremamente perecível; maçã (12; RD 3,0) e kiwi (7; RD 1,6) respiram bem menos."], "applications": "A classificação prévia por tamanho, cor, defeitos e maturação garante uniformidade operacional — especialmente no descascamento por abrasão em batelada (minicenoura), onde tamanhos desiguais causam perdas severas de polpa.", "checklist": ["Umidade relativa (UR) ideal: estritamente entre <strong>85% e 95%<\/strong>.", "Ar seco (&lt; 85% UR) → acelera transpiração, murchamento e perda de vitaminas A e C.", "Ar saturado (~100% UR) → favorece microrganismos e induz enraizamento em alho e cebola."], "traps": ["Achar que dá para aproveitar partes aparentemente sadias de um fruto parcialmente deteriorado — <strong>erro grave de processo<\/strong>: descarte integral é obrigatório!", "Confundir climatéricos (abacate, banana, maçã, manga, melão, tomate) com não-climatéricos (alface, abacaxi, batata, citros, uva, pepino)."], "quiz": {"question": "Qual faixa de Umidade Relativa (UR) deve ser mantida na estocagem de frutas e hortaliças minimamente processadas e qual o risco de operar próximo a 100% UR?", "options": [{"text": "85% a 95% UR; próximo a 100% UR favorece proliferação microbiana e induz enraizamento em bulbos (alho/cebola).", "correct": true, "feedback": "Exato! A janela 85–95% UR equilibra turgidez sem condensação/proliferação microbiana."}, {"text": "98% a 100% UR; quanto mais úmido o ar, maior a vida útil sem nenhum efeito colateral.", "correct": false, "hint": "Pense no efeito da água livre/saturação sobre fungos, bactérias e bulbos como alho e cebola."}]}}, {"id": "mmp-1b", "bloco": "bloco1", "code": "1b", "shortTitle": "Fluxograma e Pontos Críticos", "title": "1b. Fluxograma em 10 Etapas e Pontos Críticos Operacionais", "slidesRef": "Processamento Mínimo · Seção 1.2", "diagramType": "mmp_flow", "logic": ["<strong>Sequência Obrigatória:<\/strong> (1) Recebimento/Seleção → (2) Pré-Resfriamento → (3) Pré-Lavagem → (4) Classificação → (5) Descascamento/Corte → (6) Sanitização/Enxágue → (7) Centrifugação/Drenagem → (8) Técnicas Complementares → (9) Acondicionamento → (10) Estocagem/Distribuição refrigeradas.", "<strong>Pré-Resfriamento vs. Câmara Fria Comum:<\/strong> Câmaras comuns apenas <em>mantêm<\/em> a temperatura; remover o <strong>calor de campo<\/strong> exige equipamento dedicado de alta capacidade frigorífica e alta velocidade de ar ou água.", "<strong>Corte e Centrifugação:<\/strong> Lâminas <strong>bem afiadas<\/strong> sob baixas temperaturas minimizam o rompimento celular. A <strong>centrifugação<\/strong> (folhosas/raízes) ou <strong>drenagem em escorredor<\/strong> (cubos macios como manga/abóbora) remove água livre e <strong>exsudados celulares<\/strong> ricos em açúcares."], "applications": "Embalagens (filmes, bandejas seladas, potes) devem combinar barreira ao vapor d'água (contra esbranquiçamento da minicenoura) e permeabilidade controlada a O₂/CO₂ (evitando anaerobiose).", "checklist": ["Rejeição integral de unidades avariadas já na Etapa 1.", "BPF + sanitização rigorosa evitando <strong>biofilmes<\/strong> (que bloqueiam a ação sanitizante).", "Cadeia do frio ininterrupta (ex.: 4–5 °C; 85–95% UR) até o consumidor."], "traps": ["Usar centrífuga de alta rotação em cubos macios de manga ou abóbora — causa esmagamento e mais exsudação; use <strong>drenagem suave em escorredor<\/strong>!", "Levar lotes recém-colhidos direto à câmara fria comum pulando o pré-resfriamento."], "quiz": {"question": "Por que uma câmara frigorífica convencional de estocagem NÃO substitui a etapa de pré-resfriamento (arrefecimento rápido) em MMP?", "options": [{"text": "Porque não possui capacidade frigorífica nem velocidade de circulação de ar/água suficientes para remover rapidamente o calor de campo — serve apenas para manter a temperatura já reduzida.", "correct": true, "feedback": "Perfeito! Esse é um dos pontos críticos mais cobrados em provas dissertativas de MMP."}, {"text": "Porque a câmara fria comum congela instantaneamente as hortaliças recém-colhidas.", "correct": false, "hint": "O problema não é congelar rápido demais, e sim a lentidão na retirada do calor de campo!"}]}}, {"id": "mmp-2a", "bloco": "bloco2", "code": "2a", "shortTitle": "Estresse de Corte, Etileno e PAL", "title": "2a. Estresse Mecânico do Corte, Respiração, Etileno e Transpiração", "slidesRef": "Processamento Mínimo · Seções 1.3A–1.3B", "diagramType": "mmp_stress", "logic": ["<strong>Cascata do Corte:<\/strong> Rompimento de organelas → desorganização celular → liberação de exsudados açucarados → síntese imediata de <strong>etileno (C₂H₄)<\/strong> + salto na <strong>taxa respiratória<\/strong> (libera CO₂, H₂O e <strong>calor vital<\/strong>) + ativação da enzima <strong>PAL<\/strong> (fenilalanina amônia-liase, sintetizando mais fenólicos).", "<strong>Evidências Experimentais:<\/strong> Rabanete fatiado (+95% respiração vs. inteiro); couve fatiada (~180 vs. ~90 mg CO₂ kg⁻¹ h⁻¹ na 1ª h); repolho fatiado (~2,1 vs. &lt;0,4 μL C₂H₄ kg⁻¹ h⁻¹); minicenoura (PAL &gt; 0,3 vs. ~0,1 estável).", "<strong>Quebra da Cadeia do Frio (Arilos de Romã):<\/strong> A 5 °C, respiração fica em ~3–4 mL CO₂ kg⁻¹ h⁻¹ (até 60 dias). Expor a 20 °C por apenas 1 dia dispara para <strong>~17–20 mL CO₂ kg⁻¹ h⁻¹<\/strong>!", "<strong>Transpiração:<\/strong> Exposição da água intercelular acelera evaporação (perda de 20% compromete severamente): gera murchamento, <strong>esbranquiçamento superficial<\/strong> (minicenoura/beterraba) e perda de vitaminas A e C."], "applications": "Corte sob refrigeração com lâminas afiadas + embalagem com barreira à umidade controlam simultaneamente o aquecimento interno, o amarelecimento da couve (perda de clorofila) e o esbranquiçamento de minicenouras.", "checklist": ["Equação respiratória: Substrato + O₂ → CO₂ + H₂O + Calor vital.", "Lâminas cegas + temperatura ambiente = explosão de etileno, PAL e perda de clorofila.", "Apenas 24 h fora do frio (5 °C → 20 °C) já quintuplica a respiração."], "traps": ["Esquecer de conectar o <strong>etileno<\/strong> à ativação da <strong>PAL<\/strong> (mais substratos fenólicos para escurecimento) e à degradação de clorofila (amarelecimento)."], "quiz": {"question": "O que acontece com a atividade respiratória de arilos de romã refrigerados a 5 °C quando sofrem quebra da cadeia do frio para 20 °C por apenas 1 dia?", "options": [{"text": "Salta abruptamente de ~3–4 para ~17–20 mL CO₂ kg⁻¹ h⁻¹, acelerando senescência e reduzindo drasticamente a vida útil.", "correct": true, "feedback": "Correto! Mesmo uma oscilação curta de 24 h já compromete o lote refrigerado."}, {"text": "Permanece praticamente inalterada, pois 1 dia é tempo insuficiente para afetar o metabolismo vegetal.", "correct": false, "hint": "Tecidos vivos em MMP respondem quase imediatamente à elevação de temperatura!"}]}}, {"id": "mmp-2b", "bloco": "bloco2", "code": "2b", "shortTitle": "Escurecimento (PPO) e Textura (PME)", "title": "2b. Escurecimento Enzimático (PPO/POD) e Enzimas Pectinolíticas", "slidesRef": "Processamento Mínimo · Seções 1.3C–1.3D", "diagramType": "mmp_ppo_pectin", "logic": ["<strong>Escurecimento Enzimático:<\/strong> No vegetal intacto, <strong>PPO<\/strong> (cloroplastos/membranas) e <strong>POD<\/strong> ficam separadas dos <strong>compostos fenólicos<\/strong> (vacúolo). O corte desfaz a compartimentalização: PPO catalisa monofenóis → difenóis (<em>cresolase<\/em>) e difenóis + O₂ → <strong>quinonas incolores<\/strong> (<em>catecolase<\/em>); POD usa H₂O₂. Depois, por via <strong>não enzimática<\/strong>, quinonas polimerizam em <strong>melaninas<\/strong> marrons/escuras.", "<strong>Por que NÃO branquear MMP?<\/strong> O branqueamento térmico desnatura PPO/POD, mas <strong>elimina o frescor e descaracteriza o produto minimamente processado<\/strong>.", "<strong>Amolecimento (Parede Celular):<\/strong> A lamela média cimenta células via <strong>protopectina + Ca²⁺ (pectato de cálcio)<\/strong>. Cascata degradativa: <strong>Protopectinase<\/strong> (solubiliza protopectina → pectina) → <strong>PME<\/strong> (desmetoxila pectina → ácido péctico) → <strong>despolimerizantes<\/strong> (poligalacturonase e liases clivam cadeias → amaciamento)."], "applications": "Em maçã minimamente processada, coberturas comestíveis de <strong>fécula de mandioca<\/strong> e <strong>dextrina<\/strong> mantiveram a cor no 1º dia sem escurecimento significativo (barreira física ao O₂).", "checklist": ["PPO tem duas atividades: <strong>cresolase<\/strong> (monofenol → difenol) e <strong>catecolase<\/strong> (difenol + O₂ → quinona).", "Formação de melaninas a partir de quinonas é <strong>não enzimática<\/strong> (oxidação acoplada).", "Celulose varia pouco na maturação; o amolecimento vem da despolimerização das <strong>substâncias pécticas<\/strong>."], "traps": ["Sugerir branqueamento térmico para controlar escurecimento em cubos de maçã MMP — <strong>tecnologicamente inviável<\/strong> por destruir o estado fresco!", "Confundir a ordem das enzimas pécticas: primeiro protopectinase, depois PME (desesterifica) e por fim poligalacturonase/liases (clivam)."], "quiz": {"question": "Por que o branqueamento térmico não pode ser utilizado para inativar a polifenoloxidase (PPO) em cubos de maçã minimamente processados?", "options": [{"text": "Porque, embora desnature as enzimas, o tratamento térmico retira o frescor e descaracteriza o produto minimamente processado.", "correct": true, "feedback": "Exato! Em MMP usam-se barreiras não térmicas: refrigeração, coberturas comestíveis (fécula de mandioca, dextrina), AM ou radiação gama."}, {"text": "Porque a PPO é totalmente resistente ao calor e não sofre desnaturação térmica.", "correct": false, "hint": "O branqueamento de fato desnatura a PPO — o problema é o efeito sobre a identidade 'fresca' do MMP!"}]}}, {"id": "mmp-3a", "bloco": "bloco3", "code": "3a", "shortTitle": "Microbiologia (pH) e Barreiras", "title": "3a. Microbiologia por pH e Técnicas Complementares de Conservação", "slidesRef": "Processamento Mínimo · Seções 1.3E, 1.4 e 1.5", "diagramType": "mmp_barriers", "logic": ["<strong>Baixo pH (abacaxi, morango):<\/strong> A acidez restringe bactérias patogênicas; predominam <strong>fungos<\/strong> (<em>Botrytis cinerea<\/em>, <em>Aspergillus niger<\/em>) e <strong>leveduras<\/strong> (<em>Saccharomyces cerevisiae<\/em> fermentando exsudados açucarados, <em>Candida<\/em>, <em>Pichia<\/em>, <em>Zygosaccharomyces<\/em>).", "<strong>Alto pH (~6,0 — melão, melancia, mamão, abacate):<\/strong> Sem barreira ácida, proliferam <strong>bactérias patogênicas<\/strong>: <em>Listeria monocytogenes<\/em>, <em>Salmonella<\/em> spp., <em>Shigella<\/em> spp., <em>E. coli<\/em>, <em>S. aureus<\/em>, <em>Yersinia enterocolitica<\/em>, <em>Aeromonas hydrophila<\/em>.", "<strong>Barreiras Complementares Validadas:<\/strong><br>• <strong>Atmosfera Modificada (AM):<\/strong> reduz escurecimento e microrganismos (alface); preserva voláteis (melões cantaloupe/honeydew); inibe leveduras (abacaxi).<br>• <strong>Revestimentos Comestíveis:<\/strong> fécula de mandioca e dextrina (maçã); proteína isolada de soja (melão kajari); redução microbiana (morango).<br>• <strong>Ozônio:<\/strong> reduz bactérias (pimentão/mamão) e amarelecimento (espinafre).<br>• <strong>Radiação Gama:<\/strong> inibe PPO (alface/aipo)."], "applications": "Na formulação de um mix de alface + espinafre + cenoura, combina-se AM (alface), ozônio (espinafre — menos perda de clorofila) e cadeia do frio + embalagem barreira (cenoura a +4 °C).", "checklist": ["Biofilmes nas superfícies vegetais/equipamentos bloqueiam sanitizantes → BPF são obrigatórias.", "AM mal dimensionada altera o perfil de compostos voláteis ('compostos de impacto') e gera off-flavors.", "Sempre diferenciar o risco sanitário entre frutas ácidas e frutas de pH ~6,0."], "traps": ["Tratar melão e melancia cortados com o mesmo risco microbiológico do abacaxi — pH ~6,0 permite <em>Listeria<\/em> e <em>Salmonella<\/em>!"], "quiz": {"question": "Qual o principal risco microbiológico em cubos de melão e melancia minimamente processados (pH ~6,0) em comparação ao abacaxi (baixo pH)?", "options": [{"text": "Ausência de barreira ácida permite multiplicação de bactérias patogênicas como Listeria monocytogenes, Salmonella spp. e E. coli.", "correct": true, "feedback": "Perfeito! Já no abacaxi (baixo pH), predominam fungos e leveduras como Saccharomyces cerevisiae."}, {"text": "Apenas fermentação por leveduras, pois bactérias patogênicas não crescem em frutas.", "correct": false, "hint": "Em pH próximo a 6,0 e alta umidade (80–95%), a matriz é excelente para bactérias patogênicas!"}]}}]}, "aula4": {"storageKey": "frutas_aula4_mastered_v1", "accent": "#0d9488", "tabBg": "#115e59", "pillBg": "#0d9488", "blocoLabels": [{"view": "bloco1", "label": "1. Botânica e Classificação"}, {"view": "bloco2", "label": "2. Etileno e Injúria pelo Frio"}, {"view": "bloco3", "label": "3. Respiração e Compatibilidade"}, {"view": "simulador", "label": "Simulador Câmara Fria"}, {"view": "guia", "label": "Guia Completo"}, {"view": "simulado", "label": "Simulado (4 Q)"}, {"view": "gabarito", "label": "Gabarito"}], "topics": [{"id": "a4-1a", "bloco": "bloco1", "code": "1a", "shortTitle": "Terminologia e Anatomia", "title": "1a. Produtos de Origem Vegetal, Anatomia e Tipos de Frutos", "slidesRef": "Aula 4 · Seções 1.1 e 1.2", "diagramType": "a4_botany", "logic": ["<strong>Terminologia Técnica:<\/strong> Usar <strong>produtos de origem vegetal<\/strong> para frutas + hortaliças (não usar 'vegetal' só para hortaliça). Fruticultura = frutas; Olericultura = hortaliças (olerícolas).", "<strong>Anatomia do Fruto:<\/strong> Pedúnculo + semente + <strong>pericarpo<\/strong> (epicarpo externo + mesocarpo/polpa + endocarpo interno).", "<strong>Pseudofrutos &amp; Partenocárpicos:<\/strong> Pseudofruto envolve órgão acessório carnoso — <strong>caju<\/strong> (pedúnculo; fruto verdadeiro é a castanha), <strong>maçã/pera<\/strong> (receptáculo floral). Partenocárpico = sem fecundação/sem sementes férteis (<strong>banana, uva Thompson<\/strong>).", "<strong>Tipos Carnosos &amp; Secos:<\/strong> Hesperídio (cítricos), Peponídeo (melão/melancia/abóbora), Sicônio (figo), Sorose (abacaxi), Baga (uva/tomate/mamão), Drupa (manga/abacate/pêssego); Secos: Cariopse (milho/arroz), Balaúste (romã), Aquênio (morango), Legume (feijão/ervilha), Síliqua (couve/repolho)."], "applications": "A classificação morfológica/anatômica orienta diretamente o desenho de operações de descascamento, despolpamento e extração (ex.: vesículas de suco no hesperídio vs. caroço lenhoso na drupa).", "checklist": ["Hortaliças em 5 grupos: subterrâneas (raízes/bulbos/rizomas/tubérculos), aéreas (folhas/pecíolos/talos/inflorescências), condimentos, frutos (inclui melão/melancia) e leguminosas.", "<em>Brassica oleracea<\/em>: <em>acephala<\/em> (couve), <em>capitata<\/em> (repolho), <em>botrytis<\/em> (couve-flor)."], "traps": ["Chamar a parte carnosa do caju de fruto verdadeiro — o fruto verdadeiro é a <strong>castanha<\/strong>; a parte suculenta é o pedúnculo (pseudofruto)!"], "quiz": {"question": "Como se classificam corretamente o abacaxi, os citros (laranja/limão) e a manga quanto ao tipo de fruto carnoso?", "options": [{"text": "Abacaxi = sorose (infrutescência/múltiplo); citros = hesperídio; manga = drupa (endocarpo lenhoso, 1 semente).", "correct": true, "feedback": "Exato! E lembre também: melão/melancia = peponídeo; figo = sicônio; uva/tomate = baga."}, {"text": "Todos são bagas simples originadas de um único ovário.", "correct": false, "hint": "A manga tem caroço duro (drupa), citros têm glândulas oleosas (hesperídio) e o abacaxi vem de uma inflorescência!"}]}}, {"id": "a4-1b", "bloco": "bloco1", "code": "1b", "shortTitle": "Climatéricos vs. Não-Climatéricos", "title": "1b. Comportamento Fisiológico, Ponto de Colheita e Padronização", "slidesRef": "Aula 4 · Seções 1.3 e 2", "diagramType": "a4_climacteric", "logic": ["<strong>Climatéricos:<\/strong> Apresentam pico respiratório e de etileno; podem ser colhidos <strong>imaturos<\/strong> (maior resistência mecânica ao transporte) e amadurecem fora da planta — ex.: banana, manga, abacate, mamão, maçã, tomate, maracujá.", "<strong>Distinção Fina:<\/strong> Em maçã e tomate o pico ocorre na planta ou fora; no <strong>abacate<\/strong> o pico climatérico ocorre <strong>somente após o desligamento da planta<\/strong>; em banana, a aplicação exógena de C₂H₄ uniformiza a maturação.", "<strong>Não-Climatéricos:<\/strong> Não elevam etileno pós-colheita — <strong>devem ser colhidos maduros na planta<\/strong> (citros, abacaxi, uva, caju, carambola, coco).", "<strong>Padronização Tecnológica:<\/strong> Limites mensuráveis de tamanho, massa, forma, turbidez, coloração, grau de maturação e ausência de sujidades/resíduos químicos."], "applications": "Colher abacaxi ainda verde resulta em fruto permanentemente ácido, duro e sem aroma; já a banana colhida no estádio 1 (Von Loesecke) atinge qualidade plena após climatização.", "checklist": ["Segregar lotes por estádio de maturação para evitar que frutos mais maduros acelerem a senescência dos demais via etileno.", "Aptidão climática: Tropicais (22–30 °C), Subtropicais (15–22 °C), Temperadas (5–15 °C)."], "traps": ["Tentar amadurecer abacaxi ou uva verde em câmara de etileno — frutos não-climatéricos não desenvolvem doçura/aroma fora da planta!"], "quiz": {"question": "Qual particularidade fisiológica diferencia o abacate da maçã e do tomate entre os frutos climatéricos?", "options": [{"text": "No abacate, o pico respiratório climatérico ocorre somente após o desligamento do fruto da planta.", "correct": true, "feedback": "Perfeito! Já em maçã e tomate o pico climatérico ocorre tanto preso à planta quanto após a colheita."}, {"text": "O abacate é não-climatérico e só amadurece preso na árvore.", "correct": false, "hint": "O abacate é climatérico — e justamente só dispara o amadurecimento quando colhido!"}]}}, {"id": "a4-2a", "bloco": "bloco2", "code": "2a", "shortTitle": "Ação do Etileno (5 Mudanças)", "title": "2a. Mecanismo de Ação do Etileno (C₂H₄) no Amadurecimento", "slidesRef": "Aula 4 · Seção 3.1", "diagramType": "a4_ethylene", "logic": ["<strong>Hormônio do Amadurecimento:<\/strong> O etileno (C₂H₄) é o principal fator endógeno estimulador da respiração, ativando sistemas enzimáticos que executam <strong>5 transformações coordenadas<\/strong>:", "1) <strong>Redução da acidez:<\/strong> consumo/degradação de ácidos orgânicos.<br>2) <strong>Conversão de carboidratos:<\/strong> hidrólise enzimática do amido em açúcares solúveis (doçura).<br>3) <strong>Mudança de cor:<\/strong> degradação de clorofila + síntese/revelação de antocianinas e carotenoides.<br>4) <strong>Amaciamento:<\/strong> conversão de pectinas insolúveis em pectinas solúveis.<br>5) <strong>Aroma:<\/strong> quebra de moléculas grandes em moléculas pequenas voláteis."], "applications": "Na indústria, controla-se o etileno nos dois sentidos: aplicação exógena para sincronizar maturação (banana) ou inibição via temperatura segura + atmosfera controlada para estender vida útil.", "checklist": ["Saiba citar todas as <strong>5 transformações enzimáticas<\/strong> na prova dissertativa!", "Emissores de etileno: Muito alto (<strong>maracujá<\/strong>) • Alto (maçã, abacate, mamão, pêssego, kiwi) • Moderado (banana, manga, tomate, melão) • Muito baixo (uva, citros, morango, folhosas, batata)."], "traps": ["Misturar maracujá ou maçã na mesma câmara com alface/brócolis — o etileno emitido acelera o amarelecimento e a senescência das hortaliças!"], "quiz": {"question": "Qual das alternativas resume corretamente as cinco transformações bioquímicas desencadeadas pelo etileno (C₂H₄) no amadurecimento?", "options": [{"text": "Queda de acidez, amido → açúcares, degradação de clorofila/novos pigmentos, pectinas insolúveis → solúveis e formação de voláteis aromáticos.", "correct": true, "feedback": "Excelente! Memorize esses 5 pilares para gabaritar questões de pós-colheita."}, {"text": "Aumento de acidez, síntese de amido, acúmulo de clorofila e enrijecimento da protopectina.", "correct": false, "hint": "É exatamente o oposto: o fruto fica mais doce, menos ácido, mais macio, aromático e muda de cor!"}]}}, {"id": "a4-2b", "bloco": "bloco2", "code": "2b", "shortTitle": "Injúria pelo Frio e TMS", "title": "2b. Desordens pelo Frio e Temperatura Mínima de Segurança (TMS)", "slidesRef": "Aula 4 · Seções 3.2 e 4", "diagramType": "a4_tms", "logic": ["<strong>Mecanismo:<\/strong> Produtos tropicais/subtropicais sofrem transtornos metabólicos <strong>irreversíveis<\/strong> quando expostos a temperaturas abaixo de 10–13 °C, porém <strong>acima do ponto de congelamento<\/strong>.", "<strong>Binômio Crítico:<\/strong> A severidade depende da interação <strong>temperatura × tempo de exposição<\/strong>. Quanto mais abaixo da TMS, mais rápido os sintomas surgem.", "<strong>Tabela de TMS &amp; Sintomas (Decore!):<\/strong><br>• <strong>Batata (TMS 3 °C):<\/strong> escurecimento e aumento indesejado de doçura.<br>• <strong>Goiaba (TMS 4,5 °C):<\/strong> injúria na polpa e deterioração.<br>• <strong>Quiabo (TMS 7 °C):<\/strong> descoloração e depressões.<br>• <strong>Mamão (TMS 7 °C):<\/strong> depressões, sabor estranho e falha no amadurecimento.<br>• <strong>Tomate maduro (TMS 7–10 °C):<\/strong> amaciamento excessivo e translucidez.<br>• <strong>Abacaxi (TMS 7–10 °C):<\/strong> polpa marrom ou preta.<br>• <strong>Banana (TMS 11,5–13 °C):<\/strong> escurecimento da epiderme."], "applications": "Estocar batata, mamão e banana juntos em câmara a 2 °C destrói os três lotes por injúria pelo frio — exige-se segregação térmica rigorosa acima de cada TMS.", "checklist": ["Clima temperado (maçã, pera, uva, morango, brócolis, cenoura, alho) tolera temperaturas próximas a 0 °C.", "Manutenção ininterrupta da cadeia do frio acima da TMS."], "traps": ["Achar que 'quanto mais frio, melhor
