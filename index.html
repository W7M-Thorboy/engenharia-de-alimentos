<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Estudos · Engenharia de Alimentos (UNESP–IBILCE)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style id="portal-dynamic-styles"></style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200">
  <!-- Top Header -->
  <header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur">
    <div class="flex items-center justify-between gap-3 px-4 lg:px-6 h-16">
      <div class="flex items-center gap-3 min-w-0 shrink">
        <button id="btn-menu" type="button" aria-label="Abrir menu de navegação" class="lg:hidden inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <button id="btn-brand-home" type="button" class="flex items-center gap-2.5 text-left min-w-0 max-w-[220px] xl:max-w-xs group">
          <span id="brand-icon-wrap" class="flex items-center justify-center w-9 h-9 rounded-xl bg-indigo-600 text-white font-bold shadow-sm shrink-0 transition-colors">
            <i id="brand-icon" data-lucide="graduation-cap" class="w-5 h-5"></i>
          </span>
          <div class="min-w-0">
            <div id="brand-title" class="font-bold text-sm sm:text-base tracking-tight truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">Central de Estudos</div>
            <div id="brand-subtitle" class="text-xs text-slate-500 dark:text-slate-400 truncate hidden md:block">UNESP–IBILCE · Engenharia de Alimentos</div>
          </div>
        </button>
      </div>

      <!-- Global Search -->
      <div class="relative flex-1 min-w-[160px] sm:min-w-[240px] max-w-md">
        <div class="relative flex items-center">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none"></i>
          <input id="global-search" type="search" placeholder="Buscar em todas as matérias (ex.: Pareto, Ishikawa, pectina, Bingham, pKₐ, aleno)..." class="w-full pl-9 pr-8 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-900 transition" />
          <button id="btn-clear-search" type="button" aria-label="Limpar busca" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="search-results" class="hidden absolute left-0 right-0 mt-2 max-h-96 overflow-y-auto rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-xl z-50 divide-y divide-slate-100 dark:divide-slate-800"></div>
      </div>

      <!-- Toolbar Actions -->
      <div class="flex items-center gap-1.5 shrink-0">
        <div class="hidden sm:flex items-center border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden">
          <button id="btn-font-dec" type="button" title="Diminuir fonte" class="px-2 py-1.5 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">A-</button>
          <button id="btn-font-inc" type="button" title="Aumentar fonte" class="px-2 py-1.5 text-xs font-semibold border-l border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">A+</button>
        </div>
        <button id="btn-print" type="button" title="Imprimir conteúdo atual" class="hidden md:inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="printer" class="w-4 h-4"></i>
        </button>
        <button id="btn-theme" type="button" title="Alternar modo claro/escuro" class="inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-4rem)]">
    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex lg:flex-col w-72 shrink-0 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto p-4">
      <div id="sidebar-content-desktop"></div>
    </aside>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="hidden fixed inset-0 z-50 lg:hidden">
      <div id="mobile-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs"></div>
      <div class="fixed inset-y-0 left-0 w-80 max-w-[85vw] bg-white dark:bg-slate-900 shadow-2xl p-4 overflow-y-auto flex flex-col">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200 dark:border-slate-800">
          <span class="font-bold text-sm">Navegação de Estudos</span>
          <button id="btn-close-drawer" type="button" aria-label="Fechar menu" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="sidebar-content-mobile"></div>
      </div>
    </div>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 min-w-0 px-4 sm:px-6 lg:px-10 py-6 lg:py-8 max-w-5xl mx-auto w-full"><div class="py-16 text-center text-sm text-slate-500 dark:text-slate-400">Carregando módulos da Central de Estudos (2º, 4º e 8º Semestre)...</div></main>
  </div>

  <!-- Back to top -->
  <button id="back-to-top" type="button" aria-label="Voltar ao topo" class="hidden fixed bottom-5 right-5 z-30 inline-flex items-center justify-center w-11 h-11 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg transition">
    <i data-lucide="arrow-up" class="w-5 h-5"></i>
  </button>

  <script id="app-data" type="application/json">{}</script>
  <script src="modulo-qualidade.js?v=3"></script>
  <script src="modulo-ft1.js?v=3"></script>
  <script src="modulo-organica-sim34.js?v=3"></script>
  <script src="portal-core.js?v=3"></script>
  <script>
    (async function bootModularPortal() {
      const mainEl = document.getElementById('main-content');
      if (mainEl) {
        mainEl.innerHTML = '<div class="py-16 text-center text-sm text-slate-500 dark:text-slate-400">Carregando módulos da Central de Estudos (2º, 4º e 8º Semestre)...</div>';
      }

      async function gunzipB64(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([bytes]).stream().pipeThrough(ds);
        return await new Response(stream).text();
      }

      async function fetchBaseHtml() {
        const CACHE_KEY = 'portal_dados_base_v1';
        try {
          const cached = sessionStorage.getItem(CACHE_KEY);
          if (cached && cached.length > 500000) return cached;
        } catch (e) {}
        const urls = [
          'https://raw.githubusercontent.com/W7M-Thorboy/engenharia-de-alimentos/dados-base/index.html',
          'https://cdn.jsdelivr.net/gh/W7M-Thorboy/engenharia-de-alimentos@dados-base/index.html'
        ];
        for (const u of urls) {
          try {
            const res = await fetch(u);
            if (res.ok) {
              const txt = await res.text();
              try { sessionStorage.setItem(CACHE_KEY, txt); } catch (e) {}
              return txt;
            }
          } catch (e) {}
        }
        throw new Error('Falha ao carregar base de dados do portal.');
      }

      try {
        const fixedCoreB64 = String(window.MOD_CORE_GZ || '')
          .replace('d75GXjI51imDOV', 'd75GXjI71imDOV')
          .replace('04cLGoa8vhNyO3', '04cLGoaS8vhNyO3');

        const [baseHtml, gcqJson, ft1Json, sim34Json, coreJson] = await Promise.all([
          fetchBaseHtml(),
          gunzipB64(window.MOD_GCQ_GZ),
          gunzipB64(window.MOD_FT1_GZ),
          gunzipB64(window.MOD_SIM34_GZ),
          gunzipB64(fixedCoreB64)
        ]);

        const gcqMod = JSON.parse(gcqJson);
        const ft1Mod = JSON.parse(ft1Json);
        const sim34Mod = JSON.parse(sim34Json);
        const coreMod = JSON.parse(coreJson);

        // 1. Inject full CSS
        document.getElementById('portal-dynamic-styles').textContent = coreMod.css;

        // 2. Extract base app-data (Frutas 9 aulas + Organica 4 topicos & 16 simulados)
        // IMPORTANT: Never write literal closing script tag inside inline script!
        const OPEN_SCRIPT = '<' + 'script>';
        const CLOSE_SCRIPT = '<' + '/script>';
        const ESC_CLOSE_SCRIPT = '<\\' + '/script>';
        const appSplit = baseHtml.split('<' + 'script id="app-data" type="application/json">')[1];
        const baseAppData = JSON.parse(appSplit.split(CLOSE_SCRIPT)[0].split(ESC_CLOSE_SCRIPT)[0]);

        // 3. Merge GCQ (8º Semestre), FT1 (4º Semestre), and Simulado T3 & T4 (2º Semestre) into app-data
        baseAppData.gcq = gcqMod.gcq;
        baseAppData.ft1 = ft1Mod.ft1;
        if (baseAppData.organica && sim34Mod.sim34BodyHtml) {
          baseAppData.organica.sim34BodyHtml = sim34Mod.sim34BodyHtml;
        }
        baseAppData.frutasInteractive = Object.assign({}, baseAppData.frutasInteractive || {}, gcqMod.interactive || {});
        document.getElementById('app-data').textContent = JSON.stringify(baseAppData);

        // 4. Extract base Script #1 (QO_MODULES + renderFrutasDiagram) and inject GCQ SVGs + QO_SIM34_MODULE + FT1_MODULE
        const inlineScripts = baseHtml.split(OPEN_SCRIPT).slice(1).map(part => part.split(CLOSE_SCRIPT)[0]);
        let script1 = inlineScripts[1];
        script1 = script1.replace("  return '';", gcqMod.diagramsJs + "\n  return '';");
        (0, eval)(script1 + "\nwindow.renderFrutasDiagram = renderFrutasDiagram;\n" + (sim34Mod.sim34ModuleJs || "") + "\n" + ft1Mod.moduleJs);

        // 5. Run unified 4-subject portal controller
        (0, eval)(coreMod.controllerJs);
      } catch (err) {
        console.error(err);
        if (mainEl) {
          mainEl.innerHTML = '<div class="p-6 rounded-2xl bg-rose-50 text-rose-900 border border-rose-200 text-sm">Erro ao inicializar módulos: ' + String(err.message || err) + '</div>';
        }
      }
    })();
  </script>
</body>
</html>
