 para qualquer fruta' — abaixo da TMS você troca redução respiratória por danos irreversíveis!"], "quiz": {"question": "Ao armazenar batata, mamão e banana a 2 °C por vários dias, quais TMS foram violadas e qual sintoma ocorre na banana?", "options": [{"text": "Batata (3 °C), mamão (7 °C) e banana (11,5–13 °C); na banana ocorre escurecimento da epiderme.", "correct": true, "feedback": "Gabarito! E na batata ocorre escurecimento + aumento indesejado de doçura; no mamão, depressões e falha no amadurecimento."}, {"text": "Apenas a banana sofre dano (TMS 5 °C); batata e mamão suportam 0 °C sem injúria.", "correct": false, "hint": "Todas as três têm TMS acima de 2 °C: batata 3 °C, mamão 7 °C e banana 11,5–13 °C!"}]}}, {"id": "a4-3a", "bloco": "bloco3", "code": "3a", "shortTitle": "Respiração, AC e Segregação", "title": "3a. Intensidade Respiratória, Atmosfera Controlada e Compatibilidade", "slidesRef": "Aula 4 · Seções 3.3 e 5", "diagramType": "a4_compat", "logic": ["<strong>Intensidade Respiratória a 10 °C (mg CO₂·kg⁻¹·h⁻¹):<\/strong><br>• Muito baixa (&lt;10): <strong>alho<\/strong><br>• Baixa (10–20): pepino, repolho, beterraba<br>• Moderada (20–40): cenoura, aipo, pimentão<br>• Elevada (40–70): aspargos, <strong>alface<\/strong><br>• Muito elevada (70–100): feijões, espinafre<br>• Extremamente elevada (&gt;100): <strong>brócolis<\/strong>, milho-verde.", "<strong>Controle Metabólico por Atmosfera:<\/strong> Combinar resfriamento seguro (≥ TMS) + redução de <strong>O₂ (↓ 8%)<\/strong> + elevação de <strong>CO₂ (↑ 2%)<\/strong> reduz respiração e síntese de etileno.", "<strong>Segregação em Câmaras:<\/strong> Nunca misturar (1) faixas de TMS incompatíveis (ex.: tomate maduro 7–10 °C vs. brócolis ~0 °C) nem (2) altos emissores de etileno (maracujá, maçã) com folhosas sensíveis."], "applications": "Em uma planta com poucas câmaras, a prioridade de resfriamento rápido vai para quem respira mais (brócolis &gt; alface &gt;&gt; alho), e a uva (não sensível ao frio + etileno muito baixo) tem compatibilidade plena com folhosas.", "checklist": ["Maior intensidade respiratória = maior perecibilidade = maior urgência de resfriamento.", "Parâmetros de AC da aula: <strong>O₂ ↓ 8%<\/strong> e <strong>CO₂ ↑ 2%<\/strong> (respeitando limites da espécie)."], "traps": ["Colocar maçã (não sensível ao frio, mas <strong>alta emissão de etileno<\/strong>) junto com alface ou brócolis só porque ambos toleram ~0 °C!"], "quiz": {"question": "Qual a ordem crescente de perecibilidade (baseada na intensidade respiratória a 10 °C) entre alho, alface e brócolis?", "options": [{"text": "Alho (< 10, muito baixa) < Alface (40–70, elevada) < Brócolis (> 100 mg CO₂·kg⁻¹·h⁻¹, extremamente elevada).", "correct": true, "feedback": "Exato! Por isso o brócolis tem prioridade máxima no resfriamento rápido."}, {"text": "Brócolis < Alho < Alface.", "correct": false, "hint": "Inflorescências em crescimento ativo (brócolis) têm metabolismo altíssimo (> 100), enquanto bulbos dormentes (alho) respiram muito pouco (< 10)!"}]}}]}, "aula5": {"storageKey": "frutas_aula5_mastered_v1", "accent": "#d97706", "tabBg": "#92400e", "pillBg": "#d97706", "blocoLabels": [{"view": "bloco1", "label": "1. Rendimento e Rotas"}, {"view": "bloco2", "label": "2. Pigmentos e Toxicologia"}, {"view": "bloco3", "label": "3. Decisões e Cultivares"}, {"view": "guia", "label": "Guia Completo"}, {"view": "simulado", "label": "Simulado (4 Q)"}, {"view": "gabarito", "label": "Gabarito"}], "topics": [{"id": "a5-1a", "bloco": "bloco1", "code": "1a", "shortTitle": "Rendimento e Aproveitamento", "title": "1a. Rendimento de Polpa, Coprodutos e Variabilidade Analítica", "slidesRef": "Aula 5 · Seção 1.1", "diagramType": "a5_yield", "logic": ["<strong>Rendimento Polpa × Resíduos:<\/strong> Graviola = <strong>67,5% polpa<\/strong>; Lichia (<em>cv. Tailandes<\/em>) = <strong>59,0% polpa<\/strong>, 24,3% casca, 19,7% semente; Mangostão = apenas <strong>24,1% polpa<\/strong> e <strong>69,6% casca<\/strong>!", "<strong>Aproveitamento Integral (Lichia):<\/strong> Farinha da casca entrega <strong>19,88% fibras e 10,08% proteínas<\/strong>; farinha da semente tem <strong>83,44% carboidratos<\/strong>. Vitamina C total na lichia = 34,7 mg/100 g (26,9 ascórbico + 7,8 deidroascórbico).", "<strong>Variabilidade Lote a Lote:<\/strong> Mangostão varia de pH <strong>3,49<\/strong> (BA) a <strong>4,35 ± 0,69<\/strong> (PA); carambola varia de <strong>pH 2,4 a 5,0<\/strong> (cruza o limiar de 4,5!).", "<strong>Mirtilo Rabbiteye (<em>V. ashei<\/em>):<\/strong> <strong>Woodard<\/strong> tem maiores açúcares totais (<strong>48,8%<\/strong>) e redutores (<strong>23,7%<\/strong>) com pH 2,62; <strong>Delite<\/strong> tem maior °Brix (<strong>13,2 °Brix<\/strong>) e menor umidade (81,3%)."], "applications": "Converter resíduos volumosos (casca/semente de lichia, bagaço de mirtilo, pericarpo de mangostão) em farinhas funcionais e extratos antioxidantes viabiliza economicamente frutas de baixo rendimento.", "checklist": ["Sempre medir pH e °Brix de cada lote antes de definir o tratamento térmico.", "4 rotas tecnológicas da Aula 5: Calda/Geleia, Secagem/Liofilização/Pó, Polpas/Bebidas/Lácteos e Coprodutos Bioativos."], "traps": ["Contaminar a polpa do mangostão com a <strong>resina amarela/látex da casca<\/strong> (rica em <strong>taninos<\/strong>) → causa forte adstringência e retrogosto amargo!"], "quiz": {"question": "Entre as cultivares de mirtilo Rabbiteye estudadas, qual se destaca pelo maior teor de açúcares totais (48,8%) e redutores (23,7%) para reduzir adição de sacarose?", "options": [{"text": "Woodard (48,8% açúcares totais, 23,7% redutores, 13,0 °Brix, pH 2,62).", "correct": true, "feedback": "Exato! Já a Delite se destaca pelo maior °Brix (13,2) e menor umidade (81,3%)."}, {"text": "Bluebelle, por possuir o maior teor de sólidos solúveis e açúcares.", "correct": false, "hint": "Bluebelle tem 12,0 °Brix (menor da comparação); lembre de Woodard para açúcares totais e redutores!"}]}}, {"id": "a5-1b", "bloco": "bloco1", "code": "1b", "shortTitle": "Limiar pH 4,5 e Pré-Tratamentos", "title": "1b. Limiar Crítico de pH 4,5 (Carambola) e Pré-Tratamentos de PANCs", "slidesRef": "Aula 5 · Seções 1.2 e 1.5", "diagramType": "a5_ph45", "logic": ["<strong>Limiar Microbiológico pH 4,5:<\/strong> A carambola varia de <strong>pH 2,4 a 5,0<\/strong> (5–13 °Brix). Lotes ácidos (<strong>pH &lt; 4,5<\/strong>) aceitam <strong>pasteurização<\/strong> (preserva textura das fatias estreladas). Lotes doces (<strong>pH &gt; 4,5<\/strong>) exigem <strong>acidificação da calda<\/strong> (equilíbrio &lt; 4,5) ou <strong>esterilização comercial<\/strong> (danifica a textura).", "<strong>Atenção Também em:<\/strong> Lichia (pH 4,2 ± 0,1) e mangostão do Pará (pH 4,35 ± 0,69) — muito próximos de 4,5!", "<strong>Pré-Tratamentos em PANCs:<\/strong><br>• <strong>Taioba e Araruta:<\/strong> <strong>proibido consumo cru<\/strong> — cocção ou escaldamento obrigatório.<br>• <strong>Bertalha-coração:<\/strong> <strong>NÃO picar antes do cozimento<\/strong> — o corte prévio libera mucilagem (textura viscosa de quiabo).<br>• <strong>Pitaia amarela:<\/strong> remoção obrigatória de espinhos."], "applications": "Em conservas de carambola doce em calda, acidificar a calda para pH de equilíbrio &lt; 4,5 é a decisão de engenharia que garante segurança microbiológica sem destruir as cinco arestas estreladas.", "checklist": ["pH &lt; 4,5 → Pasteurização (tratamento brando).", "pH &gt; 4,5 → Acidificar calda OU Esterilização comercial (risco de esporos patogênicos).", "Araruta: colher rizomas somente após secagem das folhas."], "traps": ["Picar folhas de bertalha-coração cruas antes de escaldar/cozinhar → libera mucilagem viscosa!", "Pasteurizar carambola doce com pH 4,9 sem acidificar a calda → risco sanitário grave!"], "quiz": {"question": "Qual decisão de engenharia deve ser tomada ao processar um lote de carambola tipo doce (pH 4,8) em calda buscando preservar a integridade das fatias estreladas?", "options": [{"text": "Acidificar a calda para reduzir o pH de equilíbrio abaixo de 4,5, viabilizando pasteurização branda em vez de esterilização comercial.", "correct": true, "feedback": "Perfeito! Assim garante-se segurança microbiológica sem amolecer/desmanchar as arestas da fruta."}, {"text": "Aplicar pasteurização branda normalmente sem corrigir o pH, pois frutas nunca têm risco de esporos.", "correct": false, "hint": "Acima de pH 4,5 existe risco de esporos patogênicos — nunca pasteurize sem baixar o pH!"}]}}, {"id": "a5-2a", "bloco": "bloco2", "code": "2a", "shortTitle": "Antocianinas, Betanina e Xantonas", "title": "2a. Partição de Antocianinas (Mirtilo), Betalaínas (Pitaia) e Xantonas", "slidesRef": "Aula 5 · Seção 1.3", "diagramType": "a5_pigments", "logic": ["<strong>Partição no Mirtilo (Reque et al.):<\/strong> Fruto fresco tem <strong>1775,75 mg/100 g BS<\/strong> de antocianinas. Na prensagem, <strong>~88,5% ficam retidas no bagaço (<em>pomace<\/em>: 1572,15 mg/100 g BS)<\/strong> e só <strong>20,61 mg/100 mL<\/strong> vão para o suco! A secagem degrada parte delas termicamente/oxidativamente (farinha a 5,91% umidade mantém <strong>1061,64 mg/100 g BS<\/strong>).", "<strong>Betanina na Pitaia Vermelha:<\/strong> A cor vermelho-vinácea vem das <strong>betalaínas (betanina)<\/strong>, sensíveis ao calor/oxidação. Adicionar <strong>maltodextrina resistente<\/strong> (carreador/encapsulante) e/ou usar <strong>liofilização (<em>freeze drying<\/em>)<\/strong> protege a cor em pós e confeitos.", "<strong>Mangostão (Pericarpo):<\/strong> Rico em <strong>xantonas<\/strong> (α-, β-, γ-mangostina) e antocianinas; exige controle cinético do <strong>branqueamento<\/strong> para inativar enzimas oxidativas preservando cor/extratibilidade. Já a polpa tem aroma delicado facilmente perdido no calor."], "applications": "A estratégia industrial ótima para mirtilo integra duas linhas: suco integral (pH 2,90; 12,03 °Brix; ratio 24,06) + farinha antioxidante/corante natural do bagaço seco até ~5,91% de umidade.", "checklist": ["Pitaia vermelha: betalaínas (betanina) + oligossacarídeos prebióticos.", "Beldroega: ômega-3 • Capuchinha: carotenoides • Ora-pro-nóbis: proteínas e fibras.", "Embalagens opacas/barreira à luz e umidade protegem betanina e antocianinas."], "traps": ["Achar que o suco integral de mirtilo concentra a maior parte das antocianinas — quase 90% ficam presas na casca/bagaço!"], "quiz": {"question": "Qual estratégia tecnológica previne a descoloração da betanina durante a produção de pó e confeitos de pitaia vermelha?", "options": [{"text": "Incorporar maltodextrina resistente como agente carreador/encapsulante e/ou optar por liofilização (freeze drying) com embalagem barreira à luz e umidade.", "correct": true, "feedback": "Exato! A maltodextrina resistente protege quimicamente a betanina e a liofilização evita degradação térmica."}, {"text": "Aumentar a temperatura da estufa convencional acima de 100 °C para fixar o pigmento.", "correct": false, "hint": "Betalaínas são termossensíveis — calor excessivo acelera a descoloração!"}]}}, {"id": "a5-2b", "bloco": "bloco2", "code": "2b", "shortTitle": "Toxicologia: Oxálico e Solanina", "title": "2b. Mecanismos Toxicológicos: Biri-Biri, Carambola e Maria-Pretinha", "slidesRef": "Aula 5 · Seções 1.3 e 1.5", "diagramType": "a5_tox", "logic": ["<strong>Oxalidaceae (Biri-biri e Carambola):<\/strong> Teor elevado de <strong>ácido oxálico<\/strong> (biri-biri: <strong>5,10%<\/strong>, pH 1,92, ATT 17,71%). Consumo excessivo causa <strong>nefropatia<\/strong> (precipitação de cristais de <strong>oxalato de cálcio<\/strong> nos túbulos renais) e <strong>neurotoxicidade<\/strong> (fração neurotoxina) — risco severo em pacientes renais.", "<strong>Maturação no Biri-biri:<\/strong> Fruto <strong>verde<\/strong> (mais ácido oxálico) → vinagre e conservas; fruto <strong>maduro<\/strong> (menos ácido oxálico, mais doce) → consumo in natura, compotas e geleias.", "<strong>Maria-pretinha (<em>Solanum americanum<\/em>):<\/strong> Bagas <strong>verdes/imaturas<\/strong> são <strong>venenosas<\/strong> por altos teores de <strong>solanina<\/strong> + traços de alcaloides tropânicos (<strong>escopolamina, atropina e hiosciamina<\/strong>). Apenas bagas totalmente maduras (negras) são aproveitáveis — atenção redobrada contra confusão botânica com a <strong>beladona<\/strong>!"], "applications": "A seleção por maturação na recepção atua como Ponto Crítico de Controle toxicológico: descarte 100% obrigatório de bagas verdes de maria-pretinha.", "checklist": ["Biri-biri verde vs. maduro: ambos aproveitáveis, destinos diferentes.", "Maria-pretinha verde vs. madura: <strong>ZERO uso seguro para fruto verde<\/strong>.", "Nefropatia = oxalato de cálcio nos túbulos renais; Neurotoxicidade = fração neurotoxina."], "traps": ["Confundir a regra do biri-biri (verde vai para conserva/vinagre) com a da maria-pretinha (verde é tóxico e deve ser totalmente descartado)!"], "quiz": {"question": "Por que frutos verdes de maria-pretinha (Solanum americanum) devem ser rigorosamente descartados na seleção, diferentemente do biri-biri verde?", "options": [{"text": "Porque bagas imaturas de maria-pretinha concentram solanina e alcaloides tropânicos (escopolamina, atropina, hiosciamina), apresentando toxicidade aguda.", "correct": true, "feedback": "Perfeito! Já o biri-biri verde (alto ácido oxálico) tem destinação tecnológica específica para vinagre e conservas."}, {"text": "Porque a maria-pretinha verde apenas não tem cor atrativa, mas é quimicamente segura.", "correct": false, "hint": "Trata-se de um risco toxicológico real por glicoalcaloides e alcaloides tropânicos!"}]}}, {"id": "a5-3a", "bloco": "bloco3", "code": "3a", "shortTitle": "Polpa vs. Xarope em Iogurtes", "title": "3a. Decisão de Formulação: Polpa vs. Xarope de Mangostão em Iogurtes", "slidesRef": "Aula 5 · Seção 1.5 (Braga et al., 2012)", "diagramType": "a5_yogurt", "logic": ["<strong>Comparação Experimental (Braga et al., 2012):<\/strong><br>• <strong>Iogurte com Polpa de Mangostão:<\/strong> maior teor de sólidos totais (<strong>23,76%<\/strong> vs. 21,20%), menor umidade (<strong>76,24%<\/strong> vs. 78,80%), proteínas <strong>5,90%<\/strong>, pH 4,00, acidez lática 0,97%.<br>• <strong>Iogurte com Xarope de Mangostão:<\/strong> maior teor proteico (<strong>7,12%<\/strong> vs. 5,90%), maior fluidez/umidade (78,80%), pH 3,97, acidez lática 0,98%.", "<strong>Decisão de Engenharia:<\/strong> Escolher <strong>polpa<\/strong> quando o foco for maior corpo/consistência (sólidos totais); escolher <strong>xarope<\/strong> quando a prioridade for maior concentração proteica e fluidez.", "<strong>Preservação Sensorial:<\/strong> Como o mangostão tem aroma delicado, incorporar polpa/xarope <strong>a frio<\/strong> após resfriamento da base fermentada."], "applications": "Combinar iogurte + polpa de pitaia vermelha (betanina + prebióticos) + mangostão + farinha fina da casca de lichia (fibras/proteínas) cria um produto funcional com aproveitamento integral.", "checklist": ["pH (~4,0) e acidez lática (~0,97–0,98%) ficam equivalentes entre polpa e xarope.", "Padronização granulométrica e hidratação prévia evitam arenosidade ao usar farinha de casca de lichia."], "traps": ["Aquecer a polpa de mangostão junto com o leite na pasteurização — volatiliza e destrói o aroma delicado!"], "quiz": {"question": "Segundo Braga et al. (2012), qual formulação de iogurte de mangostão entregou maior teor de sólidos totais e qual entregou maior teor proteico?", "options": [{"text": "Polpa entregou mais sólidos totais (23,76% vs. 21,20%); Xarope entregou mais proteínas (7,12% vs. 5,90%).", "correct": true, "feedback": "Exato! E ambos mantiveram pH (~4,0) e acidez lática (~0,98%) praticamente iguais."}, {"text": "Xarope superou a polpa tanto em sólidos totais quanto em teor proteico.", "correct": false, "hint": "A polpa elevou os sólidos totais para 23,76% (menor umidade), enquanto o xarope resultou em maior % proteica (7,12%)."}]}}]}, "aula6": {"storageKey": "frutas_aula6_mastered_v1", "accent": "#e11d48", "tabBg": "#9f1239", "pillBg": "#e11d48", "blocoLabels": [{"view": "bloco1", "label": "1. Matéria-Prima e Fluxo"}, {"view": "bloco2", "label": "2. Pectinas ATM, BTM e Gomas"}, {"view": "bloco3", "label": "3. Defeitos e Decisões"}, {"view": "calc", "label": "Calculadora de Pectina"}, {"view": "guia", "label": "Guia Completo"}, {"view": "simulado", "label": "Simulado (4 Q)"}, {"view": "gabarito", "label": "Gabarito"}], "topics": [{"id": "a6-1a", "bloco": "bloco1", "code": "1a", "shortTitle": "Banana, Goiaba e Jaca/Leguminosas", "title": "1a. Matérias-Primas: Banana (Von Loesecke), Goiaba e Alternativos", "slidesRef": "Aula 6 · Seção 1 + Prática 6", "diagramType": "a6_mat", "logic": ["<strong>Banana:<\/strong> Cavendish/AAA (Nanica, Nanicão, Grand Naine — 36,4–87,8 t/ha, ideal indústria/exportação); Prata/AAB (bananada/desidratação); Maçã/AAB (baixa resistência ao transporte); Ouro/AA (alto açúcar). Escala de <strong>Von Loesecke (1 a 7)<\/strong>: verde (amido → biomassa) → madura (açúcares → bananada/geleia).", "<strong>Goiaba (Dupla Aptidão):<\/strong> <strong>Paluma<\/strong> (~200 g, casca lisa, mais cultivada) e <strong>Pedro Sato<\/strong> (preferida nacionalmente, tolerante a climas adversos) atendem mesa + indústria (&gt;50 t/ha). Para mesa no Sudeste (&gt;300 g, amadurecimento lento): Tailandesa, Kumagai, Cortibel.", "<strong>Aula Prática 6 (Derivados Vegetais):<\/strong> Leguminosas hidratadas 1:3 (12 h com vinagre/NaHCO₃) e cozidas sob pressão (5 min feijão / 8 min grão-de-bico); <strong>Jaca verde (imatura)<\/strong> sanitizada em duas etapas (<strong>0,010% v/v 10 min → 0,005% 5 min<\/strong>), casca untada com óleo (seiva) e assada inteira a <strong>140–160 °C<\/strong> para desfiar ('carne de jaca')."], "applications": "Cultivares de dupla aptidão reduzem perdas pós-colheita porque frutos fora do padrão de mesa são aproveitados na indústria de goiabada (preferência nacional por polpa vermelha).", "checklist": ["Apresentação comercial banana: dedo (1), buquê (2–9), penca (≥ 10 frutos).", "Fritura de bolinhos/coxinha de jaca: óleo a ~180 °C em pequenas porções."], "traps": ["Esquecer de untar a casca da jaca verde com óleo antes do corte/assamento (a seiva látex gruda em tudo) ou errar a concentração de cloro ativo (0,010% → 0,005%)."], "quiz": {"question": "Por que produtores de goiaba priorizam cultivares como Paluma e Pedro Sato na cadeia da goiabada?", "options": [{"text": "Porque possuem dupla aptidão (mesa + indústria), alta produtividade (> 50 t/ha) e permitem direcionar excedentes ou frutos fora do padrão de mesa à indústria.", "correct": true, "feedback": "Exato! Isso reduz perdas pós-colheita e garante regularidade industrial."}, {"text": "Porque são exclusivas para exportação in natura e não podem ser processadas em doces.", "correct": false, "hint": "A grande vantagem delas é justamente a aptidão mista (mercado fresco + indústria)!"}]}}, {"id": "a6-1b", "bloco": "bloco1", "code": "1b", "shortTitle": "Fluxograma, PCCs e Balanço", "title": "1b. Fluxograma de Goiabada/Geleia, Pontos Críticos e Balanço de Massa", "slidesRef": "Aula 6 · Seção 2", "diagramType": "a6_flow", "logic": ["<strong>Sanitização &amp; Branqueamento (Goiabada):<\/strong> NaClO <strong>200 mg/L por 15 min<\/strong> → branqueamento <strong>100 °C por 5 min<\/strong> → polpa (congelada -18 °C com 2% ác. ascórbico). Na bananada, descasque manual é PCC microbiológico.", "<strong>Dissolução da Pectina (PCC):<\/strong> Pré-misturar pectina com <strong>5 a 10 partes de açúcar<\/strong> + água sob alta rotação e incorporar entre <strong>60 °C e 71 °C<\/strong>. Acima de 71 °C o açúcar dissolve antes da pectina, formando <strong>grumos insolúveis<\/strong>!", "<strong>Ordem na Cocção &amp; Ácido Final (PCC):<\/strong> 1º Polpa + açúcar → 2º Sorbato → 3º Pectina + <strong>Ácido ao final<\/strong> (em tacho aberto, ácido + calor prolongado provoca <strong>hidrólise da pectina<\/strong>!).", "<strong>Envase &amp; Resfriamento:<\/strong> Latas/potes → envase a quente e resfriamento em água até <strong>37 °C<\/strong>; formas de corte → descanso ~<strong>24 h<\/strong>, corte e embalagem.", "<strong>Balanço de Massa (B_açúcar = B_pectina = 100 °Brix):<\/strong> <code>M_fruta·B_fruta + M_açúcar·100 + M_pectina·100 = M_final·B_final<\/code>."], "applications": "Use a aba <strong>Calculadora de Pectina<\/strong> logo acima para praticar qualquer exercício de balanço de massa com conferência passo a passo!", "checklist": ["Geleia tradicional: <strong>67,5 °Brix<\/strong>; goiabada de corte: <strong>73 °Brix<\/strong>; bananada: <strong>78 °Brix<\/strong>.", "Cocção rápida demais impede inversão parcial da sacarose → gera processos osmóticos e cristalização na estocagem."], "traps": ["Adicionar ácido cítrico no início da cocção em tacho aberto → hidrolisa a pectina e o doce <strong>não gelifica<\/strong>!", "Dissolver pectina acima de 71 °C → forma grumos impossíveis de desfazer!"], "quiz": {"question": "Por que a pectina deve ser dissolvida entre 60 °C e 71 °C e o ácido cítrico adicionado apenas ao final da cocção em tacho aberto?", "options": [{"text": "Acima de 71 °C o açúcar dissolve antes da pectina formando grumos; e ácido + calor prolongado hidrolisa a pectina destruindo seu poder gelificante.", "correct": true, "feedback": "Gabarito perfeito! Dois pontos críticos obrigatórios em qualquer prova sobre geleias."}, {"text": "Abaixo de 71 °C a pectina cristaliza e o ácido cítrico evapora completamente a 100 °C.", "correct": false, "hint": "Pense na formação de grumos (acima de 71 °C) e na hidrólise ácida da cadeia péctica sob calor prolongado!"}]}}, {"id": "a6-2a", "bloco": "bloco2", "code": "2a", "shortTitle": "Pectina ATM vs. BTM vs. Amidada", "title": "2a. Mecanismos de Gelificação: ATM, BTM (Egg-Box) e Amidada", "slidesRef": "Aula 6 · Seção 3", "diagramType": "a6_pectin", "logic": ["<strong>Pectina ATM (GM &gt; 50%, 55–75%):<\/strong> Em pH &gt; 3,5 (pKₐ ≈ 3,5), grupos <strong>−COO⁻<\/strong> se repelem. <strong>Etapa 1 (Ácido, pH &lt; 3,5; ótimo 3,2):<\/strong> protona a −COOH, aproximando cadeias. <strong>Etapa 2 (Açúcar &gt; 55% SS; ótimo 67,5 °Brix):<\/strong> sequestra água livre, reduz a_w e desidrata micelas → <strong>interações hidrofóbicas<\/strong> (grupos metil) + pontes de H.", "<strong>Pectina BTM (GM &lt; 50%, 15–45%; &lt;7% não gelifica):<\/strong> Modelo <strong>\"caixa de ovo\" (<em>egg-box<\/em>)<\/strong>: duas cadeias (6–14 unidades) ligadas por pontes iônicas de <strong>Ca²⁺<\/strong> entre −COO⁻. Faixa ótima: <strong>pH 3,5–5,0<\/strong> (&gt;6,6 despolimeriza) e <strong>40–64 mg Ca²⁺/g pectina<\/strong> (&lt;16 não gelifica; &gt;64 gel duro, turvo e com sinérese).", "<strong>Pectina Amidada:<\/strong> 15–25% de grupos carboxiamida (<strong>−CONH₂<\/strong>; GM 20–40%). Exige menos Ca²⁺, tolera oscilações naturais de cálcio da fruta e usa <strong>10–15% menos pectina<\/strong> que a BTM comum.", "<strong>Proteção de Antocianinas:<\/strong> Carboxilas −COO⁻ (especialmente baixo DE) estabilizam eletrostaticamente cátions flavilium (+)."], "applications": "Geleias convencionais usam ATM (67,5 °Brix, pH 3,2); geleias light/diet/100% fruta exigem BTM ou amidada + Ca²⁺ + agentes de corpo (sorbitol, CMC, FOS) + conservantes.", "checklist": ["Grau SAG = gramas de sacarose gelificadas por 1 g de pectina (ex.: 150-SAG a pH 3,0 e 65 °Brix).", "Conservantes em reduzidas de açúcar: <strong>Benzoato de sódio<\/strong> (bactérias/leveduras) vs. <strong>Sorbato de potássio<\/strong> (fungos/bolores)."], "traps": ["Tentar fazer geleia diet (40% menos açúcar) mantendo pectina ATM — sem ≥ 55% SS a ATM simplesmente não gelifica!", "Exagerar no cálcio na BTM (&gt; 64 mg/g) achando que o gel fica melhor — gera contração excessiva, gel turvo, quebradiço e <strong>sinérese<\/strong>!"], "quiz": {"question": "Qual o mecanismo da pectina BTM e o que ocorre quando a dosagem de Ca²⁺ ultrapassa 64 mg/g de pectina?", "options": [{"text": "Modelo 'caixa de ovo' (pontes de Ca²⁺ entre grupos −COO⁻); acima de 64 mg/g ocorrem ligações cruzadas excessivas, gerando gel duro, turvo, quebradiço e com sinérese.", "correct": true, "feedback": "Exato! A faixa segura é 40–64 mg Ca²⁺/g de pectina em pH 3,5–5,0 (ou usar pectina amidada para maior flexibilidade)."}, {"text": "Desidratação por sacarose a 67,5 °Brix; acima de 64 mg/g de Ca²⁺ o gel apenas fica mais doce.", "correct": false, "hint": "Desidratação por sacarose é o mecanismo da ATM! A BTM depende de pontes iônicas com Ca²⁺."}]}}, {"id": "a6-2b", "bloco": "bloco2", "code": "2b", "shortTitle": "Hidrocoloides e Defeitos", "title": "2b. Hidrocoloides (Xantana, Gelana, CMC) e Matriz de Defeitos", "slidesRef": "Aula 6 · Seções 3 e 4", "diagramType": "a6_defects", "logic": ["<strong>Goma Xantana:<\/strong> Produzida por <em>Xanthomonas campestris<\/em> (2,5 MDa). Estável ao ácido, calor prolongado, cisalhamento e congelamento-descongelamento; ótima suspensão em molhos/chutneys (sinergia com guar = viscosidade; locusta/jataí = cremosidade).", "<strong>Goma Gelana:<\/strong> Doses mínimas, transparência e excelente <strong>liberação de sabor<\/strong> (baixo acil = gel firme/frágil; alto acil = flexível/elástico).", "<strong>CMC Sódica:<\/strong> Polímero aniônico derivado de celulose, repõe corpo/viscosidade em light (sensível a cisalhamento/temperatura).", "<strong>4 Defeitos Clássicos de Geleias:<\/strong><br>• <strong>Flutuação da fruta:<\/strong> envase quente demais ou pectina lenta → usar pectina de <strong>gelificação rápida (DE 70–76%, T_gel 75–85 °C, 20–70 s)<\/strong> em potes pequenos.<br>• <strong>Sinérese:<\/strong> pH muito baixo (~2,7), pré-gelatinização no envase frio ou Ca²⁺ &gt; 64 mg/g em BTM.<br>• <strong>Gel muito firme:<\/strong> alto °Brix, cocção longa, pH 2,5 ou excesso de pectina/Ca²⁺.<br>• <strong>Cristalização:<\/strong> ≥ 71 °Brix ou falta de inversão → manter 67,5 °Brix ou usar parcela de glicose."], "applications": "Em chutneys ácidos sob aquecimento e bombeamento, a goma xantana garante suspensão uniforme de especiarias e pedaços de fruta sem perder viscosidade.", "checklist": ["Flutuação da fruta → pectina rápida (DE 70–76%, T_gel 75–85 °C).", "Cristalização da sacarose → ocorre a partir de <strong>≥ 71 °Brix<\/strong>."], "traps": ["Envasar geleia abaixo da temperatura de gelificação (pré-gelatinização) — quebra a rede já formada e provoca <strong>sinérese<\/strong>!"], "quiz": {"question": "Uma geleia tradicional de morango com pedaços em potes de 200 g apresentou flutuação das frutas no topo e cristais arenosos após 30 dias. Quais as duas correções principais?", "options": [{"text": "Usar pectina de gelificação rápida (DE 70–76%, T_gel 75–85 °C) ajustando temperatura de envase, e manter 67,5 °Brix (abaixo de 71 °Brix) com parcela de glicose/inversão parcial.", "correct": true, "feedback": "Perfeito! A gelificação rápida trava os pedaços em suspensão e o controle de °Brix + glicose impede cristalização."}, {"text": "Elevar os sólidos solúveis para 78 °Brix e usar pectina de gelificação muito lenta.", "correct": false, "hint": "78 °Brix agrava ainda mais a cristalização (≥ 71 °Brix) e pectina lenta deixa as frutas boiarem até o topo!"}]}}, {"id": "a6-3a", "bloco": "bloco3", "code": "3a", "shortTitle": "Maçã vs. Cítrica e Vácuo vs. Tacho", "title": "3a. Decisões de Engenharia: Pectina Maçã vs. Cítrica &amp; Vácuo vs. Tacho", "slidesRef": "Aula 6 · Seção 5", "diagramType": "a6_compare", "logic": ["<strong>Pectina de Maçã vs. Cítrica:<\/strong><br>• <strong>Maçã:<\/strong> maior PM (90–130 kDa), esterificação regular, sem terpenos, cor marrom-amarelada, menos reativa ao Ca²⁺, géis suaves, <strong>menos sinérese<\/strong>, maior <em>mouthfeel<\/em> e sabor frutado.<br>• <strong>Cítrica:<\/strong> menor PM (60–90 kDa), esterificação em bloco, contém terpenos, <strong>cor clara (bege/branco)<\/strong>, mais reativa ao Ca²⁺, géis <strong>mais firmes/elásticos<\/strong>, maior sinérese mecânica.", "<strong>Tacho Aberto vs. Concentrador a Vácuo:<\/strong> O vácuo reduz o ponto de ebulição → menos estresse térmico, preserva antocianinas, aromas e evita hidrólise da pectina e caramelização.", "<strong>Definições:<\/strong> Geleia (suco filtrado, translúcida) • Polpada (fruta amassada) • Doce em massa (≥ 60 °Brix cremoso; ≥ 70 °Brix corte) • Chutney (molho agridoce/picante não emulsionado com vinagre e especiarias)."], "applications": "Para uma geleia gourmet clara e rica em pigmentos termossensíveis, combine <strong>concentrador a vácuo + pectina cítrica<\/strong> (cor clara e gel firme); se a prioridade for cremosidade e mínima sinérese, prefira pectina de maçã.", "checklist": ["Sacarose entrega 6 funções: doçura, corpo, textura (ATM), brilho/cor, redução de a_w e conservação.", "FOS (frutooligossacarídeos) = fibra prebiótica não calórica; suco concentrado de maçã = adoçante natural + pectina."], "traps": ["Inverter as características das pectinas: <strong>cítrica = cor clara e gel mais firme<\/strong>; <strong>maçã = menos sinérese e maior mouthfeel<\/strong>!"], "quiz": {"question": "Qual combinação de equipamento e origem da pectina é mais indicada para uma geleia clara, firme e rica em pigmentos termossensíveis?", "options": [{"text": "Concentrador a vácuo (menor temperatura de ebulição preserva pigmentos/pectina) + Pectina cítrica (cor clara bege/branco e géis mais firmes e elásticos).", "correct": true, "feedback": "Exato! Caso a prioridade fosse menor sinérese e maior cremosidade (mouthfeel), a opção seria pectina de maçã."}, {"text": "Tacho aberto em alta temperatura + Pectina de maçã.", "correct": false, "hint": "Tacho aberto degrada pigmentos termossensíveis e a pectina de maçã tem coloração marrom-amarelada!"}]}}]}, "aula7": {"storageKey": "frutas_aula7_mastered_v1", "accent": "#ea580c", "tabBg": "#9a3412", "pillBg": "#ea580c", "blocoLabels": [{"view": "bloco1", "label": "1. aw e Fluxogramas"}, {"view": "bloco2", "label": "2. Osmose, Ca²⁺ e PME"}, {"view": "bloco3", "label": "3. Defeitos e Decisões"}, {"view": "guia", "label": "Guia Completo"}, {"view": "simulado", "label": "Simulado (4 Q)"}, {"view": "gabarito", "label": "Gabarito"}], "topics": [{"id": "a7-1a", "bloco": "bloco1", "code": "1a", "shortTitle": "aw e Rotas de Remoção de Água", "title": "1a. Atividade de Água (a_w) e as Quatro Rotas de Remoção de Água", "slidesRef": "Aula 7 · Introdução e Mecanismo 1", "diagramType": "a7_aw", "logic": ["<strong>Umidade Total ≠ Perecibilidade:<\/strong> A estabilidade responde à <strong>atividade de água (a_w = p / p₀, escala 0 a 1)<\/strong>, que mede a fração de água disponível para microrganismos e hidrólise — não a umidade total.", "<strong>4 Rotas de Remoção:<\/strong> (1) <strong>Evaporação<\/strong> (ebulição/vapor — polpas e doces); (2) <strong>Secagem<\/strong> (calor + massa simultâneos — desidratadas); (3) <strong>Desidratação Osmótica (DO)<\/strong> (solução concentrada — pré-tratamento/impregnação); (4) <strong>Liofilização<\/strong> (sublimação sob vácuo — porosos/sensíveis).", "<strong>Efeitos a Controlar na Evaporação:<\/strong> Perda de voláteis (recuperáveis por destilação fracionada como essência), escurecimento não enzimático e <strong>aumento da viscosidade<\/strong> (piora circulação → incrustação e sabor de queimado)."], "applications": "Frutas cristalizadas dispensam fechamento hermético e tratamento térmico posterior pela <strong>combinação de barreiras<\/strong>: baixa a_w (açúcar + secagem), calor prévio, pH, higiene, embalagem (PVC/plástico) e armazenamento.", "checklist": ["Aparência seca <strong>NÃO<\/strong> confirma estabilidade microbiológica — sempre medir a_w e umidade!", "Em doces cremosos, a temperatura alta distorce a leitura de consistência e outros solutos contribuem no °Brix."], "traps": ["Usar apenas umidade total ou aparência seca da crosta como critério de liberação de lote — crosta seca pode mascarar a_w interna alta!"], "quiz": {"question": "Por que dois alimentos com a mesma umidade total podem ter perecibilidades completamente diferentes?", "options": [{"text": "Porque a estabilidade depende da atividade de água (a_w = p / p₀), ou seja, quão fortemente a água está ligada a solutos e indisponível para microrganismos e reações.", "correct": true, "feedback": "Exato! Adicionar açúcares e concentrar liga a água livre e derruba a_w."}, {"text": "Apenas pela cor da casca; umidade total e atividade de água significam exatamente a mesma coisa.", "correct": false, "hint": "Umidade é quantidade total de água; a_w mede a disponibilidade dessa água!"}]}}, {"id": "a7-1b", "bloco": "bloco1", "code": "1b", "shortTitle": "Banhos Graduais vs. DO a Vácuo", "title": "1b. Fluxogramas: Cremoso, Banhos Graduais (30→70 °Brix) e DO a Vácuo", "slidesRef": "Aula 7 · Fluxogramas A, B e C", "diagramType": "a7_baths", "logic": ["<strong>Divisor Estrutural:<\/strong> Doce cremoso <strong>desestrutura<\/strong> o tecido (cozimento + despolpamento + evaporação); frutas cristalizadas/glaceadas <strong>preservam a forma dos pedaços<\/strong>.", "<strong>Banhos Graduais (Convencional):<\/strong> Elevação progressiva (ex.: <strong>30 → 40 → 50 → 60 → 70 °Brix<\/strong>) com repouso de <strong>12 a 24 h<\/strong> na mesma panela (<strong>NUNCA de cobre!<\/strong>). Iniciar direto em xarope muito concentrado eleva a viscosidade e prejudica a difusão!", "<strong>Controle no Refratômetro:<\/strong> <strong>°Brix do banho ≠ °Brix da fruta<\/strong> (a fruta libera água e dilui o xarope) → homogeneíze e corrija o banho.", "<strong>Rota de DO sob Vácuo:<\/strong> NaClO (50 mg/L, 15 min) → Branqueamento vapor fluente (<strong>100 °C / 2 min<\/strong>) → Xarope <strong>65 °Brix<\/strong> + benzoato 0,1% + ác. cítrico (pH 3,0) → DO sob vácuo (<strong>65 °C / 3 h / 660 mmHg<\/strong>) → Estufa (<strong>65 °C / 12 h<\/strong>)."], "applications": "No teste sensorial da aula, DO com 50% sacarose a 60 °C superou significativamente (p ≤ 0,05) a amostra não tratada em Aparência (7,4 vs. 5,9), Sabor (7,0 vs. 5,4) e Média (7,0 vs. 5,7).", "checklist": ["<strong>ZERO tacho de cobre no repouso:<\/strong> cobre frio oxida formando hidróxido de cobre esverdeado (<strong>azinhavre / zinabre<\/strong>) altamente tóxico!", "Ação dual do vácuo: na evaporação abaixa o ponto de ebulição; na impregnação acelera saída de água e entrada de xarope nos poros."], "traps": ["Achar que começar direto no xarope a 70 °Brix economiza tempo — alta viscosidade bloqueia a transferência de massa e colapsa o tecido!", "Deixar a fruta repousando em tacho de cobre frio → contaminação tóxica por azinhavre/zinabre!"], "quiz": {"question": "Qual o risco de deixar frutas repousando em xarope dentro de um tacho de cobre frio entre banhos osmóticos?", "options": [{"text": "Oxidação do cobre frio formando hidróxido de cobre esverdeado (azinhavre ou zinabre), altamente tóxico.", "correct": true, "feedback": "Exato! Essa é uma das três regras críticas destacadas na aula."}, {"text": "Nenhum risco tóxico — apenas acelera um pouco a cristalização da sacarose.", "correct": false, "hint": "Tacho de cobre frio no repouso é absolutamente proibido por toxicidade química!"}]}}, {"id": "a7-2a", "bloco": "bloco2", "code": "2a", "shortTitle": "3 Fluxos da Desidratação Osmótica", "title": "2a. Desidratação Osmótica: 3 Fluxos Simultâneos e Seletividade", "slidesRef": "Aula 7 · Mecanismo 2", "diagramType": "a7_osmosis", "logic": ["<strong>Três Fluxos Simultâneos:<\/strong> (1) <strong>Saída de água<\/strong> do tecido para o xarope (fluxo dominante em células íntegras); (2) <strong>Entrada de açúcar<\/strong> (sacarose — molécula grande encontra resistência na membrana); (3) <strong>Saída de solutos nativos<\/strong> (ácidos/pigmentos — reduz acidez e altera sabor).", "<strong>Efeito do Dano Térmico:<\/strong> Membranas íntegras são seletivas (perda de água &gt; ganho de soluto). Quando o calor danifica as membranas, perde-se a seletividade e <strong>aumenta a impregnação de açúcar<\/strong>.", "<strong>5 Ganhos da DO como Pré-Tratamento:<\/strong> melhora sabor e reduz acidez, previne escurecimento enzimático, reduz perda de voláteis na secagem, diminui encolhimento estrutural e encurta o tempo de secagem."], "applications": "Cinco variáveis governam a cinética: concentração/composição do xarope, tempo/temperatura, tamanho dos pedaços (distância de difusão), proporção fruta:xarope + agitação e estrutura/pressão.", "checklist": ["Cozimento insuficiente limita absorção de açúcar; cozimento excessivo desestrutura fibras.", "Cortes uniformes padronizam a distância de difusão."], "traps": ["Esquecer o <strong>3º fluxo<\/strong> (saída de solutos nativos da fruta para o xarope) — ele explica a redução de acidez e diluição/alteração do banho!"], "quiz": {"question": "Como a integridade da membrana celular influencia a relação entre perda de água e ganho de sacarose na desidratação osmótica?", "options": [{"text": "Membranas íntegras restringem a sacarose (molécula maior), fazendo a saída de água superar o ganho de soluto; dano térmico elimina essa seletividade e aumenta a impregnação de açúcar.", "correct": true, "feedback": "Perfeito! E lembre sempre dos 3 fluxos: saída de água, entrada de açúcar e saída de solutos nativos."}, {"text": "A sacarose atravessa membranas intactas mais rápido que a água por ter maior massa molar.", "correct": false, "hint": "Moléculas pequenas (água, NaCl) passam fácil; a sacarose é grande e sofre resistência de membranas íntegras!"}]}}, {"id": "a7-2b", "bloco": "bloco2", "code": "2b", "shortTitle": "Firmeza: Sais de Ca²⁺ vs. PME", "title": "2b. Firmeza Tecidual: Via Química (Ca²⁺) vs. Via Enzimática (PME)", "slidesRef": "Aula 7 · Mecanismo 3", "diagramType": "a7_firmness", "logic": ["<strong>Via Química — Sais de Ca²⁺ (0,1–0,25% como cálcio):<\/strong> Cloreto, citrato, sulfato ou lactato de cálcio estabilizam membranas e formam <strong>pectatos de cálcio<\/strong> com grupos −COO⁻ livres na lamela média/parede. <em>Limites:<\/em> baixa solubilidade, risco de <strong>sabor amargo<\/strong> em excesso e dependência de carboxilas livres.", "<strong>Via Enzimática (Sem Aditivos) — Ativação da PME:<\/strong> Branqueamento em <strong>baixa temperatura (70–82 °C / 3–15 min)<\/strong> <em>ativa<\/em> a pectinametilesterase (PME) — em contraste com <strong>88–100 °C / 3 min<\/strong>, que a <em>inativa<\/em>!", "<strong>Mecanismo da PME:<\/strong> Hidrolisa o metanol (CH₃OH) esterificado → expõe grupos −COO⁻ livres (ácidos pécticos/pectínicos) → insolubilizam com <strong>Ca²⁺ endógeno<\/strong> firmando o tecido sem aditivos!"], "applications": "Quando o objetivo é clean label (sem aditivos diretos e sem risco de amargor do sal de cálcio), adota-se o branqueamento brando a 70–82 °C validando tempo–temperatura por espécie.", "checklist": ["Ca²⁺: <strong>0,1–0,25% como cálcio<\/strong> (não ultrapassar → amargor!).", "PME ativação: <strong>70–82 °C / 3–15 min<\/strong> vs. Inativação: <strong>88–100 °C / 3 min<\/strong>."], "traps": ["Aplicar branqueamento a 95–100 °C tentando ativar a PME — essa faixa <strong>inativa<\/strong> a enzima em vez de ativá-la!"], "quiz": {"question": "Qual faixa de temperatura ativa a PME para firmar frutas sem aditivos diretos, e o que acontece se elevar para 88–100 °C?", "options": [{"text": "70–82 °C (3–15 min) ativa a PME (hidrolisa metanol, expõe −COO⁻ para ligar Ca²⁺ endógeno); já 88–100 °C (3 min) inativa a PME.", "correct": true, "feedback": "Exato! Essa comparação entre via química (Ca²⁺ 0,1–0,25%) e via enzimática (PME 70–82 °C) é clássica em provas."}, {"text": "100 °C por 15 min ativa a PME ao máximo; abaixo de 85 °C ela fica completamente inativa.", "correct": false, "hint": "É o inverso: temperaturas brandas (70–82 °C) ativam a PME; temperaturas altas (88–100 °C) a desnaturam!"}]}}, {"id": "a7-3a", "bloco": "bloco3", "code": "3a", "shortTitle": "Cristalizado vs. Glaceado & Panificação", "title": "3a. Acabamento Cristalizado vs. Glaceado e Padrão para Panificação", "slidesRef": "Aula 7 · Mecanismo 4, Defeitos e Comparações", "diagramType": "a7_glaze", "logic": ["<strong>Impregnação ≠ Acabamento:<\/strong> Passar a fruta em açúcar na superfície <strong>NÃO substitui<\/strong> a impregnação interna!", "<strong>Cristalizado:<\/strong> Processo mais demorado, pequenos cristais perceptíveis (secagem 40–50 °C por dias, xarope final 1:1 com 4–6 pedaços/vez até perda momentânea de transparência, ou açúcar cristal/refinado).", "<strong>Glaceado:<\/strong> Mistura <strong>sacarose:glicose 3:1<\/strong> em regas rápidas sucessivas + escorrimento em peneira → cobertura lisa, semitransparente e textura tenra (glicose/açúcar invertido modulam cristalização e higroscopicidade).", "<strong>5 Atributos para Panificação:<\/strong> (1) Dimensões e integridade (resistir à mistura); (2) Textura e aderência (separação/mastigação); (3) Umidade e a_w; (4) Identidade, sabor e cor; (5) Embalagem e higiene."], "applications": "Em purês moldados (ex.: batata-doce roxa), o foco sai da firmeza de parede celular e vai para teor de sólidos, estabilidade de pigmentos e capacidade de estruturação.", "checklist": ["Pegajosidade superficial → secagem insuficiente ou absorção de umidade ambiente (higroscopicidade).", "Cubos excessivamente duros → secagem complementar intensa demais."], "traps": ["Confundir a proporção do glaceamento — é <strong>sacarose:glicose 3:1<\/strong> (não 1:1, que é o xarope final de cristalização)!"], "quiz": {"question": "Qual a proporção recomendada de açúcares no acabamento glaceado e qual o papel da glicose nessa formulação?", "options": [{"text": "Sacarose:glicose 3:1 — a glicose modula a cristalização, a higroscopicidade e confere cobertura lisa, semitransparente e textura tenra.", "correct": true, "feedback": "Perfeito! E lembre: polvilhar açúcar fora nunca substitui a impregnação interna."}, {"text": "100% sacarose pura para maximizar cristais grandes e ásperos na superfície.", "correct": false, "hint": "O glaceado busca camada lisa e semitransparente — por isso entra a glicose na proporção 3:1!"}]}}]}, "aula8": {"storageKey": "frutas_aula8_mastered_v1", "accent": "#78350f", "tabBg": "#78350f", "pillBg": "#b45309", "blocoLabels": [{"view": "bloco1", "label": "1. Cacau, Clones e Anatomia"}, {"view": "bloco2", "label": "2. Fermentação, Torra e Chocolate"}, {"view": "bloco3", "label": "3. Estudo de Caso: Ruby"}, {"view": "guia", "label": "Guia Completo"}], "topics": [{"id": "a8-1a", "bloco": "bloco1", "code": "1a", "shortTitle": "Produção, Variedades e Clones", "title": "1a. Produção no Brasil, Expansão SP/MG e Clones CCN 51 vs. PS 1319", "slidesRef": "Aula 8 · Seções 1 e 2", "diagramType": "a8_clones", "logic": ["<strong>Cacau no Brasil (2025):<\/strong> Bahia (<strong>112,5 mil t · 60,5%<\/strong>) e Pará somam &gt; <strong>93%<\/strong> das amêndoas recebidas (ES 5,4%). Na safra 2025/26, a indústria recebeu <strong>226.497 t (+25,3%)<\/strong>.", "<strong>Novas Fronteiras (Irrigação/Consórcio):<\/strong> <strong>SP (CATI fev/2026)<\/strong> saltou de 322 ha (2018) para <strong>650 ha<\/strong> em 65 municípios (Vale do Ribeira + noroeste paulista/São José do Rio Preto consorciado à seringueira). <strong>MG<\/strong>: 480 ha (Jaíba 256 ha, consórcio com banana).", "<strong>Variedades:<\/strong> <em>Criollo<\/em>, <em>Forastero<\/em> e <em>Trinitario<\/em>.", "<strong>Clones no Noroeste Paulista:<\/strong><br>• <strong>CCN 51:<\/strong> maior porte/vigor, casca rugosa, sulcos profundos, <strong>~43 sementes<\/strong>, massa seca <strong>1,76 g/semente<\/strong>.<br>• <strong>PS 1319:<\/strong> porte médio, produção precoce, casca lisa, sulcos rasos, <strong>~36 sementes<\/strong>, massa seca <strong>1,43 g/semente<\/strong>."], "applications": "Para comparar rendimento real entre clones, avalie sempre em conjunto o número de sementes por fruto e a massa média seca por semente.", "checklist": ["Anatomia do fruto: exocarpo (índice VARI), mesocarpo lenhoso, endocarpo, placenta (cibirra), polpa mucilaginosa (°Brix/pH — substrato da fermentação) e semente (testa + gérmen + 2 cotilédones).", "Fases: Floração → Frutificação inicial (bilros) → Maturação."], "traps": ["Confundir CCN 51 com PS 1319: <strong>CCN 51<\/strong> = casca rugosa, sulcos profundos, semente mais pesada (1,76 g); <strong>PS 1319<\/strong> = casca lisa, sulcos rasos, precoce (1,43 g)."], "quiz": {"question": "Quais características distinguem o clone CCN 51 do PS 1319 na expansão da cacauicultura paulista?", "options": [{"text": "CCN 51 tem maior porte/vigor, casca rugosa com sulcos profundos e semente seca mais pesada (1,76 g vs. 1,43 g no PS 1319, que tem casca lisa e produção precoce).", "correct": true, "feedback": "Exato! E lembre que o rendimento depende de nº de sementes × massa seca por semente."}, {"text": "PS 1319 possui casca rugosa e semente mais pesada (1,76 g), enquanto CCN 51 tem casca lisa.", "correct": false, "hint": "Está trocado! CCN 51 = casca rugosa e 1,76 g; PS 1319 = casca lisa e 1,43 g."}]}}, {"id": "a8-2a", "bloco": "bloco2", "code": "2a", "shortTitle": "Fermentação e Secagem", "title": "2a. Beneficiamento: Bioquímica da Fermentação e Métodos de Secagem", "slidesRef": "Aula 8 · Seção 3", "diagramType": "a8_ferment", "logic": ["<strong>Fluxo de Beneficiamento:<\/strong> Colheita (frutos maduros) → Quebra (separação das sementes com polpa) → <strong>Fermentação<\/strong> → <strong>Secagem<\/strong>.", "<strong>Bioquímica em 3 Fases:<\/strong><br>1) <strong>Anaeróbia:<\/strong> leveduras + bactérias láticas consomem açúcares da polpa mucilaginosa → <strong>etanol<\/strong> e ácidos orgânicos.<br>2) <strong>Aeróbia (entrada de ar):<\/strong> bactérias acéticas oxidam etanol → <strong>ácido acético<\/strong> + elevação térmica (45–50 °C) penetram a semente.<br>3) <strong>Cotilédone:<\/strong> reações bioquímicas internas geram <strong>precursores de aroma e sabor<\/strong> para a torra!", "<strong>4 Variáveis no Cocho:<\/strong> <strong>tempo, temperatura, pH e revolvimento da massa<\/strong>.", "<strong>Secagem:<\/strong> Aberta (barata, depende do clima, mão de obra intensiva) • Estufa (menos contaminação, exige ventilação) • Industrial artificial (grandes volumes e controle, custo elevado)."], "applications": "Sem fermentação bem conduzida (especialmente o revolvimento para aeração), não se formam os precursores de aroma que reagem na torra via Maillard.", "checklist": ["Anaeróbia (leveduras/BAL → etanol) precede Aeróbia (BAA → ácido acético + calor).", "Sempre monitorar tempo, temperatura, pH e revolvimento no cocho."], "traps": ["Achar que o sabor do chocolate surge apenas na torra — a torra depende dos <strong>precursores<\/strong> gerados na fermentação!"], "quiz": {"question": "Quais são as duas etapas microbiológicas principais da fermentação do cacau e quais as quatro variáveis essenciais de controle no cocho?", "options": [{"text": "Anaeróbia (leveduras/BAL produzem etanol) seguida de Aeróbia (bactérias acéticas produzem ácido acético e calor); controle de tempo, temperatura, pH e revolvimento.", "correct": true, "feedback": "Perfeito! O ácido acético e o calor penetram o cotilédone gerando os precursores de sabor."}, {"text": "Apenas fermentação aeróbia direta por fungos, controlando somente a umidade do ar.", "correct": false, "hint": "A fermentação começa anaeróbia na polpa açucarada (etanol) e passa a aeróbia (ácido acético) com o revolvimento!"}]}}, {"id": "a8-2b", "bloco": "bloco2", "code": "2b", "shortTitle": "Torra, Moagem e Chocolate", "title": "2b. Processamento Industrial: Torra (Maillard), Prensagem e Fabricação", "slidesRef": "Aula 8 · Seção 4", "diagramType": "a8_choc", "logic": ["<strong>Duas Rotas para Nibs:<\/strong> Torrar amêndoa inteira → quebrar/descascar (separação por ar) <strong>OU<\/strong> quebrar/descascar primeiro → torrar nibs diretamente.", "<strong>Torra e Maillard:<\/strong> A <strong>reação de Maillard<\/strong> (açúcares redutores + compostos amino) forma os aromas característicos, define cor e volatiliza ácidos. Para comparar torras com rigor, usar o <strong>mesmo lote<\/strong> e registrar tempo e temperatura.", "<strong>Moagem &amp; Prensagem:<\/strong> Moagem dos nibs → <strong>massa / liquor de cacau<\/strong>. Prensagem da massa → <strong>manteiga de cacau<\/strong> + torta (moída vira <strong>cacau em pó<\/strong>).", "<strong>5 Etapas do Chocolate:<\/strong> (1) <strong>Mistura<\/strong> → (2) <strong>Refino<\/strong> (reduz partículas → maciez) → (3) <strong>Conchagem<\/strong> (sabor, textura, fluidez) → (4) <strong>Temperagem<\/strong> (cristalização controlada da manteiga de cacau) → (5) <strong>Dosagem/Moldagem<\/strong>."], "applications": "Composição qualitativa: <strong>Branco<\/strong> (sem massa de cacau; manteiga + leite + açúcar) vs. <strong>Meio amargo<\/strong> (massa de cacau predominante + manteiga + açúcar; sem leite).", "checklist": ["Refino = redução do tamanho de partículas.", "Conchagem = desenvolvimento de sabor, fluidez e homogeneização.", "Temperagem = cristalização controlada da manteiga de cacau."], "traps": ["Confundir a função da <strong>conchagem<\/strong> (sabor/fluidez) com a da <strong>temperagem<\/strong> (cristalização controlada da gordura)!"], "quiz": {"question": "Qual etapa da fabricação do chocolate é responsável por orientar a cristalização controlada da manteiga de cacau?", "options": [{"text": "Temperagem (realizada após a conchagem e antes da dosagem/moldagem).", "correct": true, "feedback": "Exato! Refino reduz partículas, conchagem desenvolve sabor/fluidez e temperagem controla a cristalização."}, {"text": "Refino, pois a moagem fina cristaliza a gordura automaticamente.", "correct": false, "hint": "O refino reduz tamanho de partícula; quem orienta a cristalização da manteiga de cacau é a temperagem!"}]}}, {"id": "a8-3a", "bloco": "bloco3", "code": "3a", "shortTitle": "Chocolate Ruby e Montoya (2021)", "title": "3a. Estudo de Caso: Chocolate Ruby, PFO, Antocianinas e Montoya et al. (2021)", "slidesRef": "Aula 8 · Seção 5", "diagramType": "a8_ruby", "logic": ["<strong>Rota Convencional vs. Rota Ruby (Patente):<\/strong> Amêndoas frescas têm <strong>antocianinas<\/strong> (violeta). Na rota convencional, fermentação/secagem/torra oxidam polifenóis → marrom. Na rota Ruby (Barry Callebaut), usa-se <strong>cacau pouco ou não fermentado + tratamento ácido<\/strong> (ácido cítrico, pH 2–4) preservando pigmentos vermelho/púrpura.", "<strong>Dois Mecanismos do pH:<\/strong><br>1) <strong>Inibição da PFO:<\/strong> polifenóis + O₂ —(PFO)→ quinonas → pigmentos escuros; em pH ácido a PFO cai (confirma-se medindo <strong>atividade residual da PFO<\/strong>).<br>2) <strong>Equilíbrio das Antocianinas:<\/strong> meio ácido desloca o equilíbrio para o <strong>cátion flavílio<\/strong> (cor avermelhada/rósea).", "<strong>Evidência de Montoya et al. (2021):<\/strong> Em amêndoas não fermentadas: <strong>só ácido cítrico 1,5 mol/L (S9)<\/strong> → perdeu a cor rósea! <strong>Branqueamento (95 °C/5 min) + ácido cítrico (S4)<\/strong> → <strong>reteve a cor rosa-avermelhada<\/strong>!"], "applications": "Delineamento experimental (4 tratamentos: Controle, Só branqueamento, Só ácido, Branqueamento + ácido) medindo <strong>pH<\/strong>, <strong>atividade residual da PFO<\/strong> e <strong>coordenada a* (CIELAB, eixo verde–vermelho)<\/strong>.", "checklist": ["Questão de sala: <em>'Se o a* aumentar e a atividade residual da PFO continuar igual, qual hipótese ganha força?'<\/em> → Ganha força o <strong>deslocamento do equilíbrio químico das antocianinas para o cátion flavílio<\/strong> (efeito do pH no pigmento), e NÃO a inibição da PFO!", "Ácido sozinho (S9) não bastou para reter a cor no pó de Montoya et al. — precisou de branqueamento + acidificação (S4)."], "traps": ["Achar que o ácido cítrico sozinho sempre retém a cor rosa no cacau em pó — Montoya et al. (2021) mostraram que a amostra S9 (só ácido) perdeu a tonalidade rósea!"], "quiz": {"question": "Na discussão experimental de Montoya et al. (2021), se o tratamento aumentar a coordenada a* (mais vermelho) mantendo a atividade residual da PFO igual, qual hipótese ganha força?", "options": [{"text": "A hipótese do equilíbrio químico das antocianinas favorecendo o cátion flavílio em meio ácido (efeito direto do pH sobre o pigmento, e não sobre a enzima PFO).", "correct": true, "feedback": "Excelente! Se a atividade residual da PFO não mudou, o ganho de cor vermelha (a*) vem do equilíbrio flavílio das antocianinas!"}, {"text": "A hipótese de que a PFO foi 100% inativada pelo calor.", "correct": false, "hint": "O enunciado diz justamente que a atividade residual da PFO continuou IGUAL!"}]}}]}}, "organica": {"topics": [{"id": "t1", "short": "Tópico 1 · Ligações e Funções", "tabShort": "Tópico 1", "badge": "Tópico 1", "title": "Estrutura Eletrônica, Hibridização, Ressonância e Funções Orgânicas", "subtitle": "Força vital, ligações, hibridização (C, N, O e alenos), Lewis, ressonância, cadeias e 22 funções orgânicas", "accent": "#ea580c", "tabBg": "#9a3412", "pillBg": "#ea580c", "toolsSummary": "3 Blocos + Guia de Funções (22) + Mapa (23 Qs)", "navButtons": [{"view": "bloco1", "label": "1. Ligações e Hibridização"}, {"view": "bloco2", "label": "2. Lewis, Ressonância e Isomeria"}, {"view": "bloco3", "label": "3. Cadeias e Funções Orgânicas"}, {"view": "funcoes", "label": "Guia de Funções (22 Grupos)"}, {"view": "listas", "label": "Mapa das Listas (23 Qs)"}], "footerHtml": "Baseado em <em>Tópico_1_Aulas (1).pdf<\/em>, <em>Introdução à Química Orgânica<\/em> (Almeida Barbosa, 2ª ed.) e nas listas de Fixação, Complementares e Revisão do Tópico 1 (sem gabarito pronto)."}, {"id": "t2", "short": "Tópico 2 · Ácidos, Bases e pKₐ", "tabShort": "Tópico 2", "badge": "Tópico 2", "title": "Ácidos e Bases Orgânicos, Estrutura × pKₐ, Nucleofilicidade e Eletrofilicidade", "subtitle": "Teorias ácido–base, extração, escala de pKₐ, efeito estrutural na acidez, nucleófilos e eletrófilos", "accent": "#059669", "tabBg": "#065f46", "pillBg": "#059669", "toolsSummary": "3 Blocos + Escala de pKₐ & Regras + Mapa (20 Qs)", "navButtons": [{"view": "bloco1", "label": "1. Ácidos, Bases e pKₐ"}, {"view": "bloco2", "label": "2. Estrutura × pKₐ"}, {"view": "bloco3", "label": "3. Nucleófilos e Eletrófilos"}, {"view": "simulador", "label": "Escala de pKₐ &amp; Regras"}, {"view": "listas", "label": "Mapa das Listas (20 Qs)"}], "footerHtml": "Baseado em <em>Tópico_2_Aulas (1).pdf<\/em>, <em>Introdução à Química Orgânica<\/em> (Almeida Barbosa, 2ª ed.) e nas listas de Exercícios de Fixação e Revisão do Tópico 2 (sem gabarito pronto)."}, {"id": "t3", "short": "Tópico 3 · Nomenclatura e Conformações", "tabShort": "Tópico 3", "badge": "Tópico 3", "title": "Nomenclatura IUPAC, Propriedades Físicas e Análise Conformacional", "subtitle": "IUPAC (2013/2024), forças intermoleculares, Newman, tensão de anéis, cicloexano (cadeira) e biciclos", "accent": "#0284c7", "tabBg": "#0369a1", "pillBg": "#0284c7", "toolsSummary": "3 Blocos + Simuladores (Anéis & Biciclos) + Mapa (30 Qs)", "navButtons": [{"view": "bloco1", "label": "1. Nomenclatura IUPAC"}, {"view": "bloco2", "label": "2. Propriedades Físicas e Fisiológicas"}, {"view": "bloco3", "label": "3. Conformações e Biciclos"}, {"view": "simuladores", "label": "Simuladores Rápidos"}, {"view": "listas", "label": "Mapa das Listas (30 Qs)"}], "footerHtml": "Baseado em <em>Tópico_3-otavio_chaves.pdf<\/em>, <em>Introdução à Química Orgânica<\/em> (Almeida Barbosa, 2ª ed.) e nas duas Listas de Exercícios de Fixação do Tópico 3 (sem gabarito pronto)."}, {"id": "t4", "short": "Tópico 4 · Alcenos e Reações", "tabShort": "Tópico 4", "badge": "Tópico 4", "title": "Alcenos: Estrutura, Estabilidade e Reatividade (Adições)", "subtitle": "IDH, isomeria Z/E (CIP), estabilidade, Markovnikov/radicalar, epóxidos, dióis e ozonólise", "accent": "#4f46e5", "tabBg": "#312e81", "pillBg": "#4f46e5", "toolsSummary": "3 Blocos + Decodificador de Reações + Mapa (12 Qs)", "navButtons": [{"view": "bloco1", "label": "1. Estrutura e Propriedades"}, {"view": "bloco2", "label": "2. Estabilidade"}, {"view": "bloco3", "label": "3. Reatividade (Adições)"}, {"view": "tabela", "label": "Decodificador de Reações"}, {"view": "lista", "label": "Mapa da Lista (12 Qs)"}], "footerHtml": "Baseado nos slides do Tópico 4 (Prof. Dr. Otávio Augusto Chaves), livro <em>Introdução à Química Orgânica<\/em> (Almeida Barbosa, 2ª ed.) e Lista de Exercícios de Fixação (sem gabarito pronto). Polimerização omitida conforme solicitado."}], "quickParams": [["Tópico 1 · Ligações e Funções", "Hibridização, Ressonância & Funções", "sp³ (4 σ, 109,47°, 1,54 Å), sp² (3 σ + 1 π, 120°, 1,33 Å), sp (2 σ + 2 π, 180°, 1,20 Å; C central do aleno = sp). Ressonância move apenas e⁻ π e pares livres (nunca átomos). C=O–N = amida (cíclica = lactama); C=O–O–R = éster (cíclica = lactona); C1 da D-glicose = hemiacetal; ligação glicosídica da sacarose = acetal."], ["Tópico 2 · Ácidos, Bases e pKₐ", "Equilíbrio, pKₐ & Nucleófilos", "Equilíbrio favorece o ácido mais fraco (maior pKₐ). Menor pKₐ = ácido mais forte = base conjugada mais estável (eletronegatividade no período, raio atômico na família, ressonância, efeito indutivo e caráter s: sp > sp² > sp³). Referências: RCOOH (~4–5), fenol (~10), H₂O/ROH (~15–18), RC≡CH (~25), RNH₂ (~35–38), alcanos (~50)."], ["Tópico 3 · Nomenclatura e Conformações", "IUPAC, Cicloexano & Biciclos", "Cadeia principal: mais grupos funcionais → mais insaturações → mais carbonos → menores localizantes. Cicloexano em cadeira elimina tensão angular; grupos volumosos preferem posição equatorial (reduz repulsão 1,3-diaxial). Biciclos [a.b.c] em ordem decrescente sem cabeças-de-ponte; nº de ciclos N = S − A + 1."], ["Tópico 4 · Alcenos e Reações", "IDH, Estabilidade & Adições", "IDH = (2C + 2 + N − H − X)/2. Estabilidade: tetra > tri > di trans > di cis > mono (e conjugados > isolados). H₂/Pd (syn); HX (Markovnikov + rearranjo; HBr/ROOR = anti-Markovnikov radicalar); X₂ (anti via halônio); AMCPB → epóxido (ácido abre no C mais substituído; básico no menos); OsO₄/KMnO₄ frio → diol cis; O₃ + Me₂S/Zn → aldeídos/cetonas."]]}}</script>

          "<strong>Regra do Octeto e Ligações (Slide 12):</strong><br>• <strong>Ligação Covalente</strong> (não metal + não metal): compartilhamento de pares de elétrons (valências neutras usuais: <strong>C = 4, N = 3, O = 2, F/Cl/Br/I/H = 1</strong>).<br>• <strong>Ligação Iônica</strong> (metal + não metal): transferência de elétrons gerando íons mantidos pela <strong>Lei de Coulomb</strong> (<strong>F = k · q₁·q₂ / d²</strong>).",

        logic: [
          "<strong>Por que hibridizar (Slide 13)?</strong> No estado fundamental (⁶C: 1s² 2s² 2p²), o carbono só teria 2 elétrons desemparelhados. A mistura (hibridização) dos orbitais 2s e 2p cria orbitais híbridos degenerados que explicam a tetravalência e os ângulos reais.",

    function bindDynamicEvents() {
      __doc.querySelectorAll(".sub-pill").forEach(btn => {
        btn.addEventListener("click", () => { state.activeTopicByBlock[state.view] = btn.dataset.topic; render(); });
      });
      const toggleBtn = __doc.getElementById("toggleMasteredBtn");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          const id = toggleBtn.dataset.id;
          state.mastered[id] = !state.mastered[id];
          saveMastered();
          render();
        });
      }
      __doc.querySelectorAll(".quiz-opt").forEach(btn => {
        btn.addEventListener("click", () => { state.quizSelections[btn.dataset.quizTopic] = Number(btn.dataset.quizOpt); render(); });
      });
      __doc.querySelectorAll(".fcat-btn").forEach(btn => {
        btn.addEventListener("click", () => { state.funcCat = btn.dataset.fcat; render(); });
      });
      __doc.querySelectorAll(".lf-btn").forEach(btn => {
        btn.addEventListener("click", () => { state.listFilter = btn.dataset.lf; render(); });
      });
      __doc.querySelectorAll(".jump-btn").forEach(btn => {

          const found = TOPICS.find(t => t.id === btn.dataset.jump);
          if (found) { state.view = found.bloco; state.activeTopicByBlock[found.bloco] = found.id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        });
      });
      const prevBtn = __doc.getElementById("prevTopicBtn");
      const nextBtn = __doc.getElementById("nextTopicBtn");
      if (prevBtn || nextBtn) {
        const blockTopics = TOPICS.filter(t => t.bloco === state.view);
        const curIdx = blockTopics.findIndex(t => t.id === state.activeTopicByBlock[state.view]);
        if (prevBtn) prevBtn.addEventListener("click", () => {
          if (curIdx > 0) { state.activeTopicByBlock[state.view] = blockTopics[curIdx - 1].id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        });
        if (nextBtn) nextBtn.addEventListener("click", () => {
          if (curIdx < blockTopics.length - 1) { state.activeTopicByBlock[state.view] = blockTopics[curIdx + 1].id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        });
      }

    function render() {
      __doc.querySelectorAll(".nav-btn").forEach(btn => {
        const active = btn.dataset.view === state.view;
        btn.className = `nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-colors ${active ? 'tab-btn-active' : 'text-slate-700 bg-slate-100 hover:bg-slate-200'}`;
      });
      const root = __doc.getElementById("appRoot");
      if (state.view === "bloco1" || state.view === "bloco2" || state.view === "bloco3") {
        root.innerHTML = renderBlockView(state.view);
      } else if (state.view === "simulador") {
        root.innerHTML = renderScaleView();
      } else {
        root.innerHTML = renderListsView();
      }
      updateProgressUI();
      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      __doc.querySelectorAll(".sub-pill").forEach(btn => {
        btn.addEventListener("click", () => { state.activeTopicByBlock[state.view] = btn.dataset.topic; render(); });
      });
      const toggleBtn = __doc.getElementById("toggleMasteredBtn");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          const id = toggleBtn.dataset.id;
          state.mastered[id] = !state.mastered[id];
          saveMastered();
          render();
        });
      }
      __doc.querySelectorAll(".quiz-opt").forEach(btn => {
        btn.addEventListener("click", () => { state.quizSelections[btn.dataset.quizTopic] = Number(btn.dataset.quizOpt); render(); });
      });
      __doc.querySelectorAll(".lf-btn").forEach(btn => {
        btn.addEventListener("click", () => { state.listFilter = btn.dataset.lf; render(); });
      });
      __doc.querySelectorAll(".jump-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const found = TOPICS.find(t => t.id === btn.dataset.jump);
          if (found) { state.view = found.bloco; state.activeTopicByBlock[found.bloco] = found.id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        });
      });
      const prevBtn = __doc.getElementById("prevTopicBtn");
      const nextBtn = __doc.getElementById("nextTopicBtn");
      if (prevBtn || nextBtn) {
        const blockTopics = TOPICS.filter(t => t.bloco === state.view);
        const curIdx = blockTopics.findIndex(t => t.id === state.activeTopicByBlock[state.view]);
        if (prevBtn) prevBtn.addEventListener("click", () => {
          if (curIdx > 0) { state.activeTopicByBlock[state.view] = blockTopics[curIdx - 1].id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        });
        if (nextBtn) nextBtn.addEventListener("click", () => {
          if (curIdx < blockTopics.length - 1) { state.activeTopicByBlock[state.view] = blockTopics[curIdx + 1].id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        });
      }
    }


      return {
        id: "t2",
        getProgress() {
          return {
            done: Object.values(state.mastered).filter(Boolean).length,
            total: TOPICS.length
          };
        },
        getSearchDocs() {
          const docs = [];
          TOPICS.forEach(t => {
            const parts = [
              t.title,
              t.shortTitle,
              t.slidesRef,
              Array.isArray(t.logic) ? t.logic.join(' ') : t.logic,
              t.applications,
              Array.isArray(t.checklist) ? t.checklist.join(' ') : '',
              Array.isArray(t.pillars) ? t.pillars.map(p => (p.title || '') + ' ' + (p.desc || '')).join(' ') : '',
              t.exercises,
              Array.isArray(t.traps) ? t.traps.join(' ') : '',
              t.quiz ? (t.quiz.question + ' ' + (t.quiz.options || []).map(o => o.text + ' ' + (o.feedback || '') + ' ' + (o.hint || '')).join(' ')) : ''
            ];
            docs.push({
              view: t.bloco,
              topicId: t.id,
              tabLabel: t.shortTitle || t.code || t.bloco,
              text: __stripHtml(parts.filter(Boolean).join(' · '))
            });
          });
          
            if (typeof PKA_SCALE !== 'undefined') {
              PKA_SCALE.forEach(p => {
                docs.push({ view: 'simulador', topicId: null, tabLabel: 'Escala de pKₐ', text: [p.name, p.formula, 'pKa ' + p.pka, p.base, p.note].filter(Boolean).join(' — ') });
              });
            }
            if (typeof LIST_ACID_BASE !== 'undefined') {
              LIST_ACID_BASE.forEach(item => {
                docs.push({ view: 'listas', topicId: null, tabLabel: 'Mapa das Listas', text: [item.q, item.title, item.hint].filter(Boolean).join(' — ') });
              });
            }
            if (typeof LIST_REV_T2 !== 'undefined') {
              LIST_REV_T2.forEach(item => {
                docs.push({ view: 'listas', topicId: null, tabLabel: 'Mapa das Listas', text: [item.q, item.title, item.hint].filter(Boolean).join(' — ') });
              });
            }
            
          return docs;
        },
        mount(hostEl, opts) {
          __host = hostEl;
          __onProgress = opts && opts.onProgress ? opts.onProgress : null;
          if (opts && opts.topicId) {
            const found = TOPICS.find(t => t.id === opts.topicId);
            if (found) {
              state.view = found.bloco;
              state.activeTopicByBlock[found.bloco] = found.id;
            }
          } else if (opts && opts.view) {
            state.view = opts.view;
          }
          __doc.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              state.view = btn.dataset.view;
              render();
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
          });
          render();
        },
        unmount() {
          __host = null;
          __onProgress = null;
        }
      };
    })();

    function updateProgressUI() {

      const done = Object.values(state.mastered).filter(Boolean).length;
      __doc.getElementById("progressText").textContent = `${done} / ${total} dominados`;
      __doc.getElementById("progressBar").style.width = `${Math.round((done / total) * 100)}%`;
      if (typeof __onProgress === "function") __onProgress(done, total);
    }

    function renderBlockView(blocoKey) {
      const blockTopics = TOPICS.filter(t => t.bloco === blocoKey);
      const activeId = state.activeTopicByBlock[blocoKey];
      const topic = blockTopics.find(t => t.id === activeId) || blockTopics[0];
      const idx = blockTopics.findIndex(t => t.id === topic.id);
      const isDone = !!state.mastered[topic.id];
      const selectedOpt = state.quizSelections[topic.id];

      const pillsHtml = blockTopics.map(t => {
        const active = t.id === topic.id;
        const done = !!state.mastered[t.id];
        return `
          <button type="button" data-topic="${t.id}" class="sub-pill px-3 py-1.5 rounded-full text-xs font-semibold border transition-all flex items-center gap-1.5 ${active ? 'sub-pill-active' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">
            <span>${t.code}. ${t.shortTitle}</span>
            ${done ? '<span class="text-emerald-400 font-bold">✓</span>' : ''}
          </button>
        `;
      }).join("");

      const quizOptionsHtml = topic.quiz.options.map((opt, oIdx) => {
        const isSelected = selectedOpt === oIdx;
        let btnClass = "bg-white border-slate-200 hover:border-sky-400 text-slate-800";
        if (isSelected) {
          btnClass = opt.correct
            ? "bg-emerald-50 border-emerald-500 text-emerald-900 ring-1 ring-emerald-500"
            : "bg-amber-50 border-amber-500 text-amber-900 ring-1 ring-amber-500";
        }
        return `
          <button type="button" data-quiz-topic="${topic.id}" data-quiz-opt="${oIdx}" class="quiz-opt w-full text-left p-3 rounded-lg border text-sm transition-all ${btnClass}">
            <span class="font-bold mr-1.5">${String.fromCharCode(65 + oIdx)})</span> ${opt.text}
          </button>
        `;
      }).join("");

      let quizFeedbackHtml = "";

    function updateProgressUI() {
      const total = TOPICS.length;
      const done = Object.values(state.mastered).filter(Boolean).length;
      __doc.getElementById("progressText").textContent = `${done} / ${total} dominados`;
      __doc.getElementById("progressBar").style.width = `${Math.round((done / total) * 100)}%`;
      if (typeof __onProgress === "function") __onProgress(done, total);
    }

                ${topic.logic.map(item => `<li class="flex items-start gap-2.5"><span class="w-1.5 h-1.5 rounded-full bg-indigo-600 mt-2 shrink-0"></span><span>${item}</span></li>`).join("")}

                <h3 class="text-xs font-extrabold text-amber-900 uppercase tracking-wide mb-2">4. Pegadinhas Clássicas</h3>

              <button type="button" id="prevTopicBtn" ${idx === 0 ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold border border-slate-300 text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">

              <span class="text-xs text-slate-500 font-medium">${idx + 1} de ${blockTopics.length} neste bloco</span>
              <button type="button" id="nextTopicBtn" ${idx === blockTopics.length - 1 ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed">
                Próximo subtópico →
              </button>
            </div>
          </article>
        </div>
      `;
    }

      const q = state.tableSearch.trim().toLowerCase();
      const filtered = REACTION_TABLE.filter(r => {
        const matchStereo = state.tableFilterStereo === "todos" || r.stereo === state.tableFilterStereo;
        const matchRearr = state.tableFilterRearranjo === "todos" || r.rearranjo === state.tableFilterRearranjo;
        const matchText = !q || [r.name, r.reagents, r.entra, r.onde, r.produto].join(" ").toLowerCase().includes(q);
        return matchStereo && matchRearr && matchText;
      });

      const rowsHtml = filtered.length ? filtered.map(r => `
        <tr class="border-b border-slate-100 hover:bg-slate-50">

              <select id="rearrFilter" class="px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="todos" ${state.tableFilterRearranjo==='todos'?'selected':''}>Rearranjo: Todos</option>
                <option value="Sim" ${state.tableFilterRearranjo==='Sim'?'selected':''}>⚠ Somente com risco de rearranjo</option>
                <option value="Não" ${state.tableFilterRearranjo==='Não'?'selected':''}>Somente sem rearranjo</option>
              </select>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
            <table class="w-full text-left text-xs sm:text-sm border-collapse min-w-[720px]">
              <thead>
                <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                  <th class="p-3 font-bold">Reação</th>
                  <th class="p-3 font-bold">Reagentes</th>
                  <th class="p-3 font-bold">O que entra</th>
                  <th class="p-3 font-bold">Onde entra / Rearranjo</th>
                  <th class="p-3 font-bold">Por qual lado</th>
                  <th class="p-3 font-bold">Produto</th>

    function renderListView() {
      return `
        <div class="fade-in space-y-4">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
            <h2 class="text-xl font-extrabold text-slate-900">Mapa Completo da Lista de Exercícios (12 Questões)</h2>
            <p class="text-sm text-slate-600 mt-1">Conforme você pediu, aqui está apenas o <strong>raciocínio mecanístico</strong> para destravar cada questão (sem gabarito pronto). Clique no botão de qualquer questão para ir direto à teoria dela.</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${EXERCISE_MAP.map(item => `
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex flex-col justify-between gap-3">
                <div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-indigo-100 text-indigo-800">${item.q} · ${item.bloco}</span>
                    <span class="text-xs font-semibold text-slate-500">Subtópico ${item.topicId}</span>
                  </div>
                  <h3 class="text-sm sm:text-base font-bold text-slate-900 mt-2">${item.title}</h3>

                </div>
                <div>
                  <button type="button" data-jump="${item.topicId}" class="jump-btn text-xs font-bold text-indigo-700 hover:text-indigo-900 underline">
