              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // RENDER PRINCIPAL E EVENTOS
    // =========================================================================
    function render() {
      // Atualiza nav principal
      __doc.querySelectorAll(".nav-btn").forEach(btn => {
        const active = btn.dataset.view === state.view;
        btn.className = `nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-colors ${active ? 'tab-btn-active' : 'text-slate-700 bg-slate-100 hover:bg-slate-200'}`;
      });

      const root = __doc.getElementById("appRoot");
      if (state.view === "bloco1" || state.view === "bloco2" || state.view === "bloco3") {
        root.innerHTML = renderBlockView(state.view);
      } else if (state.view === "tabela") {
        root.innerHTML = renderTableView();
      } else {
        root.innerHTML = renderListView();
      }

      updateProgressUI();
      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      __doc.querySelectorAll(".sub-pill").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeTopicByBlock[state.view] = btn.dataset.topic;
          render();
        });
      });

      const toggleBtn = __doc.getElementById("toggleMasteredBtn");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          const id = toggleBtn.dataset.id;
          state.mastered[id] = !state.mastered[id];
          saveMastered();
          render();
        });
      }

      __doc.querySelectorAll(".quiz-opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const tid = btn.dataset.quizTopic;
          const oIdx = Number(btn.dataset.quizOpt);
          state.quizSelections[tid] = oIdx;
          render();
        });
      });

      __doc.querySelectorAll(".epox-toggle").forEach(btn => {
        btn.addEventListener("click", () => {
          state.epoxideMode = btn.dataset.epoxide;
          render();
        });
      });

      __doc.querySelectorAll(".ozono-toggle").forEach(btn => {
        btn.addEventListener("click", () => {
          state.ozonoMode = btn.dataset.ozono;
          render();
        });
      });

      __doc.querySelectorAll(".hx-toggle").forEach(btn => {
        btn.addEventListener("click", () => {
          state.hxMode = btn.dataset.hx;
          render();
        });
      });

      const prevBtn = __doc.getElementById("prevTopicBtn");
      const nextBtn = __doc.getElementById("nextTopicBtn");
      if (prevBtn || nextBtn) {
        const blockTopics = TOPICS.filter(t => t.bloco === state.view);
        const curIdx = blockTopics.findIndex(t => t.id === state.activeTopicByBlock[state.view]);
        if (prevBtn) {
          prevBtn.addEventListener("click", () => {
            if (curIdx > 0) {
              state.activeTopicByBlock[state.view] = blockTopics[curIdx - 1].id;
              render();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }
        if (nextBtn) {
          nextBtn.addEventListener("click", () => {
            if (curIdx < blockTopics.length - 1) {
              state.activeTopicByBlock[state.view] = blockTopics[curIdx + 1].id;
              render();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }
      }

      const searchInput = __doc.getElementById("tableSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          state.tableSearch = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const el = __doc.getElementById("tableSearchInput");
          if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        });
      }

      const stereoSel = __doc.getElementById("stereoFilter");
      if (stereoSel) {
        stereoSel.addEventListener("change", (e) => {
          state.tableFilterStereo = e.target.value;
          render();
        });
      }

      const rearrSel = __doc.getElementById("rearrFilter");
      if (rearrSel) {
        rearrSel.addEventListener("change", (e) => {
          state.tableFilterRearranjo = e.target.value;
          render();
        });
      }

      __doc.querySelectorAll(".jump-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const tid = btn.dataset.jump;
          const found = TOPICS.find(t => t.id === tid);
          if (found) {
            state.view = found.bloco;
            state.activeTopicByBlock[found.bloco] = found.id;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
      });
    }


      return {
        id: "t4",
        getProgress() {
          return {
            done: Object.values(state.mastered).filter(Boolean).length,
            total: TOPICS.length
          };
        },
        getSearchDocs() {
          const docs = [];
          TOPICS.forEach(t => {
            const parts = [
              t.title,
              t.shortTitle,
              t.slidesRef,
              Array.isArray(t.logic) ? t.logic.join(' ') : t.logic,
              t.applications,
              Array.isArray(t.checklist) ? t.checklist.join(' ') : '',
              Array.isArray(t.pillars) ? t.pillars.map(p => (p.title || '') + ' ' + (p.desc || '')).join(' ') : '',
              t.exercises,
              Array.isArray(t.traps) ? t.traps.join(' ') : '',
              t.quiz ? (t.quiz.question + ' ' + (t.quiz.options || []).map(o => o.text + ' ' + (o.feedback || '') + ' ' + (o.hint || '')).join(' ')) : ''
            ];
            docs.push({
              view: t.bloco,
              topicId: t.id,
              tabLabel: t.shortTitle || t.code || t.bloco,
              text: __stripHtml(parts.filter(Boolean).join(' · '))
            });
          });
          
            if (typeof REACTION_TABLE !== 'undefined') {
              REACTION_TABLE.forEach(r => {
                docs.push({ view: 'tabela', topicId: null, tabLabel: 'Decodificador de Reações', text: [r.name, r.reagents, r.entra, r.onde, r.stereo, r.produto].filter(Boolean).join(' — ') });
              });
            }
            if (typeof EXERCISE_MAP !== 'undefined') {
              EXERCISE_MAP.forEach(item => {
                docs.push({ view: 'lista', topicId: null, tabLabel: 'Mapa da Lista', text: [item.q, item.title, item.hint].filter(Boolean).join(' — ') });
              });
            }
            
          return docs;
        },
        mount(hostEl, opts) {
          __host = hostEl;
          __onProgress = opts && opts.onProgress ? opts.onProgress : null;
          if (opts && opts.topicId) {
            const found = TOPICS.find(t => t.id === opts.topicId);
            if (found) {
              state.view = found.bloco;
              state.activeTopicByBlock[found.bloco] = found.id;
            }
          } else if (opts && opts.view) {
            state.view = opts.view;
          }
          __doc.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              state.view = btn.dataset.view;
              render();
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
          });
          render();
        },
        unmount() {
          __host = null;
          __onProgress = null;
        }
      };
    })();
    
    })();

function renderFrutasDiagram(type) {

      const FRUTAS_STORAGE_KEY = 'frutas_study_state_v1';
      const FRUTAS_MASTERED_KEY = 'frutas_mastered_subtopics_v1';
      const PREFS_STORAGE_KEY = 'portal_study_prefs_v1';

      let activeQoModule = null;

      let state = {
        screen: IS_PORTAL ? 'portal-home' : (HAS_FRUTAS ? 'frutas-home' : 'organica-home'),

        qoTopicId: 't1',
        qoInitialView: null,
        qoInitialSubId: null,
        completedFrutas: {},
        notesFrutas: {},
        revealedFrutas: {},
        dark: false,
        fontSize: 15.5,
        searchQuery: ''
      };

      function loadState() {
        try {
          const rawF = localStorage.getItem(FRUTAS_STORAGE_KEY);
          if (rawF) {
            const pf = JSON.parse(rawF);
            state.completedFrutas = pf.completed || {};
            state.notesFrutas = pf.notes || {};
            if (typeof pf.dark === 'boolean') state.dark = pf.dark;
            if (typeof pf.fontSize === 'number') state.fontSize = pf.fontSize;
          }
        } catch (e) {}
        try {
          const rawFM = localStorage.getItem(FRUTAS_MASTERED_KEY);
          if (rawFM) state.frutasMastered = JSON.parse(rawFM) || {};
        } catch (e) {}
        try {
          const rawP = localStorage.getItem(PREFS_STORAGE_KEY);
          if (rawP) {
            const pp = JSON.parse(rawP);
            if (typeof pp.dark === 'boolean') state.dark = pp.dark;
            if (typeof pp.fontSize === 'number') state.fontSize = pp.fontSize;
          }
        } catch (e) {}
      }

      function saveState() {
        try {
          localStorage.setItem(PREFS_STORAGE_KEY, JSON.stringify({
            dark: state.dark,
            fontSize: state.fontSize
          }));
          if (HAS_FRUTAS) {
            localStorage.setItem(FRUTAS_STORAGE_KEY, JSON.stringify({
              completed: state.completedFrutas,
              notes: state.notesFrutas,
              dark: state.dark,
              fontSize: state.fontSize
            }));
            localStorage.setItem(FRUTAS_MASTERED_KEY, JSON.stringify(state.frutasMastered));
          }
        } catch (e) {}
      }

      function applyThemeAndFont() {
        document.documentElement.classList.toggle('dark', state.dark);
        document.documentElement.style.setProperty('--study-font-size', state.fontSize + 'px');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function highlightText(text, query) {
        const safe = escapeHtml(text);
        if (!query || query.trim().length < 2) return safe;
        const escapedQ = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        try {
          const re = new RegExp('(' + escapedQ + ')', 'gi');
          return safe.replace(re, '<mark class="hl">$1</mark>');
        } catch (e) {
          return safe;
        }
      }

      function formatRichText(text, query) {
        let htmlStr = highlightText(text, query);
        if (/^Termos-chave/i.test(text.trim())) {
          const idx = text.indexOf(':');
          if (idx !== -1) {
            const label = escapeHtml(text.slice(0, idx + 1));
            const rest = text.slice(idx + 1).trim();
            const chips = rest.split(/[;•]/).map(s => s.trim()).filter(Boolean);
            if (chips.length >= 2) {
              return `<div class="mt-3 p-3.5 rounded-xl bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60">
                <div class="text-xs font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-300 mb-2">${label}</div>
                <div class="flex flex-wrap gap-1.5">${chips.map(c => `<span class="inline-block px-2.5 py-1 rounded-lg text-xs font-medium bg-white dark:bg-slate-900 text-emerald-800 dark:text-emerald-200 border border-emerald-200/80 dark:border-emerald-800">${highlightText(c, query)}</span>`).join('')}</div>
              </div>`;
            }
          }
        }
        const colonIdx = text.indexOf(':');
        if (colonIdx > 2 && colonIdx < 52 && !/^https?:/i.test(text)) {
          const lead = highlightText(text.slice(0, colonIdx + 1), query);
          const body = highlightText(text.slice(colonIdx + 1), query);
          return `<strong class="font-semibold text-slate-900 dark:text-white">${lead}</strong>${body}`;
        }
        return htmlStr;
      }

      function renderBlocks(blocks, query, prefixId) {
        let out = '';
        let inList = false;
        let headingIdx = 0;

        function closeList() {
          if (inList) {
            out += '</ul>';
            inList = false;
          }
        }

        blocks.forEach((b) => {
          if (b.type === 'bullet') {
            if (!inList) {
              out += '<ul class="list-disc pl-5 space-y-2 mb-4 text-slate-700 dark:text-slate-300">';
              inList = true;
            }
            out += `<li>${formatRichText(b.text, query)}</li>`;
            return;
          }
          closeList();

          if (b.type === 'h2') {
            headingIdx++;
            const hid = `${prefixId}-sec-${headingIdx}`;
            out += `<h2 id="${hid}" class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white mt-8 mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">${highlightText(b.text, query)}</h2>`;
          } else if (b.type === 'h3') {
            out += `<h3 class="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 mt-5 mb-2">${highlightText(b.text, query)}</h3>`;
          } else if (b.type === 'p') {
            const rendered = formatRichText(b.text, query);
            if (rendered.startsWith('<div')) {
              out += rendered;
            } else {
              out += `<p class="text-slate-700 dark:text-slate-300">${rendered}</p>`;
            }
          } else if (b.type === 'table' && b.rows && b.rows.length) {
            const head = b.rows[0];
            const body = b.rows.slice(1);
            out += `<div class="my-5 overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xs">
              <table class="study-table">
                <thead class="bg-slate-100/90 dark:bg-slate-800/90 text-slate-800 dark:text-slate-200 border-b border-slate-200 dark:border-slate-700">
                  <tr>${head.map(c => `<th class="border-r last:border-r-0 border-slate-200/70 dark:border-slate-700/70">${highlightText(c, query)}</th>`).join('')}</tr>
                </thead>
                <tbody class="divide-y divide-slate-200/80 dark:divide-slate-800">
                  ${body.map(r => `<tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors">${r.map((c, ci) => `<td class="${ci === 0 ? 'font-medium text-slate-900 dark:text-slate-100' : 'text-slate-700 dark:text-slate-300'} border-r last:border-r-0 border-slate-100 dark:border-slate-800/70">${highlightText(c, query)}</td>`).join('')}</tr>`).join('')}
                </tbody>
              </table>
            </div>`;
          }
        });
        closeList();
        return out;
      }

      function getFrutasLecProgress(lecId) {
        const cfg = FRUTAS_INT[lecId];
        if (!cfg || !cfg.topics) return { done: 0, total: 0 };
        const total = cfg.topics.length;
        const done = cfg.topics.filter(t => !!state.frutasMastered[t.id]).length;
        return { done, total };
      }

      function getFrutasProgress() {
        let done = 0;
        let total = 0;
        LECTURES.forEach(l => {
          const p = getFrutasLecProgress(l.id);
          done += p.done;
          total += p.total;
        });
        return { done, total };
      }

      function getQoTopicProgress(id) {
        const mod = QO_MODULES[id];
        return mod ? mod.getProgress() : { done: 0, total: 0 };
      }

      function getQoTotalProgress() {
        let done = 0;
        let total = 0;
        QO_TOPICS.forEach(t => {
          const p = getQoTopicProgress(t.id);
          done += p.done;
          total += p.total;
        });
        return { done, total };
      }

        const subEl = document.getElementById('brand-subtitle');

                    <tr>
                      <th class="w-48">Módulo</th>
                      <th class="w-52">Eixo Crítico</th>
                      <th>Parâmetros e Conceitos-Chave</th>

                  <tbody class="divide-y divide-slate-200/80 dark:divide-slate-800">
                    ${FRUTAS_PARAMS.map(row => `
                      <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                        <td class="font-semibold text-slate-900 dark:text-white">${escapeHtml(row[0])}</td>
                        <td class="font-medium text-emerald-700 dark:text-emerald-400">${escapeHtml(row[1])}</td>

                </table>
              </div>
            </section>
          </div>
        `;
      }

      function renderFrutasBlockCard(lec, cfg, blocoKey) {
        const blockTopics = cfg.topics.filter(t => t.bloco === blocoKey);
        if (!blockTopics.length) return '';
        const key = `${lec.id}_${blocoKey}`;
        const activeId = state.frutasActiveSub[key] || blockTopics[0].id;
        const topic = blockTopics.find(t => t.id === activeId) || blockTopics[0];
        const idx = blockTopics.findIndex(t => t.id === topic.id);
        const isDone = !!state.frutasMastered[topic.id];
        const selectedOpt = state.frutasQuizSel[topic.id];

        const pillsHtml = blockTopics.map(t => {
          const active = t.id === topic.id;
          const done = !!state.frutasMastered[t.id];
          return `
            <button type="button" data-fr-sub="${t.id}" data-fr-bkey="${key}"
              class="px-3 py-1.5 rounded-full text-xs font-semibold border transition-all flex items-center gap-1.5 ${active ? 'sub-pill-active shadow-xs' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-emerald-400 dark:hover:border-emerald-600'}">
              <span>${escapeHtml(t.code)} · ${escapeHtml(t.shortTitle)}</span>
              ${done ? `<span class="inline-flex items-center justify-center w-4 h-4 rounded-full text-[10px] ${active ? 'bg-white/25 text-white' : 'bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300'}">✓</span>` : ''}
            </button>
          `;
        }).join('');

        const diagramHtml = topic.diagramType && topic.diagramType !== 'none'
          ? `<div class="mb-5">${renderFrutasDiagram(topic.diagramType)}</div>`
          : '';

        const quizOptionsHtml = topic.quiz.options.map((opt, oIdx) => {
          const isSelected = selectedOpt === oIdx;
          let cls = 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-emerald-400 dark:hover:border-emerald-500 text-slate-800 dark:text-slate-200';
          if (isSelected) {
            cls = opt.correct
              ? 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-200 ring-1 ring-emerald-500'
              : 'bg-amber-50 dark:bg-amber-950/50 border-amber-500 text-amber-900 dark:text-amber-200 ring-1 ring-amber-500';
          }
          return `
            <button type="button" data-fr-quiz="${topic.id}" data-fr-opt="${oIdx}"
              class="w-full text-left p-3.5 rounded-xl border text-sm transition-all cursor-pointer ${cls}">
              <div class="flex items-start gap-2.5">
                <span class="shrink-0 w-6 h-6 rounded-full border text-xs font-bold flex items-center justify-center mt-0.5 ${isSelected ? (opt.correct ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-amber-500 border-amber-500 text-white') : 'border-slate-300 dark:border-slate-600 text-slate-500 dark:text-slate-400'}">${String.fromCharCode(65 + oIdx)}</span>
                <span class="leading-relaxed">${escapeHtml(opt.text)}</span>
              </div>
            </button>
          `;
        }).join('');

        let quizFeedbackHtml = '';
        if (selectedOpt !== undefined && topic.quiz.options[selectedOpt]) {
          const chosen = topic.quiz.options[selectedOpt];
          quizFeedbackHtml = chosen.correct
            ? `<div class="mt-3 p-3.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-sm text-emerald-900 dark:text-emerald-200"><strong>✓ Correto!</strong> ${escapeHtml(chosen.feedback)}</div>`
            : `<div class="mt-3 p-3.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-sm text-amber-900 dark:text-amber-200"><strong>💡 Dica:</strong> ${escapeHtml(chosen.hint)}</div>`;
        }

        return `
          <div id="frutasBlockRoot" class="fade-in space-y-5">
            <!-- Sub-topic Pills -->
            <div class="flex flex-wrap gap-2 no-print">${pillsHtml}</div>

            <!-- Main Organic-Style Topic Card -->
            <article class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xs overflow-hidden">
              <!-- Card Header -->
              <div class="p-5 sm:p-6 border-b border-slate-100 dark:border-slate-800 flex flex-wrap items-start justify-between gap-3">
                <div>
                  <div class="flex flex-wrap items-center gap-2 mb-1.5">
                    <span class="px-2 py-0.5 rounded-md text-xs font-bold text-white" style="background:${cfg.accent}">${escapeHtml(topic.code)}</span>
                    <span class="text-xs font-medium text-slate-500 dark:text-slate-400">${escapeHtml(topic.slidesRef)}</span>
                  </div>
                  <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">${escapeHtml(topic.title)}</h2>
                </div>
                <button type="button" data-fr-master="${topic.id}" class="no-print inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold border transition cursor-pointer ${isDone ? 'bg-emerald-600 text-white border-emerald-600 hover:bg-emerald-700' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-emerald-400'}">
                  ${isDone ? '✓ Dominado' : 'Marcar como Dominado'}
                </button>
              </div>

              <div class="p-5 sm:p-6 space-y-5">
                ${diagramHtml}

                <!-- Logic / Theory -->
                <div class="space-y-2.5">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Lógica e Fundamentos</h3>
                  <div class="grid grid-cols-1 gap-2.5">
                    ${topic.logic.map((item, li) => `
                      <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80 border-l-4 text-sm text-slate-800 dark:text-slate-200 leading-relaxed flex items-start gap-3" style="border-left-color:${cfg.accent}">
                        <span class="shrink-0 w-5 h-5 rounded-full text-[11px] font-bold flex items-center justify-center text-white mt-0.5" style="background:${cfg.accent}">${li + 1}</span>
                        <div class="min-w-0">${item}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <!-- Applications -->
                <div class="p-4 rounded-xl bg-sky-50/80 dark:bg-sky-950/35 border border-sky-200 dark:border-sky-800/60">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-800 dark:text-sky-300 mb-1.5">Aplicação Industrial e Engenharia</div>
                  <p class="text-sm text-sky-950 dark:text-sky-100 leading-relaxed">${topic.applications}</p>
                </div>

                <!-- Checklist & Traps Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="p-4 rounded-xl bg-emerald-50/80 dark:bg-emerald-950/35 border border-emerald-200 dark:border-emerald-800/60">
                    <div class="text-xs font-bold uppercase tracking-wider text-emerald-800 dark:text-emerald-300 mb-2">Checklist de Prova</div>
                    <ul class="space-y-1.5 text-sm text-emerald-950 dark:text-emerald-100">
                      ${topic.checklist.map(c => `<li class="flex items-start gap-2"><span class="text-emerald-600 dark:text-emerald-400 font-bold">✓</span><span>${c}</span></li>`).join('')}
                    </ul>
                  </div>

                  <div class="p-4 rounded-xl bg-amber-50/80 dark:bg-amber-950/35 border border-amber-200 dark:border-amber-800/60">
                    <div class="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-300 mb-2">Pegadinhas de Prova</div>
                    <ul class="space-y-1.5 text-sm text-amber-950 dark:text-amber-100">
                      ${topic.traps.map(tr => `<li class="flex items-start gap-2"><span class="text-amber-600 dark:text-amber-400 font-bold">⚠</span><span>${tr}</span></li>`).join('')}
                    </ul>
                  </div>
                </div>

                <!-- Interactive Mini-Quiz -->
                <div class="p-4 sm:p-5 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 no-print">
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-700 dark:text-indigo-300">Mini-Quiz de Fixação</span>
                    <span class="text-[11px] text-slate-500 dark:text-slate-400">Clique para testar</span>
                  </div>
                  <p class="text-sm font-semibold text-slate-900 dark:text-white mb-3">${escapeHtml(topic.quiz.question)}</p>
                  <div class="space-y-2">${quizOptionsHtml}</div>
                  ${quizFeedbackHtml}
                </div>
              </div>

              <!-- Subtopic Prev / Next -->
              <div class="px-5 sm:px-6 py-3.5 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between no-print">
                <button type="button" data-fr-sub="${idx > 0 ? blockTopics[idx - 1].id : ''}" data-fr-bkey="${key}" ${idx === 0 ? 'disabled' : ''}
                  class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${idx > 0 ? 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800' : 'opacity-40 cursor-not-allowed border-slate-200 dark:border-slate-800 text-slate-400'}">
                  ← Subtópico Anterior
                </button>
                <span class="text-xs font-mono text-slate-500 dark:text-slate-400">${idx + 1} / ${blockTopics.length}</span>
                <button type="button" data-fr-sub="${idx < blockTopics.length - 1 ? blockTopics[idx + 1].id : ''}" data-fr-bkey="${key}" ${idx === blockTopics.length - 1 ? 'disabled' : ''}
                  class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${idx < blockTopics.length - 1 ? 'bg-slate-900 dark:bg-emerald-600 border-transparent text-white hover:opacity-90' : 'opacity-40 cursor-not-allowed border-slate-200 dark:border-slate-800 text-slate-400'}">
                  Próximo Subtópico →
                </button>
              </div>
            </article>
          </div>
        `;
      }

      function renderPectinCalc() {
        const c = state.pectinCalc;
        const denom = c.bFinal - c.pctPectina;
        const solidosBase = c.mFruta * c.bFruta + c.mAcucar * 100;
        const valid = denom > 0 && c.bFinal > 0;
        const mFinal = valid ? solidosBase / denom : 0;
        const mPectina = valid ? mFinal * (c.pctPectina / 100) : 0;

        return `
          <div id="frutasBlockRoot" class="fade-in space-y-5">
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 sm:p-6 shadow-xs">
              <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400">Simulador · Aula 6</span>
                  <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Calculadora de Balanço de Massa de Pectina</h2>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  <button type="button" data-calc-preset="bananada" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 hover:bg-rose-100">Bananada (78 °Bx)</button>
                  <button type="button" data-calc-preset="goiabada" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100">Goiabada Q1 (75 °Bx)</button>
                  <button type="button" data-calc-preset="geleia" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100">Geleia (67,5 °Bx)</button>
                </div>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-5">
                <label class="block">
                  <span class="text-xs font-semibold text-slate-600 dark:text-slate-400">M_fruta (kg)</span>
                  <input type="number" step="0.1" data-calc-field="mFruta" value="${c.mFruta}" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-mono"/>
                </label>
                <label class="block">
                  <span class="text-xs font-semibold text-slate-600 dark:text-slate-400">B_fruta (°Brix)</span>
                  <input type="number" step="0.1" data-calc-field="bFruta" value="${c.bFruta}" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-mono"/>
                </label>
                <label class="block">
                  <span class="text-xs font-semibold text-slate-600 dark:text-slate-400">M_açúcar (kg)</span>
                  <input type="number" step="0.1" data-calc-field="mAcucar" value="${c.mAcucar}" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-mono"/>
                </label>
                <label class="block">
                  <span class="text-xs font-semibold text-slate-600 dark:text-slate-400">% Pectina</span>
                  <input type="number" step="0.1" data-calc-field="pctPectina" value="${c.pctPectina}" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-mono"/>
                </label>
                <label class="block">
                  <span class="text-xs font-semibold text-slate-600 dark:text-slate-400">B_final (°Brix)</span>
                  <input type="number" step="0.5" data-calc-field="bFinal" value="${c.bFinal}" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-mono"/>
                </label>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800">
                  <div class="text-xs font-bold uppercase text-emerald-700 dark:text-emerald-400">Massa Final do Doce (M_final)</div>
                  <div class="text-2xl font-extrabold font-mono text-emerald-900 dark:text-emerald-200 mt-1">${valid ? mFinal.toFixed(2) + ' kg' : 'Inválido'}</div>
                </div>
                <div class="p-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800">
                  <div class="text-xs font-bold uppercase text-rose-700 dark:text-rose-400">Massa de Pectina (M_pectina)</div>
                  <div class="text-2xl font-extrabold font-mono text-rose-900 dark:text-rose-200 mt-1">${valid ? mPectina.toFixed(3) + ' kg (' + (mPectina * 1000).toFixed(1) + ' g)' : 'Inválido'}</div>
                </div>
              </div>

              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 font-mono text-xs sm:text-sm text-slate-700 dark:text-slate-300 space-y-1">
                <div><strong>Equação:</strong> M_fruta·B_fruta + M_açúcar·100 + (%pect/100 · M_final)·100 = M_final · B_final</div>
                <div>${c.mFruta}×${c.bFruta} + ${c.mAcucar}×100 + ${c.pctPectina}·M_final = ${c.bFinal}·M_final</div>
                <div>${solidosBase.toFixed(1)} = ${denom.toFixed(2)} · M_final  →  <strong>M_final = ${valid ? mFinal.toFixed(2) : '?'} kg</strong>  |  <strong>M_pectina = ${valid ? mPectina.toFixed(3) : '?'} kg</strong></div>
              </div>
            </div>
          </div>
        `;
      }

      const COLD_PRODUCTS = {
        banana: { name: 'Banana', tms: 11.5, tmsLabel: '11,5–13 °C', ethylene: 'Moderada', sensitive: false, resp: 'Climatérico', symptom: 'Escurecimento da epiderme' },
        mamao: { name: 'Mamão', tms: 7, tmsLabel: '7 °C', ethylene: 'Alta', sensitive: false, resp: 'Climatérico', symptom: 'Depressões, sabor estranho e falha no amadurecimento' },
        tomate: { name: 'Tomate maduro', tms: 7, tmsLabel: '7–10 °C', ethylene: 'Moderada', sensitive: false, resp: 'Climatérico', symptom: 'Amaciamento excessivo, translucidez e deterioração' },
        abacaxi: { name: 'Abacaxi', tms: 7, tmsLabel: '7–10 °C', ethylene: 'Baixa', sensitive: false, resp: 'Não-climatérico', symptom: 'Polpa marrom ou preta (irreversível)' },
        goiaba: { name: 'Goiaba', tms: 4.5, tmsLabel: '4,5 °C', ethylene: 'Moderada', sensitive: false, resp: 'Climatérico', symptom: 'Injúria na polpa e deterioração' },
        batata: { name: 'Batata', tms: 3, tmsLabel: '3 °C', ethylene: 'Muito baixa', sensitive: false, resp: 'Não-climatérico', symptom: 'Escurecimento e aumento indesejado de doçura' },
        maracuja: { name: 'Maracujá', tms: 7, tmsLabel: '7–10 °C', ethylene: 'Muito alta', sensitive: false, resp: 'Climatérico', symptom: 'Injúria pelo frio em fruto tropical' },
        maca: { name: 'Maçã', tms: 0, tmsLabel: '~0 °C (não sensível)', ethylene: 'Alta', sensitive: false, resp: 'Climatérico', symptom: 'Tolerante ao frio' },
        uva: { name: 'Uva', tms: 0, tmsLabel: '~0 °C (não sensível)', ethylene: 'Muito baixa', sensitive: false, resp: 'Não-climatérico', symptom: 'Tolerante ao frio' },
        alface: { name: 'Alface (Folhosa)', tms: 0, tmsLabel: '~0 °C (não sensível)', ethylene: 'Muito baixa', sensitive: true, resp: 'Elevada (40–70)', symptom: 'Tolerante ao frio, mas sensível ao etileno' },
        brocolis: { name: 'Brócolis', tms: 0, tmsLabel: '~0 °C (não sensível)', ethylene: 'Muito baixa', sensitive: true, resp: 'Extrema (>100)', symptom: 'Tolerante ao frio, altamente sensível ao etileno' },
        alho: { name: 'Alho', tms: 0, tmsLabel: '~0 °C (não sensível)', ethylene: 'Muito baixa', sensitive: false, resp: 'Muito baixa (<10)', symptom: 'Tolerante ao frio' }
      };

      function renderColdRoomSim() {
        const s = state.coldSim;
        const a = COLD_PRODUCTS[s.prodA] || COLD_PRODUCTS.banana;
        const b = COLD_PRODUCTS[s.prodB] || COLD_PRODUCTS.alface;
        const t = s.temp;

        const alerts = [];
        if (t < a.tms) alerts.push(`<strong>Injúria pelo frio em ${a.name}:</strong> ${t} °C está abaixo da TMS (${a.tmsLabel}) → ${a.symptom}.`);
        if (t < b.tms) alerts.push(`<strong>Injúria pelo frio em ${b.name}:</strong> ${t} °C está abaixo da TMS (${b.tmsLabel}) → ${b.symptom}.`);

        const highE = (p) => p.ethylene === 'Alta' || p.ethylene === 'Muito alta';
        if ((highE(a) && b.sensitive) || (highE(b) && a.sensitive)) {
          alerts.push(`<strong>Conflito de Etileno:</strong> emissor alto/muito alto (${highE(a) ? a.name : b.name}) junto com hortaliça sensível (${a.sensitive ? a.name : b.name}) acelera amarelecimento e senescência!`);
        }
        const tmsGap = Math.abs(a.tms - b.tms) >= 5;
        if (tmsGap) {
          alerts.push(`<strong>Conflito Térmico (Segregação recomendada):</strong> faixas de TMS muito distantes (${a.name}: ${a.tmsLabel} vs. ${b.name}: ${b.tmsLabel}).`);
        }

        const ok = alerts.length === 0;
        const opts = Object.entries(COLD_PRODUCTS).map(([k, v]) => `<option value="${k}">${v.name} (TMS: ${v.tmsLabel} · Etileno: ${v.ethylene})</option>`).join('');

        return `
          <div id="frutasBlockRoot" class="fade-in space-y-5">
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 sm:p-6 shadow-xs">
              <div class="mb-4">
                <span class="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400">Simulador Interativo · Aula 4</span>
                <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Simulador de Câmara Fria: TMS &amp; Compatibilidade de Etileno</h2>
                <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Teste combinações de produtos na mesma câmara e ajuste a temperatura para diagnosticar injúria pelo frio e conflitos de etileno.</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                <label class="block">
                  <span class="text-xs font-bold text-slate-600 dark:text-slate-400">Produto A na Câmara</span>
                  <select data-cold-field="prodA" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                    ${opts.replace(`value="${s.prodA}"`, `value="${s.prodA}" selected`)}
                  </select>
                </label>
                <label class="block">
                  <span class="text-xs font-bold text-slate-600 dark:text-slate-400">Produto B na Câmara</span>
                  <select data-cold-field="prodB" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                    ${opts.replace(`value="${s.prodB}"`, `value="${s.prodB}" selected`)}
                  </select>
                </label>
              </div>

              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 mb-5">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Temperatura da Câmara Fria</span>
                  <span class="text-lg font-extrabold font-mono text-teal-700 dark:text-teal-300">${t} °C</span>

      function closeMobileDrawer() {
        document.getElementById('mobile-drawer').classList.add('hidden');
      }

      function syncUrlHash() {
        try {
          let nextHash = '';
          if (state.screen === 'frutas-home') nextHash = '#frutas';
          else if (state.screen === 'frutas-lec' && state.lecId) nextHash = '#frutas/' + state.lecId;
          else if (state.screen === 'organica-home') nextHash = IS_PORTAL ? '#organica' : '';
          else if (state.screen === 'organica-topic' && state.qoTopicId) nextHash = '#organica/' + state.qoTopicId;
          const targetUrl = window.location.pathname + window.location.search + nextHash;
          window.history.replaceState(null, '', targetUrl);
        } catch (e) {}
      }

      function openScreen(screen) {
        state.screen = screen;
        closeMobileDrawer();
        syncUrlHash();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function openFrutasLecture(id, tab, subId) {
        state.screen = 'frutas-lec';
        state.lecId = id;
        state.frutasTab = tab || 'bloco1';
        if (subId && (state.frutasTab === 'bloco1' || state.frutasTab === 'bloco2' || state.frutasTab === 'bloco3')) {
          state.frutasActiveSub[`${id}_${state.frutasTab}`] = subId;
        }
        closeMobileDrawer();
        syncUrlHash();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function openOrganicaTopic(id, view, subTopicId) {
        state.screen = 'organica-topic';
        state.qoTopicId = id;
        state.qoInitialView = view || null;
        state.qoInitialSubId = subTopicId || null;
        closeMobileDrawer();
        syncUrlHash();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function bindSidebarListeners() {
        document.querySelectorAll('#sidebar-content-desktop [data-nav-screen], #sidebar-content-mobile [data-nav-screen]').forEach(btn => {
          btn.addEventListener('click', () => openScreen(btn.getAttribute('data-nav-screen')));
        });
        document.querySelectorAll('#sidebar-content-desktop [data-open-lec], #sidebar-content-mobile [data-open-lec]').forEach(btn => {
          btn.addEventListener('click', () => openFrutasLecture(btn.getAttribute('data-open-lec'), 'bloco1'));
        });
        document.querySelectorAll('#sidebar-content-desktop [data-open-qo], #sidebar-content-mobile [data-open-qo]').forEach(btn => {
          btn.addEventListener('click', () => openOrganicaTopic(btn.getAttribute('data-open-qo'), null, null));
        });
      }

      function bindMainListeners() {
        const main = document.getElementById('main-content');
        main.querySelectorAll('[data-nav-screen]').forEach(btn => {
          btn.addEventListener('click', () => openScreen(btn.getAttribute('data-nav-screen')));
        });
        main.querySelectorAll('[data-open-lec]').forEach(btn => {
          btn.addEventListener('click', () => openFrutasLecture(btn.getAttribute('data-open-lec'), 'bloco1'));
        });
        main.querySelectorAll('[data-open-qo]').forEach(btn => {
          btn.addEventListener('click', () => openOrganicaTopic(btn.getAttribute('data-open-qo'), null, null));
        });
        main.querySelectorAll('[data-frutas-tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.frutasTab = btn.getAttribute('data-frutas-tab');
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        main.querySelectorAll('[data-fr-sub]').forEach(btn => {
          btn.addEventListener('click', () => {
            const subId = btn.getAttribute('data-fr-sub');
            const bkey = btn.getAttribute('data-fr-bkey');
            if (!subId) return;
            state.frutasActiveSub[bkey] = subId;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
        main.querySelectorAll('[data-fr-master]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tid = btn.getAttribute('data-fr-master');
            state.frutasMastered[tid] = !state.frutasMastered[tid];
            saveState();
            render();
          });
        });
        main.querySelectorAll('[data-fr-quiz]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tid = btn.getAttribute('data-fr-quiz');
            const optIdx = Number(btn.getAttribute('data-fr-opt'));
            state.frutasQuizSel[tid] = optIdx;
            render();
          });
        });
        main.querySelectorAll('[data-calc-field]').forEach(inp => {
          inp.addEventListener('input', () => {
            const f = inp.getAttribute('data-calc-field');
            const val = parseFloat(inp.value);
            if (!isNaN(val)) {
              state.pectinCalc[f] = val;
              render();
              const nextInp = document.querySelector(`[data-calc-field="${f}"]`);
              if (nextInp) { nextInp.focus(); }
            }
          });
        });
        main.querySelectorAll('[data-calc-preset]').forEach(btn => {
          btn.addEventListener('click', () => {
            const p = btn.getAttribute('data-calc-preset');
            if (p === 'bananada') state.pectinCalc = { mFruta: 59, bFruta: 24, mAcucar: 29, pctPectina: 1.5, bFinal: 78 };
            else if (p === 'goiabada') state.pectinCalc = { mFruta: 60, bFruta: 10, mAcucar: 40, pctPectina: 1.0, bFinal: 75 };
            else state.pectinCalc = { mFruta: 50, bFruta: 12, mAcucar: 50, pctPectina: 0.8, bFinal: 67.5 };
            render();
          });
        });
        main.querySelectorAll('[data-cold-field]').forEach(el => {
          const evName = el.tagName === 'SELECT' ? 'change' : 'input';
          el.addEventListener(evName, () => {
            const f = el.getAttribute('data-cold-field');
            state.coldSim[f] = f === 'temp' ? parseFloat(el.value) : el.value;
            render();
          });
        });
        main.querySelectorAll('[data-toggle-frutas-done]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-toggle-frutas-done');
            state.completedFrutas[id] = !state.completedFrutas[id];
            saveState();
            render();
          });
        });
        main.querySelectorAll('[data-toggle-gab]').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-toggle-gab');
            state.revealedFrutas[key] = !state.revealedFrutas[key];
            render();
          });
        });
        main.querySelectorAll('[data-note-key]').forEach(ta => {
          ta.addEventListener('input', () => {
            state.notesFrutas[ta.getAttribute('data-note-key')] = ta.value;
            saveState();
          });
        });
      }

      function render() {
        if (activeQoModule) {
          activeQoModule.unmount();
          activeQoModule = null;
        }

        updateHeaderBrand();

        const sidebarHtml = renderSidebarHtml();
        document.getElementById('sidebar-content-desktop').innerHTML = sidebarHtml;
        document.getElementById('sidebar-content-mobile').innerHTML = sidebarHtml;

        const mainEl = document.getElementById('main-content');

        if (state.screen === 'portal-home' && IS_PORTAL) {
          mainEl.innerHTML = renderPortalHome();
        } else if (state.screen === 'frutas-home' && HAS_FRUTAS) {
          mainEl.innerHTML = renderFrutasHome();
        } else if (state.screen === 'frutas-lec' && HAS_FRUTAS) {
          const lec = LECTURES.find(l => l.id === state.lecId) || LECTURES[0];
          mainEl.innerHTML = renderFrutasLecture(lec);
        } else if (state.screen === 'organica-home' && HAS_ORGANICA) {
          mainEl.innerHTML = renderOrganicaHome();
        } else if (HAS_ORGANICA) {
          const meta = QO_TOPICS.find(t => t.id === state.qoTopicId) || QO_TOPICS[0];
          mainEl.innerHTML = renderOrganicaTopicShell(meta);
          const stageEl = document.getElementById('qo-stage');
          const mod = QO_MODULES[meta.id];
          if (mod && stageEl) {
            activeQoModule = mod;
            mod.mount(stageEl, {
              view: state.qoInitialView,
              topicId: state.qoInitialSubId,
              onProgress: function () {
                refreshSidebarOnly();
              }
            });
            state.qoInitialView = null;
            state.qoInitialSubId = null;
          }
        }

        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
        bindSidebarListeners();
        bindMainListeners();
      }

      // Global Search across Frutas + Química Orgânica
      function extractTextFromBlocks(blocks) {
        return blocks.map(b => b.type === 'table' ? b.rows.map(r => r.join(' ')).join(' ') : (b.text || '')).join(' ');
      }

      function buildQoSearchIndex() {
        const items = [];
        QO_TOPICS.forEach(t => {
          const mod = QO_MODULES[t.id];
          if (!mod || typeof mod.getSearchDocs !== 'function') return;
          mod.getSearchDocs().forEach(doc => {
            items.push({
              subject: 'organica',
              subjectLabel: 'Orgânica',
              moduleId: t.id,
              moduleShort: t.tabShort,
              view: doc.view,
              topicId: doc.topicId,
              tabLabel: doc.tabLabel,
              text: doc.text
            });
          });
        });
        return items;
      }

      const QO_SEARCH_INDEX = buildQoSearchIndex();

      function runSearch(query) {
        state.searchQuery = query;
        const resultsEl = document.getElementById('search-results');
        const clearBtn = document.getElementById('btn-clear-search');
        const q = query.trim().toLowerCase();

        clearBtn.classList.toggle('hidden', q.length === 0);

        if (q.length < 2) {
          resultsEl.classList.add('hidden');
          resultsEl.innerHTML = '';
          if (state.screen === 'frutas-lec') render();
          return;
        }

        const matches = [];

        // Search Frutas (interactive subtopics + Guia Completo + Simulado + Gabarito)
        if (HAS_FRUTAS) {
          LECTURES.forEach(lec => {
            const cfg = FRUTAS_INT[lec.id];
            if (cfg && cfg.topics) {
              cfg.topics.forEach(t => {
                const rawText = [t.title, t.shortTitle, t.logic.join(' '), t.applications, t.checklist.join(' '), t.traps.join(' '), t.quiz ? t.quiz.question : ''].join(' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
                const idx = rawText.toLowerCase().indexOf(q);
                if (idx !== -1) {
                  const start = Math.max(0, idx - 50);
                  const end = Math.min(rawText.length, idx + q.length + 75);
                  const snippet = (start > 0 ? '…' : '') + rawText.slice(start, end) + (end < rawText.length ? '…' : '');
                  matches.push({
                    subject: 'frutas',
                    subjectLabel: 'Frutas',
                    moduleId: lec.id,
                    moduleShort: lec.short,
                    tab: t.bloco,
                    subId: t.id,
                    tabLabel: t.code + ' · ' + t.shortTitle,
                    snippet
                  });
                }
              });
            }
            const sources = [
              { tab: 'guia', label: 'Guia Completo', text: extractTextFromBlocks(lec.guia) },
              { tab: 'simulado', label: 'Simulado', text: lec.simulado.questions.map(x => x.title + ' ' + extractTextFromBlocks(x.blocks)).join(' ') },
              { tab: 'gabarito', label: 'Gabarito', text: lec.gabarito.questions.map(x => x.title + ' ' + extractTextFromBlocks(x.blocks)).join(' ') }
            ];
            sources.forEach(src => {
              const idx = src.text.toLowerCase().indexOf(q);
              if (idx !== -1) {
                const start = Math.max(0, idx - 50);
                const end = Math.min(src.text.length, idx + q.length + 75);
                const snippet = (start > 0 ? '…' : '') + src.text.slice(start, end) + (end < src.text.length ? '…' : '');
                matches.push({
                  subject: 'frutas',
                  subjectLabel: 'Frutas',
                  moduleId: lec.id,
                  moduleShort: lec.short,
                  tab: src.tab,
                  subId: null,
                  tabLabel: src.label,
                  snippet
                });
              }
            });
          });
        }

        // Search Química Orgânica
        QO_SEARCH_INDEX.forEach(item => {
          const idx = item.text.toLowerCase().indexOf(q);
          if (idx !== -1) {
            const start = Math.max(0, idx - 50);
            const end = Math.min(item.text.length, idx + q.length + 75);
            const snippet = (start > 0 ? '…' : '') + item.text.slice(start, end) + (end < item.text.length ? '…' : '');
            matches.push({
              subject: 'organica',
              subjectLabel: 'Orgânica',
              moduleId: item.moduleId,
              moduleShort: item.moduleShort,
              view: item.view,
              topicId: item.topicId,
              tabLabel: item.tabLabel,
              snippet
            });
          }
        });

        if (matches.length === 0) {
          resultsEl.innerHTML = `<div class="p-4 text-sm text-slate-500 dark:text-slate-400">Nenhum resultado encontrado para "<strong>${escapeHtml(query)}</strong>".</div>`;
        } else {
          resultsEl.innerHTML = matches.slice(0, 14).map((m, i) => `
            <button data-search-idx="${i}" type="button" class="w-full text-left p-3 hover:bg-slate-50 dark:hover:bg-slate-800/80 transition block">
              <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
                ${IS_PORTAL ? `<span class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${m.subject === 'frutas' ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300' : 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300'}">${m.subjectLabel}</span>` : ''}
                <span class="text-xs font-bold ${m.subject === 'frutas' ? 'text-emerald-700 dark:text-emerald-400' : 'text-indigo-700 dark:text-indigo-400'}">${escapeHtml(m.moduleShort)}</span>
                <span class="text-[11px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(m.tabLabel)}</span>
              </div>
              <div class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2">${highlightText(m.snippet, query)}</div>
            </button>
          `).join('');

          const shown = matches.slice(0, 14);
          resultsEl.querySelectorAll('[data-search-idx]').forEach(btn => {
            btn.addEventListener('click', () => {
              const m = shown[Number(btn.getAttribute('data-search-idx'))];
              resultsEl.classList.add('hidden');
              if (m.subject === 'frutas') {
                openFrutasLecture(m.moduleId, m.tab, m.subId || null);
              } else {
                openOrganicaTopic(m.moduleId, m.view, m.topicId);
              }
            });
          });
        }
        resultsEl.classList.remove('hidden');
        if (state.screen === 'frutas-lec') render();
      }

      // Optional URL hash deep-linking (#frutas, #organica, #frutas/aula6, #organica/t4)
      function applyInitialHash() {
        const h = (window.location.hash || '').replace(/^#/, '').trim();
        if (!h) return;
        const parts = h.split('/');
        if (parts[0] === 'frutas' && HAS_FRUTAS) {
          if (parts[1] && LECTURES.some(l => l.id === parts[1])) {
            state.screen = 'frutas-lec';
            state.lecId = parts[1];
          } else {
            state.screen = 'frutas-home';
          }
        } else if (parts[0] === 'organica' && HAS_ORGANICA) {
          if (parts[1] && QO_TOPICS.some(t => t.id === parts[1])) {
            state.screen = 'organica-topic';
            state.qoTopicId = parts[1];
          } else {
            state.screen = 'organica-home';
          }
        }
      }

      // Init
      loadState();
      applyInitialHash();
      applyThemeAndFont();
      render();

      document.getElementById('btn-brand-home').addEventListener('click', () => {
        openScreen(IS_PORTAL ? 'portal-home' : (HAS_FRUTAS ? 'frutas-home' : 'organica-home'));
      });

      document.getElementById('btn-menu').addEventListener('click', () => {
        document.getElementById('mobile-drawer').classList.remove('hidden');
      });
      document.getElementById('btn-close-drawer').addEventListener('click', closeMobileDrawer);
      document.getElementById('mobile-backdrop').addEventListener('click', closeMobileDrawer);

      document.getElementById('btn-theme').addEventListener('click', () => {
        state.dark = !state.dark;
        applyThemeAndFont();
        saveState();
      });

      document.getElementById('btn-font-dec').addEventListener('click', () => {
        state.fontSize = Math.max(13, state.fontSize - 1);
        applyThemeAndFont();
        saveState();
      });

      document.getElementById('btn-font-inc').addEventListener('click', () => {
        state.fontSize = Math.min(20, state.fontSize + 1);
        applyThemeAndFont();
        saveState();
      });

      document.getElementById('btn-print').addEventListener('click', () => window.print());

      const searchInput = document.getElementById('global-search');
      searchInput.addEventListener('input', (e) => runSearch(e.target.value));
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.getElementById('search-results').classList.add('hidden');
        }
      });
      document.getElementById('btn-clear-search').addEventListener('click', () => {
        searchInput.value = '';
        runSearch('');
      });

      document.addEventListener('click', (e) => {
        const res = document.getElementById('search-results');
        if (!res.contains(e.target) && e.target !== searchInput) {
          res.classList.add('hidden');
        }
      });

      const topBtn = document.getElementById('back-to-top');
      window.addEventListener('scroll', () => {
        topBtn.classList.toggle('hidden', window.scrollY < 400);
      });
      topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    })();
  </script>
</body>
</html>
