<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Estudos · Engenharia de Alimentos (UNESP–IBILCE)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root { --study-font-size: 15.5px; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .study-prose { font-size: var(--study-font-size); line-height: 1.7; }
    .study-prose p { margin-bottom: 0.85rem; }
    .study-prose h2 { scroll-margin-top: 96px; }
    .study-prose h3 { scroll-margin-top: 96px; }
    .study-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .study-table th { text-align: left; font-weight: 600; padding: 0.65rem 0.85rem; }
    .study-table td { padding: 0.65rem 0.85rem; vertical-align: top; }
    mark.hl { background: #fef08a; color: #1e293b; padding: 0 2px; border-radius: 3px; }
    .dark mark.hl { background: #eab308; color: #0f172a; }

    /* Química Orgânica native module integration */
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Dynamic font scaling inside Química Orgânica & Frutas interactive reading areas */
    #qo-stage #appRoot, #frutas-stage #frutasBlockRoot { font-size: var(--study-font-size); }
    #qo-stage #appRoot .text-sm, #frutas-stage #frutasBlockRoot .text-sm { font-size: calc(var(--study-font-size) * 0.92); line-height: 1.65; }
    #qo-stage #appRoot .text-xs, #frutas-stage #frutasBlockRoot .text-xs { font-size: calc(var(--study-font-size) * 0.8); }

    /* Topic accent active tabs & sub-pills (Química Orgânica) */
    #qo-stage[data-qo-topic="t1"] .tab-btn-active { background-color: #9a3412 !important; color: #ffffff !important; box-shadow: 0 1px 3px rgba(154, 52, 18, 0.25); }
    #qo-stage[data-qo-topic="t1"] .sub-pill-active { background-color: #ea580c !important; color: #ffffff !important; border-color: #ea580c !important; }
    #qo-stage[data-qo-topic="t2"] .tab-btn-active { background-color: #065f46 !important; color: #ffffff !important; box-shadow: 0 1px 3px rgba(6, 95, 70, 0.25); }
    #qo-stage[data-qo-topic="t2"] .sub-pill-active { background-color: #059669 !important; color: #ffffff !important; border-color: #059669 !important; }
    #qo-stage[data-qo-topic="t3"] .tab-btn-active { background-color: #0369a1 !important; color: #ffffff !important; box-shadow: 0 1px 3px rgba(3, 105, 161, 0.25); }
    #qo-stage[data-qo-topic="t3"] .sub-pill-active { background-color: #0284c7 !important; color: #ffffff !important; border-color: #0284c7 !important; }
    #qo-stage[data-qo-topic="t4"] .tab-btn-active { background-color: #312e81 !important; color: #ffffff !important; box-shadow: 0 1px 3px rgba(49, 46, 129, 0.25); }
    #qo-stage[data-qo-topic="t4"] .sub-pill-active { background-color: #4f46e5 !important; color: #ffffff !important; border-color: #4f46e5 !important; }

    /* Lecture accent active tabs & sub-pills (Tecnologia de Frutas) */
    #frutas-stage[data-fr-lec="mmp"] .tab-btn-active { background-color: #065f46 !important; color: #ffffff !important; }
    #frutas-stage[data-fr-lec="mmp"] .sub-pill-active { background-color: #059669 !important; color: #ffffff !important; border-color: #059669 !important; }
    #frutas-stage[data-fr-lec="aula4"] .tab-btn-active { background-color: #115e59 !important; color: #ffffff !important; }
    #frutas-stage[data-fr-lec="aula4"] .sub-pill-active { background-color: #0d9488 !important; color: #ffffff !important; border-color: #0d9488 !important; }
    #frutas-stage[data-fr-lec="aula5"] .tab-btn-active { background-color: #92400e !important; color: #ffffff !important; }
    #frutas-stage[data-fr-lec="aula5"] .sub-pill-active { background-color: #d97706 !important; color: #ffffff !important; border-color: #d97706 !important; }
    #frutas-stage[data-fr-lec="aula6"] .tab-btn-active { background-color: #9f1239 !important; color: #ffffff !important; }
    #frutas-stage[data-fr-lec="aula6"] .sub-pill-active { background-color: #e11d48 !important; color: #ffffff !important; border-color: #e11d48 !important; }
    #frutas-stage[data-fr-lec="aula7"] .tab-btn-active { background-color: #9a3412 !important; color: #ffffff !important; }
    #frutas-stage[data-fr-lec="aula7"] .sub-pill-active { background-color: #ea580c !important; color: #ffffff !important; border-color: #ea580c !important; }
    #frutas-stage[data-fr-lec="aula8"] .tab-btn-active { background-color: #78350f !important; color: #ffffff !important; }
    #frutas-stage[data-fr-lec="aula8"] .sub-pill-active { background-color: #b45309 !important; color: #ffffff !important; border-color: #b45309 !important; }

    .dark #frutas-stage[data-fr-lec="mmp"] .tab-btn-active { background-color: #059669 !important; }
    .dark #frutas-stage[data-fr-lec="aula4"] .tab-btn-active { background-color: #0d9488 !important; }
    .dark #frutas-stage[data-fr-lec="aula5"] .tab-btn-active { background-color: #d97706 !important; }
    .dark #frutas-stage[data-fr-lec="aula6"] .tab-btn-active { background-color: #e11d48 !important; }
    .dark #frutas-stage[data-fr-lec="aula7"] .tab-btn-active { background-color: #ea580c !important; }
    .dark #frutas-stage[data-fr-lec="aula8"] .tab-btn-active { background-color: #b45309 !important; }
    .dark #frutas-stage svg.bg-white { background-color: #f8fafc !important; border-color: #334155 !important; }

    .dark #qo-stage[data-qo-topic="t1"] .tab-btn-active { background-color: #ea580c !important; }
    .dark #qo-stage[data-qo-topic="t2"] .tab-btn-active { background-color: #059669 !important; }
    .dark #qo-stage[data-qo-topic="t3"] .tab-btn-active { background-color: #0284c7 !important; }
    .dark #qo-stage[data-qo-topic="t4"] .tab-btn-active { background-color: #4f46e5 !important; }

    /* Comprehensive Dark Mode theme adaptation for Química Orgânica modules */
    .dark #qo-stage .bg-white { background-color: #0f172a !important; }
    .dark #qo-stage svg.bg-white { background-color: #f8fafc !important; border-color: #334155 !important; }
    .dark #qo-stage .bg-slate-50 { background-color: rgba(30, 41, 59, 0.72) !important; }
    .dark #qo-stage .bg-slate-100 { background-color: #1e293b !important; }
    .dark #qo-stage .bg-slate-200 { background-color: #334155 !important; }
    .dark #qo-stage .bg-slate-900 { background-color: #1e293b !important; }
    .dark #qo-stage .hover\:bg-slate-50:hover { background-color: rgba(51, 65, 85, 0.65) !important; }
    .dark #qo-stage .hover\:bg-slate-100:hover { background-color: #334155 !important; }
    .dark #qo-stage .hover\:bg-slate-200:hover { background-color: #475569 !important; }

    .dark #qo-stage .bg-orange-50, .dark #qo-stage .bg-orange-50\/70 { background-color: rgba(154, 52, 18, 0.22) !important; }
    .dark #qo-stage .bg-orange-100 { background-color: rgba(154, 52, 18, 0.36) !important; }
    .dark #qo-stage .bg-emerald-50, .dark #qo-stage .bg-emerald-50\/70 { background-color: rgba(6, 78, 59, 0.28) !important; }
    .dark #qo-stage .bg-emerald-100 { background-color: rgba(6, 95, 70, 0.42) !important; }
    .dark #qo-stage .bg-emerald-200 { background-color: rgba(5, 150, 105, 0.35) !important; }
    .dark #qo-stage .hover\:bg-emerald-50:hover { background-color: rgba(6, 95, 70, 0.35) !important; }
    .dark #qo-stage .bg-sky-50 { background-color: rgba(12, 74, 110, 0.28) !important; }
    .dark #qo-stage .bg-sky-100 { background-color: rgba(7, 89, 133, 0.42) !important; }
    .dark #qo-stage .bg-indigo-50, .dark #qo-stage .bg-indigo-50\/70, .dark #qo-stage .bg-indigo-50\/40 { background-color: rgba(49, 46, 129, 0.28) !important; }
    .dark #qo-stage .bg-indigo-100 { background-color: rgba(55, 48, 163, 0.42) !important; }
    .dark #qo-stage .bg-amber-50 { background-color: rgba(120, 53, 15, 0.28) !important; }
    .dark #qo-stage .bg-amber-100 { background-color: rgba(146, 64, 14, 0.4) !important; }
    .dark #qo-stage .bg-rose-50, .dark #qo-stage .bg-red-50 { background-color: rgba(136, 19, 55, 0.28) !important; }
    .dark #qo-stage .bg-rose-100 { background-color: rgba(159, 18, 57, 0.4) !important; }
    .dark #qo-stage .bg-blue-50 { background-color: rgba(30, 58, 138, 0.28) !important; }
    .dark #qo-stage .bg-teal-50 { background-color: rgba(19, 78, 74, 0.28) !important; }
    .dark #qo-stage .bg-violet-50 { background-color: rgba(76, 29, 149, 0.28) !important; }

    .dark #qo-stage .border-slate-100 { border-color: #1e293b !important; }
    .dark #qo-stage .border-slate-200 { border-color: #1e293b !important; }
    .dark #qo-stage .border-slate-300 { border-color: #334155 !important; }
    .dark #qo-stage .border-orange-200, .dark #qo-stage .border-orange-300 { border-color: rgba(234, 88, 12, 0.4) !important; }
    .dark #qo-stage .border-emerald-200, .dark #qo-stage .border-emerald-300 { border-color: rgba(16, 185, 129, 0.4) !important; }
    .dark #qo-stage .border-sky-200 { border-color: rgba(14, 165, 233, 0.4) !important; }
    .dark #qo-stage .border-indigo-200, .dark #qo-stage .border-indigo-300 { border-color: rgba(99, 102, 241, 0.4) !important; }
    .dark #qo-stage .border-amber-200, .dark #qo-stage .border-amber-300 { border-color: rgba(245, 158, 11, 0.4) !important; }
    .dark #qo-stage .border-rose-200, .dark #qo-stage .border-red-200 { border-color: rgba(244, 63, 94, 0.4) !important; }
    .dark #qo-stage .border-blue-200 { border-color: rgba(59, 130, 246, 0.4) !important; }
    .dark #qo-stage .border-teal-200 { border-color: rgba(20, 184, 166, 0.4) !important; }
    .dark #qo-stage .border-violet-200 { border-color: rgba(139, 92, 246, 0.4) !important; }

    .dark #qo-stage :not(svg):not(svg *).text-slate-900,
    .dark #qo-stage :not(svg):not(svg *).text-slate-800 { color: #f1f5f9 !important; }
    .dark #qo-stage :not(svg):not(svg *).text-slate-700 { color: #cbd5e1 !important; }
    .dark #qo-stage :not(svg):not(svg *).text-slate-600,
    .dark #qo-stage :not(svg):not(svg *).text-slate-500 { color: #94a3b8 !important; }

    .dark #qo-stage :not(svg):not(svg *).text-orange-600,
    .dark #qo-stage :not(svg):not(svg *).text-orange-700,
    .dark #qo-stage :not(svg):not(svg *).text-orange-800,
    .dark #qo-stage :not(svg):not(svg *).text-orange-900 { color: #fdba74 !important; }

    .dark #qo-stage :not(svg):not(svg *).text-emerald-600,
    .dark #qo-stage :not(svg):not(svg *).text-emerald-700,
    .dark #qo-stage :not(svg):not(svg *).text-emerald-800,
    .dark #qo-stage :not(svg):not(svg *).text-emerald-900,
    .dark #qo-stage :not(svg):not(svg *).text-emerald-950 { color: #6ee7b7 !important; }

    .dark #qo-stage :not(svg):not(svg *).text-sky-700,
    .dark #qo-stage :not(svg):not(svg *).text-sky-800,
    .dark #qo-stage :not(svg):not(svg *).text-sky-900,
    .dark #qo-stage :not(svg):not(svg *).text-sky-950 { color: #7dd3fc !important; }

    .dark #qo-stage :not(svg):not(svg *).text-indigo-600,
    .dark #qo-stage :not(svg):not(svg *).text-indigo-700,
    .dark #qo-stage :not(svg):not(svg *).text-indigo-800,
    .dark #qo-stage :not(svg):not(svg *).text-indigo-900 { color: #a5b4fc !important; }

    .dark #qo-stage :not(svg):not(svg *).text-amber-600,
    .dark #qo-stage :not(svg):not(svg *).text-amber-700,
    .dark #qo-stage :not(svg):not(svg *).text-amber-800,
    .dark #qo-stage :not(svg):not(svg *).text-amber-900,
    .dark #qo-stage :not(svg):not(svg *).text-amber-950 { color: #fcd34d !important; }

    .dark #qo-stage :not(svg):not(svg *).text-rose-700,
    .dark #qo-stage :not(svg):not(svg *).text-rose-800,
    .dark #qo-stage :not(svg):not(svg *).text-rose-900,
    .dark #qo-stage :not(svg):not(svg *).text-red-700,
    .dark #qo-stage :not(svg):not(svg *).text-red-800 { color: #fda4af !important; }

    .dark #qo-stage :not(svg):not(svg *).text-blue-800 { color: #93c5fd !important; }
    .dark #qo-stage :not(svg):not(svg *).text-teal-700 { color: #5eead4 !important; }
    .dark #qo-stage :not(svg):not(svg *).text-violet-700 { color: #c4b5fd !important; }

    /* Keep white text crisp on solid buttons in dark mode */
    .dark #qo-stage .text-white,
    .dark #qo-stage .tab-btn-active,
    .dark #qo-stage .sub-pill-active { color: #ffffff !important; }

    .dark #qo-stage input,
    .dark #qo-stage select {
      background-color: #0f172a !important;
      color: #f1f5f9 !important;
      border-color: #334155 !important;
    }

    @media print {
      header, aside, #mobile-drawer, #back-to-top, .no-print { display: none !important; }
      main { margin-left: 0 !important; padding: 0 !important; max-width: 100% !important; }
      .dark { background: #ffffff !important; color: #0f172a !important; }
    }

  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200">
  <!-- Top Header -->
  <header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur">
    <div class="flex items-center justify-between gap-3 px-4 lg:px-6 h-16">
      <div class="flex items-center gap-3 min-w-0 shrink">
        <button id="btn-menu" type="button" aria-label="Abrir menu de navegação" class="lg:hidden inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <button id="btn-brand-home" type="button" class="flex items-center gap-2.5 text-left min-w-0 max-w-[220px] xl:max-w-xs group">
          <span id="brand-icon-wrap" class="flex items-center justify-center w-9 h-9 rounded-xl bg-indigo-600 text-white font-bold shadow-sm shrink-0 transition-colors">
            <i id="brand-icon" data-lucide="graduation-cap" class="w-5 h-5"></i>
          </span>
          <div class="min-w-0">
            <div id="brand-title" class="font-bold text-sm sm:text-base tracking-tight truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">Central de Estudos</div>
            <div id="brand-subtitle" class="text-xs text-slate-500 dark:text-slate-400 truncate hidden md:block">UNESP–IBILCE · Engenharia de Alimentos</div>
          </div>
        </button>
      </div>

      <!-- Global Search -->
      <div class="relative flex-1 min-w-[160px] sm:min-w-[240px] max-w-md">
        <div class="relative flex items-center">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none"></i>
          <input id="global-search" type="search" placeholder="Buscar em todas as matérias (ex.: pectina, PFO, pKₐ, aleno, Markovnikov, Ruby)..." class="w-full pl-9 pr-8 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-900 transition" />
          <button id="btn-clear-search" type="button" aria-label="Limpar busca" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="search-results" class="hidden absolute left-0 right-0 mt-2 max-h-96 overflow-y-auto rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-xl z-50 divide-y divide-slate-100 dark:divide-slate-800"></div>
      </div>

      <!-- Toolbar Actions -->
      <div class="flex items-center gap-1.5 shrink-0">
        <div class="hidden sm:flex items-center border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden">
          <button id="btn-font-dec" type="button" title="Diminuir fonte" class="px-2 py-1.5 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">A-</button>
          <button id="btn-font-inc" type="button" title="Aumentar fonte" class="px-2 py-1.5 text-xs font-semibold border-l border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">A+</button>
        </div>
        <button id="btn-print" type="button" title="Imprimir conteúdo atual" class="hidden md:inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="printer" class="w-4 h-4"></i>
        </button>
        <button id="btn-theme" type="button" title="Alternar modo claro/escuro" class="inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-4rem)]">
    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex lg:flex-col w-72 shrink-0 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto p-4">
      <div id="sidebar-content-desktop"></div>
    </aside>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="hidden fixed inset-0 z-50 lg:hidden">
      <div id="mobile-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs"></div>
      <div class="fixed inset-y-0 left-0 w-80 max-w-[85vw] bg-white dark:bg-slate-900 shadow-2xl p-4 overflow-y-auto flex flex-col">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200 dark:border-slate-800">
          <span class="font-bold text-sm">Navegação de Estudos</span>
          <button id="btn-close-drawer" type="button" aria-label="Fechar menu" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="sidebar-content-mobile"></div>
      </div>
    </div>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 min-w-0 px-4 sm:px-6 lg:px-10 py-6 lg:py-8 max-w-5xl mx-auto w-full"></main>
  </div>

  <!-- Back to top -->
  <button id="back-to-top" type="button" aria-label="Voltar ao topo" class="hidden fixed bottom-5 right-5 z-30 inline-flex items-center justify-center w-11 h-11 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg transition">

  <script id="app-data" type="application/json">{"mode": "portal", "frutas": {"lectures": [{"id": "mmp", "short": "Processamento Mínimo", "title": "Processamento Mínimo de Frutas e Hortaliças (MMP)", "subtitle": "Fisiologia do estresse pelo corte, cadeia do frio, sanitização, atmosfera modificada e defeitos", "badge": "MMP", "accent": "#059669", "hasSimulado": true, "guia": [{"type": "p", "text": "ENGENHARIA DE ALIMENTOS • TECNOLOGIA DE FRUTAS, HORTALIÇAS E DERIVADOS"}, {"type": "h2", "text": "Processamento Mínimo de Frutas e Hortaliças"}, {"type": "p", "text": "Guia Técnico Orientado à Prova Dissertativa, Simulado de Aplicação Industrial (10,0 pontos) e Gabarito Comentado Conceito Tecnológico: Produtos minimamente processados (MMP — fresh cut ou ready to eat ) são frutas, hortaliças ou suas combinações fisicamente alteradas de sua forma original (eliminação de partes não comestíveis como cascas, talos e sementes, seguida de corte em tamanhos menores e formatos diferenciados), sem emprego de congelamento ou altas temperaturas para conservação. Permanecem em estado fresco , como tecidos vivos metabolicamente ativos, apresentando taxa respiratória superior à do vegetal intacto e vida útil reduzida para 4 a 7 dias (frente a semanas ou meses em hortaliças inteiras)."}, {"type": "h2", "text": "1.1 Matéria-Prima e Pós-Colheita"}, {"type": "p", "text": "Critério tecnológico de seleção: O processamento mínimo não visa reaproveitar frutas e hortaliças impróprias para uso intacto. É tecnologicamente inadequado utilizar matérias-primas com qualquer grau de deterioração, mesmo aproveitando partes aparentemente sadias, pois a carga microbiana e as enzimas de degradação comprometem todo o lote. Perecibilidade intrínseca: Frutas e hortaliças possuem umidade elevada ( 80% a 95% ). Após a colheita, cessam a absorção radicular de água e minerais, a condução vascular e a fotossíntese; a respiração torna-se o principal processo fisiológico e a água perdida por transpiração não pode ser reposta. Fatores pré-colheita e intrínsecos: Condições de cultivo (microclima, tipo de solo, biocidas e estresses) somadas às características do vegetal ( cultivar e estádio de maturação ) determinam o perfil sensorial, a textura inicial e o potencial de conservação pós-colheita. Barreiras superficiais naturais: Pele, casca e cutícula protegem o vegetal intacto, mas são frequentemente danificadas na colheita, transporte e operações mecânicas. Além disso, a textura superficial de determinadas frutas (ex.: morango, kiwi, pêssego, pera, maçã) favorece a adesão de microrganismos patogênicos. Padronização e classificação: A classificação por maturação, ausência de defeitos, tamanho, cor e forma garante uniformidade operacional. Em especial, a uniformidade de tamanho é crítica no descascamento por abrasão em batelada para minimizar perdas de polpa. Padrão respiratório e resistência à difusão (RD): Frutos climatéricos (ex.: abacate, abóbora, banana, buriti, gueroba, kiwi, maçã, manga, maracujá amarelo, melão rendilhado, pêssego, pera, tomate, mamão, caqui, ameixa, goiaba) apresentam elevação respiratória associada ao amadurecimento, enquanto não-climatéricos (ex.: alface, alho, batata, batata-baroa, batata-doce, cebola, chuchu, laranja, mandioca, pepino, limão, caju, carambola, uva, abacaxi, coco) não exibem esse pico. A relação entre taxa de respiração e concentrações internas de O e CO é 2 2 Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças proporcional à resistência à difusão , que varia conforme a cultivar e tratamentos superficiais (como aplicação de cera). Alface cv. Baba ( Lactuca 75 Não-climatérico 0,084 sativa ) Abóbora cv. Jacarezinho / 45 / 45 Climatérico 0,6 / 1,6 Maracujá amarelo Abacate / Banana / Pepino 30 / 30 / 30 Clim. / Clim. / Não- 0,7 / 1,9 / 1,1 clim. Buriti ( Mauritia vinifera ) 20 Climatérico 3,0 → 0,5 (amadurec.) Maçã cv. Golden Delicious / 12 / 7 Climatérico 3,0 / 1,6 Kiwi cv. Hayward Parâmetro Crítico Pós-Colheita — Umidade Relativa (UR) do Ar A UR ideal para a maioria das frutas e hortaliças situa-se entre 85% e 95% . Ar seco (abaixo da faixa requerida) acelera a transpiração, provocando desidratação rápida e enrugamento. Ar próximo à saturação ( ~100% UR ) mantém a turgidez, mas favorece o desenvolvimento e a disseminação de microrganismos e induz o enraizamento em hortaliças como alho e cebola."}, {"type": "h2", "text": "1.2 Fluxograma de Processo e Pontos Críticos"}, {"type": "p", "text": "O fluxograma geral do processamento mínimo integra operações físicas de preparo a barreiras sanitárias e térmicas contínuas, executadas em sequência rigorosa para conter o metabolismo e a contaminação microbiana: 1 Recebimento, Inspeção e Seleção 2 Pré-Resfriamento (Arrefecimento Descarte integral de unidades Rápido) deterioradas ou lesionadas. Remoção rápida do calor de campo em equipamento específico. Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças 3 Pré-Lavagem / Higienização Inicial 4 Classificação Água pura ou com sanitizante para Padronização por maturação, defeitos, remoção de sujidades superficiais. tamanho, cor e forma. 5 Descascamento, Desencaroçamento e 6 Sanitização e Enxágue Corte Redução da carga microbiana pós-corte Lâminas bem afiadas ou abrasão em sob rigorosas BPF. batelada, sob refrigeração. 7 Centrifugação ou Drenagem 8 Técnicas Complementares de Remoção de água livre e exsudados Conservação celulares nutritivos. AM/AC, coberturas comestíveis, ozônio ou radiação gama. 9 Pesagem, Acondicionamento e Selagem 10 Estocagem e Distribuição Resfriadas Bandejas, potes ou filmes adequados Cadeia do frio ininterrupta (ex.: 4–5 °C; (controle de O 2 /CO 2 e vapor). 85–95% UR) e controle de trânsito. 1. Recebimento, Garantir matéria-prima sã e Rejeitar totalmente vegetais com Inspeção e Seleção estádio de maturação adequado qualquer deterioração; evitar ao corte. aproveitamento parcial de peças avariadas. 3. Pré-Lavagem / Reduzir sujidades e carga Usar água pura ou com sanitizante; Higienização microbiana superficial antes da atenção redobrada a superfícies rugosas/ remoção da casca. úmidas propensas à adesão de patógenos e biofilmes. 5. Descascamento, Eliminar cascas, talos e Lâminas bem afiadas (menor dano Fatiamento e Cortes sementes e conformar o produto celular = menor metabolismo e maior vida (cubos, rodelas, tiras, ralado, útil); preparo sob baixas temperaturas ; minicenoura). descascamento abrasivo em batelada apenas para tecidos resistentes com jatos de água; higienização rigorosa de equipamentos. Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças"}, {"type": "table", "rows": [["Etapa do Processo", "Objetivo Tecnológico", "Parâmetros Críticos e Cuidados Obrigatórios"], ["6. Sanitização e Enxágue", "Reduzir população microbiana contaminante, assegurar inocuidade e estender vida útil.", "Associar BPF e manipulação higiênica (evitar contaminação, reduzir carga e inibir crescimento); impedir formação de biofilmes que bloqueiam a ação sanitizante."]]}, {"type": "p", "text": "7. Centrifugação / Retirar excesso de água da Exsudados contêm açúcares e nutrientes Drenagem sanitização/enxágue e remover ideais para microrganismos; usar exsudados celulares do corte. centrífuga em folhosas/raízes fatiadas e escorredor/drenagem em cubos delicados (manga, abóbora). 9. Acondicionamento Proteger contra recontaminação, Embalagens (filmes, bandejas seladas, e Selagem reduzir transpiração superficial e potes) com permeabilidade adequada a modular gases internos. O 2 , CO 2 e vapor d'água para evitar dessecação e anaerobiose indesejada."}, {"type": "h2", "text": "1.3 Mecanismos Físico-Químicos, Bioquímicos e Fisiológicos"}, {"type": "p", "text": "A. Estresse Mecânico do Corte, Respiração e Produção de Etileno O corte, o descascamento e o fatiamento rompem organelas celulares, modificam a permeabilidade das membranas, causam desorganização celular e liberam fluidos intracelulares ricos em substratos (como açúcares). Como resposta imediata ao estresse mecânico, ocorre ativação da síntese de etileno (C H ) , elevação expressiva da taxa respiratória e aceleração da transpiração . 2 4 Substrato (carboidratos e ácidos orgânicos) + O → CO + H O + Calor vital (energia química) 2 2 2 Evidências experimentais do estresse de corte: Raízes de rabanete fatiadas armazenadas a 5 °C e 90% UR por 10 dias exibem taxa respiratória em média 95% superior à das raízes inteiras. Em couve fatiada, o pico respiratório atinge ~180 mg CO kg −1 MF h −1 na 1ª hora (vs. ~90 na inteira); 2 em repolho fatiado, o etileno sobe para ~2,1 μL C H kg −1 MF h −1 (vs. <0,4 no inteiro); em 2 4 minicenoura, a atividade de PAL eleva-se continuamente até >0,3 ΔAbs h −1 g −1 MF em 36 h (vs. ~0,1 estável na inteira). Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças Efeito da temperatura e quebra da cadeia do frio: O metabolismo vegetal cresce com a elevação térmica e reduz-se sob refrigeração. Em arilos de romã prontos para consumo, o armazenamento a 5 °C mantém a respiração baixa (~3–4 mL CO kg −1 h −1 até 60 dias), enquanto a exposição a 20 2 °C por apenas 1 dia após 30 ou 60 dias refrigerados dispara a atividade respiratória para ~17–20 mL CO kg −1 h −1 . 2 Consequências fisiológicas integradas: O aumento de etileno e da respiração interliga-se à indução do metabolismo de compostos fenólicos e à cicatrização dos tecidos, estimulando perda de lipídeos, vitaminas e clorofila, alterações indesejáveis de cor, sabor e aroma, perda de firmeza e aumento do crescimento microbiano. B. Transpiração e Dessecação Superficial A transpiração consiste na evaporação de água dos tecidos vegetais. Em materiais intactos, a água dos espaços intercelulares não está exposta diretamente à atmosfera externa; o corte e o descascamento expõem os tecidos internos hidratados e elevam drasticamente a taxa de evaporação. A perda de água (que pode comprometer severamente o produto ao atingir 20% ) gera perda de massa, murchamento/flacidez , perda de suculência, dessecação/esbranquiçamento superficial (observado em minicenouras e em tiras de beterraba após 12 dias), aceleração de danos pelo frio e danos mecânicos, além de depreciação nutricional por perda de vitaminas A e C . C. Transformações na Textura e Enzimas Pectinolíticas A textura (firmeza ou maciez da polpa) depende do turgor celular e da integridade dos carboidratos estruturais da parede celular: lamela média (pectina exercendo ação cimentante entre células via pectato de cálcio ), 1ª parede (hemicelulose, pectina e celulose) e 2ª parede (hemicelulose, pectina, celulose e lignina). Enquanto a celulose sofre pouca variação na maturação, as substâncias pécticas passam por intensa despolimerização enzimática: Protopectina: Substância péctica insolúvel em água devido às ligações inter e intramoleculares com íons Ca 2+ (pectato de cálcio). Predomina em frutas imaturas/verdes e, em conjunto com o amido, confere firmeza. Ácido pectínico e Pectina: Polímeros de ácido poligalacturônico contendo até 75% de grupos metil éster (pectina é o nome genérico dessas misturas). Ácido péctico: Substância péctica solúvel em água com quantidade insignificante de grupos carboxila esterificados com metil. Cascata das enzimas pectinolíticas: (1) Protopectinase solubiliza protopectina em pectina; (2) enzimas desesterificantes — Pectinametilesterase (PME / pectinesterase) promovem desmetoxilação da pectina em ácido péctico; (3) enzimas despolimerizantes (hidrolases e liases) clivam as cadeias: pectina-liase e polimetilgalacturonase atuam sobre a pectina, enquanto pectato-liase e poligalacturonase clivam o ácido péctico, simplificando as cadeias até a degradação total e causando amaciamento dos tecidos. D. Escurecimento Enzimático Principal desafio de qualidade visual em MMP. No vegetal intacto, as enzimas oxidativas — polifenoloxidase (PPO) (localizada em cloroplastos, membranas e parede) e peroxidase (POD) — encontram-se compartimentalizadas e separadas dos compostos fenólicos (armazenados no Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças vacúolo). O corte desfaz essa compartimentalização e permite o contato enzima–substrato–O . 2 Paralelamente, o etileno ativa o metabolismo dos fenilpropanoides , elevando a atividade da fenilalanina amônia-liase (PAL) e sintetizando mais compostos fenólicos. Etapa enzimática: A PPO catalisa a hidroxilação de monofenóis a difenóis (atividade cresolase ) e a oxidação de difenóis na presença de O a quinonas incolores + H O (atividade catecolase ). A 2 2 POD oxida difenóis a quinonas utilizando H O , e a lacase também catalisa a oxidação a 2 2 quinonas. Em frutos ricos em antocianinas, a β-glicosidase remove a glicose liberando antocianidinas, posteriormente oxidadas por catecolase, POD ou lacase. Etapa não enzimática (oxidação acoplada): As quinonas reagem espontaneamente com fenóis, outras quinonas, aminoácidos e proteínas, gerando produtos de condensação que se polimerizam em melaninas (compostos poliméricos de coloração marrom, avermelhada ou preta). E. Pigmentos, Compostos Voláteis e Microbiologia Perda de clorofila e variação de carotenoides: O estresse pós-corte e o etileno aceleram a degradação de clorofila (descoloração/amarelecimento em couve, brócolis e espinafre). Em cenoura ralada mantida a +4 °C (0 a 9 dias), ocorrem variações no teor de carotenoides e no perfil de voláteis associadas à queda de aceitação sensorial. Compostos voláteis do aroma: Álcoois, aldeídos, terpenos, ésteres e derivados — frequentemente dominados por \"compostos de impacto\" — definem a percepção de frescor. Após a colheita, o perfil muda continuamente por nova síntese e perda de voláteis, sendo influenciado por temperatura, embalagem, atmosfera controlada/modificada (AC/AM), revestimentos, desinfecção, radiação UV e deterioração microbiana (degradação não enzimática de constituintes). Microbiologia conforme o pH da matriz: Em frutas de baixo pH predominam fungos ( Botrytis cinerea , Aspergillus niger ) e leveduras ( Candida , Cryptococcus , Fabospora , Kluyveromyces , Pichia , Saccharomyces — como S. cerevisiae fermentando açúcares liberados pelo corte — e Zygosaccharomyces ). Em frutas de alto pH (próximo de 6,0) — como melão, melancia, mamão e abacate — multiplicam-se bactérias patogênicas ( Listeria monocytogenes , Salmonella spp., Shigella spp., Aeromonas hydrophila , Yersinia enterocolitica , Escherichia coli e Staphylococcus aureus ), além de registros como Cyclospora cayetanensis em framboesas e Shigella spp. em salada de frutas. Fontes de contaminação e biofilmes: A contaminação origina-se do ar, água, solo, insetos vetores, equipamentos e manuseio impróprio. A formação de biofilmes nas superfícies vegetais dificulta a higienização/sanitização e amplifica a carga microbiana. Atmosfera Alface / Melões Menor escurecimento e crescimento microbiano Modificada cantaloupe e honeydew (alface); preservação de voláteis do aroma / Abacaxi (melões); inibição de leveduras e da produção de voláteis (abacaxi). Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças"}, {"type": "table", "rows": [["Técnica Complementar", "Matriz Vegetal", "Efeito Tecnológico Observado"], ["Revestimentos Comestíveis", "Maçã / Melão kajari / Batata / Morango", "Fécula de mandioca e dextrina mantiveram coloração da maçã no 1º dia sem escurecimento significativo (testado também alginato); proteína isolada de soja elevou qualidade/vida útil no melão kajari; aumento da vida útil (batata); redução de contagens microbianas (morango)."]]}, {"type": "p", "text": "Ozônio Pimentão / Mamão / Redução de populações microbianas (pimentão); Espinafre redução da contagem total de bactérias (mamão); menor amarelecimento e manutenção da composição (espinafre)."}, {"type": "h2", "text": "1.4 Matriz de Defeitos Tecnológicos"}, {"type": "p", "text": "Escurecimento Rompimento celular no corte Corte com lâminas bem afiadas sob enzimático (maçã, descompartimentalizando baixas temperaturas; aplicação de banana, abacate, PPO/POD e compostos fenólicos coberturas comestíveis (ex.: fécula de alface, batata) em presença de O 2 /H 2 O 2 ; lâminas mandioca, dextrina em maçã); atmosfera cegas; etileno ativando PAL e modificada (alface); radiação gama para síntese de fenólicos; preparo sem inibir PPO (alface, aipo); cadeia do frio refrigeração. contínua. Não usar branqueamento térmico. Amolecimento e Matéria-prima em estádio Seleção e classificação rigorosas do perda de firmeza avançado de maturação; perda de estádio de maturação; pré-resfriamento e (manga e frutas turgor celular; ação de manutenção em baixa temperatura para maduras) protopectinase, PME e enzimas desacelerar atividade enzimática; despolimerizantes drenagem suave em escorredor (evitando (poligalacturonase, liases) dano mecânico da centrifugação em degradando o pectato de cálcio. cubos macios). Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças"}, {"type": "table", "rows": [["Defeito", "Causas (Processo ou Formulação)", "Estratégias de Prevenção/Correção (Ingredientes e Etapas de Processo)"], ["Amarelecimento / perda de clorofila (couve, brócolis, espinafre)", "Estresse mecânico do corte intensificando respiração e produção de etileno; temperatura elevada durante preparo ou estocagem.", "Uso de lâminas afiadas; pré-resfriamento e cadeia do frio ininterrupta; aplicação de ozônio (menor amarelecimento em espinafre) e atmosfera modificada."]]}, {"type": "p", "text": "Deterioração Uso de matéria-prima parcialmente Rejeição integral de frutos deteriorados; microbiana e avariada; liberação de exsudados BPF rigorosas e higienização de fermentação açucarados não removidos equipamentos; pré-lavagem e sanitização (melancia, melão, (fermentação por S. cerevisiae ); pH eficientes; centrifugação/drenagem para abacaxi, folhosas) ~6,0 favorecendo patógenos; remover água livre e exsudados; controle biofilmes; UR ~100%; quebra da de UR (85–95%); AM, ozônio ou cadeia do frio. coberturas comestíveis (ex.: morango). Enraizamento e UR próxima a 100% estimulando Manter UR estritamente na faixa de 85– danos pelo frio / enraizamento (alho/cebola); 95%; evitar perda hídrica por meio de perdas nutricionais desidratação acelerando danos embalagens adequadas e pré(alho, cebola, pelo frio e perda de vitaminas A e resfriamento rápido. folhosas) C e lipídeos."}, {"type": "h2", "text": "1.5 Comparações e Decisões de Engenharia"}, {"type": "p", "text": "Produto Inteiro ( in natura ) vs. Minimamente Processado (MMP): O vegetal intacto preserva casca, cutícula e compartimentalização celular, durando semanas ou meses. No MMP, a remoção das barreiras físicas eleva a respiração (ex.: +95% em rabanete fatiado), o etileno, a atividade de PAL e a transpiração, encurtando a vida útil para 4–7 dias e exigindo cadeia do frio, sanitização e barreiras adicionais. Pré-Resfriamento (Arrefecimento Rápido) vs. Armazenamento Frigorífico: Câmaras frigoríficas convencionais destinam-se apenas a manter a temperatura e não possuem capacidade frigorífica nem velocidade de circulação de ar suficientes para remover rapidamente o calor de campo. O pré-resfriamento exige equipamentos dedicados com alta potência frigorífica e íntimo contato de ar ou água em alta velocidade. Branqueamento Térmico vs. Barreiras Não Térmicas no Controle de PPO: Embora o branqueamento desnature enzimas oxidativas (convertendo a forma nativa organizada em forma inativa desenrolada ao acaso por quebra de interações hidrofóbicas, pontes de hidrogênio, dissulfeto e iônicas), não pode ser empregado em MMP porque elimina o frescor e descaracteriza Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças o produto. A engenharia deve recorrer a refrigeração no corte/estocagem, coberturas comestíveis (fécula de mandioca, dextrina), atmosfera modificada ou radiação gama. Frutas de Baixo pH vs. Frutas de Alto pH (~6,0): Em frutas ácidas (ex.: abacaxi, morango), o pH baixo restringe bactérias patogênicas e seleciona fungos e leveduras (ex.: fermentação de exsudados por S. cerevisiae ). Em frutas de pH próximo a 6,0 (melão, melancia, mamão, abacate), a barreira da acidez inexiste, permitindo multiplicação de patógenos como Listeria monocytogenes , Salmonella spp. e E. coli — tornando críticas a sanitização, o controle de biofilmes, as BPF e a cadeia do frio. Centrifugação vs. Drenagem em Escorredor & Abrasão vs. Corte Manual: Folhosas e raízes fatiadas/raladas suportam centrifugação para expulsar água e exsudados; cubos macios (manga, abóbora) requerem drenagem suave em escorredor para evitar esmagamento. Da mesma forma, o descascamento por abrasão em batelada aplica-se apenas a vegetais resistentes e de tamanho uniforme (minicenoura), enquanto frutos delicados exigem descascamento/corte com lâminas afiadas. Controle de Umidade Relativa (Ar Seco vs. 85–95% vs. ~100%): O engenheiro deve operar na janela de 85–95% UR : abaixo dela ocorre murchamento e perda de vitaminas A e C; acima dela (~100%) maximiza-se a proliferação microbiana e o enraizamento em bulbos (alho e cebola). Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças Instruções: Responda de forma técnica, objetiva e fundamentada nos mecanismos fisiológicos, bioquímicos e operacionais da tecnologia de processamento mínimo. Evite respostas genéricas: conecte cada etapa do fluxograma ao parâmetro crítico e ao mecanismo envolvido."}], "simulado": {"intro": [], "questions": [{"num": 1, "title": "Questão 1 — Processo e Mecanismos Fisiológicos do Estresse 2,5 pontos", "blocks": [{"type": "p", "text": "Uma unidade de processamento mínimo que produz couve fatiada e minicenouras passou a registrar, em menos de 48 horas após o envase, amarelecimento acelerado na couve, esbranquiçamento superficial nas minicenouras e aquecimento interno das embalagens. Na auditoria técnica de processo, constatou-se que: (i) os lotes recém-chegados do campo eram levados diretamente para a câmara fria comum de estocagem sem etapa prévia de arrefecimento rápido; (ii) o fatiamento da couve ocorria em sala a 22 °C utilizando lâminas sem afiação periódica; e (iii) a etapa de centrifugação foi encurtada, deixando excesso de água e exsudados nas folhas."}, {"type": "p", "text": "a) (0,8 pt) Estruture o fluxograma sequencial completo adequado para essa linha e justifique tecnicamente por que a câmara frigorífica de estocagem não substitui a etapa de pré-resfriamento (arrefecimento rápido)."}, {"type": "p", "text": "b) (1,0 pt) Explique a cascata fisiológica e bioquímica desencadeada pelo corte com lâminas desgastadas em temperatura ambiente, relacionando rompimento celular, produção de etileno, taxa respiratória, atividade da enzima PAL, perda de clorofila e transpiração."}, {"type": "p", "text": "c) (0,7 pt) Justifique o papel tecnológico da etapa de centrifugação e da seleção de embalagem adequada para corrigir o esbranquiçamento nas minicenouras e reduzir o risco microbiológico na couve."}]}, {"num": 2, "title": "Questão 2 — Defeitos Tecnológicos, Enzimas e Barreiras 2,5 pontos", "blocks": [{"type": "p", "text": "A equipe de P&D de uma agroindústria enfrenta dois defeitos críticos em novas linhas de frutas frescas cortadas: (1) cubos de maçã desenvolvem coloração marrom intensa já no primeiro dia de armazenamento refrigerado; e (2) cubos de manga apresentam amolecimento severo, perda de integridade estrutural e acúmulo de líquido no fundo da bandeja após 3 dias. Um técnico sugeriu aplicar branqueamento térmico rápido nos cubos de maçã para inativar as enzimas responsáveis pelo escurecimento e submeter os cubos de manga à centrifugação em alta rotação para remover o excesso de líquido."}, {"type": "p", "text": "a) (1,0 pt) Descreva detalhadamente o mecanismo bioquímico do escurecimento enzimático nos cubos de maçã (desde a perda de compartimentalização celular até a formação de melaninas, citando as enzimas e substratos envolvidos) e justifique por que a proposta de branqueamento térmico é tecnologicamente inviável para um produto minimamente processado."}, {"type": "p", "text": "b) (0,7 pt) Indique uma estratégia não térmica baseada em ingredientes/revestimentos funcionais capaz de conter o escurecimento da maçã no primeiro dia, citando exemplos validados de materiais formadores de cobertura. Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças"}, {"type": "p", "text": "c) (0,8 pt) Explique o mecanismo bioquímico responsável pelo amolecimento dos cubos de manga (citando a estrutura da parede celular, as substâncias pécticas e as classes de enzimas pectinolíticas) e avalie criticamente a proposta de centrifugação em alta rotação, propondo os ajustes operacionais corretos desde a seleção da matéria-prima até a drenagem."}]}, {"num": 3, "title": "Questão 3 — Decisão Técnica e Comparação de Matrizes Vegetais 2,5 pontos", "blocks": [{"type": "p", "text": "Uma planta industrial opera simultaneamente duas linhas de frutas minimamente processadas: Linha A (cubos de abacaxi, fruto não-climatérico de baixo pH) e Linha B (cubos de melão e melancia, frutas de pH próximo a 6,0, sendo o melão climatérico). Adicionalmente, a indústria planeja lançar arilos de romã prontos para consumo, mas seu sistema logístico atual sofre oscilações térmicas, elevando a temperatura da carga de 5 °C para 20 °C durante 24 horas no transporte."}, {"type": "p", "text": "a) (0,9 pt) Compare o perfil microbiológico predominante e os riscos sanitários entre a Linha A e a Linha B, especificando grupos e exemplos de microrganismos envolvidos e o impacto de eventuais biofilmes sobre a eficácia da sanitização."}, {"type": "p", "text": "b) (0,9 pt) Com base nas técnicas complementares de conservação, proponha e justifique a tecnologia mais adequada para estender a vida útil e preservar o perfil de compostos voláteis no abacaxi e nos melões (cantaloupe/honeydew ou kajari), explicando também os cuidados com a atmosfera modificada sobre o aroma."}, {"type": "p", "text": "c) (0,7 pt) Avalie tecnicamente o impacto da oscilação térmica (5 °C para 20 °C por 1 dia) na atividade respiratória e na vida útil dos arilos de romã, e indique o parâmetro de umidade relativa ideal que deve ser mantido na câmara de estocagem (justificando os riscos dos extremos de UR)."}]}, {"num": 4, "title": "Questão 4 — Visão de Engenheiro de Alimentos e Projeto de Processo 2,5 pontos", "blocks": [{"type": "p", "text": "Você foi designado(a) como Engenheiro(a) de Alimentos responsável por projetar o processo tecnológico de um mix fresco minimamente processado pronto para consumo composto por alface fatiada, espinafre e cenoura em tiras , com meta de máxima preservação de cor, textura crocante, perfil aromático e segurança microbiológica sem emprego de tratamento térmico ou congelamento."}, {"type": "p", "text": "a) (0,8 pt) Defina os critérios tecnológicos de seleção e classificação das matérias-primas (considerando integridade, estádio de maturação, padrão respiratório e a alta taxa respiratória / baixa resistência difusiva da alface) e indique o método de descascamento mais adequado para a cenoura, destacando a condição obrigatória de padronização para reduzir perdas."}, {"type": "p", "text": "b) (0,9 pt) Proponha uma combinação de pelo menos duas barreiras tecnológicas complementares (além da sanitização e cadeia do frio) direcionadas especificamente aos defeitos limitantes da alface, do espinafre e da cenoura, justificando o mecanismo de ação de cada técnica escolhida."}, {"type": "p", "text": "c) (0,8 pt) Liste os 4 pontos críticos operacionais mais decisivos do fluxograma desse mix (do corte à distribuição) e explique como a falha em cada um deles comprometeria a vida útil de 4 a 7 dias do produto. Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças"}]}]}, "gabarito": {"intro": [{"type": "h2", "text": "Gabarito Comentado e Termos-Chave Obrigatórios"}], "questions": [{"num": 1, "title": "Questão 1 — Gabarito Comentado (2,5 pontos)", "blocks": [{"type": "p", "text": "a) (0,8 pt) Fluxograma e Pré-Resfriamento: O fluxograma completo deve seguir: (1) Recebimento, inspeção e seleção (descarte integral de vegetais deteriorados) → (2) Pré-resfriamento (arrefecimento rápido) → (3) Pré-lavagem/higienização inicial → (4) Classificação → (5) Descascamento (abrasão em batelada para minicenoura com tamanho uniforme) e fatiamento/corte (lâminas afiadas, ambiente refrigerado) → (6) Sanitização e enxágue → (7) Centrifugação → (8) Barreiras complementares (ex.: AM) → (9) Acondicionamento em embalagem adequada → (10) Estocagem e distribuição resfriadas. A câmara fria comum não substitui o pré-resfriamento porque não dispõe da elevada capacidade frigorífica , da alta velocidade de circulação de ar ou água com íntimo contato com o produto nem de equipamentos especiais necessários para remover rapidamente o calor de campo; câmaras comuns servem apenas para manter a temperatura já reduzida."}, {"type": "p", "text": "b) (1,0 pt) Cascata Fisiológica e Bioquímica: O corte com lâminas sem afiação amplia o dano mecânico, promovendo rompimento de organelas celulares, alteração da permeabilidade das membranas, desorganização celular e exposição de tecidos internos hidratados. Em temperatura ambiente (22 °C), a resposta ao estresse é potencializada: há ativação imediata da síntese de etileno e salto da taxa respiratória (oxidação de carboidratos e ácidos orgânicos com liberação de CO , H O 2 2 e calor vital , explicando o aquecimento interno; na couve fatiada o pico dobra em relação à inteira). O etileno estimula a degradação de clorofila (amarelecimento da couve) e induz o metabolismo dos fenilpropanoides com forte aumento da enzima fenilalanina amônia-liase (PAL) (elevando a síntese de compostos fenólicos na minicenoura). Simultaneamente, a exposição da água intercelular acelera a transpiração , promovendo dessecação/esbranquiçamento superficial."}, {"type": "p", "text": "c) (0,7 pt) Centrifugação e Embalagem: A centrifugação remove o excesso de água livre da sanitização/enxágue e os exsudados celulares liberados pelo corte (ricos em açúcares e nutrientes que servem de meio de cultura para microrganismos deteriorantes e patogênicos). Já a embalagem adequada reduz a evaporação de água dos tecidos expostos, minimizando a dessecação/esbranquiçamento superficial das minicenouras e mantendo a turgidez."}, {"type": "p", "text": "Termos-chave obrigatórios: pré-resfriamento (arrefecimento rápido), calor de campo, capacidade frigorífica, circulação de ar/água, lâminas afiadas, rompimento de organelas, etileno, taxa respiratória, calor vital, PAL (fenilalanina amônia-liase), degradação de clorofila, transpiração, dessecação superficial, exsudados celulares, centrifugação."}]}, {"num": 2, "title": "Questão 2 — Gabarito Comentado (2,5 pontos)", "blocks": [{"type": "p", "text": "a) (1,0 pt) Escurecimento Enzimático e Inviabilidade do Branqueamento: Na maçã intacta, enzimas oxidativas — polifenoloxidase (PPO) (cloroplastos/membranas/parede) e peroxidase (POD) — estão compartimentalizadas e separadas dos compostos fenólicos (no vacúolo). O corte desfaz essa compartimentalização, permitindo que a PPO catalise a hidroxilação de monofenóis a difenóis (atividade cresolase ) e a oxidação de difenóis com O a quinonas incolores (atividade catecolase ); a 2 Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças POD também oxida difenóis na presença de H O (além da lacase). Por via não enzimática (oxidação 2 2 acoplada), as quinonas condensam-se com fenóis, aminoácidos e proteínas, polimerizando-se em melaninas marrons/escuras. O branqueamento térmico é inviável em MMP porque, apesar de desnaturar as enzimas (perda da conformação nativa por quebra de interações hidrofóbicas, pontes de hidrogênio, dissulfeto e ligações iônicas), retira o frescor e descaracteriza o produto minimamente processado ."}, {"type": "p", "text": "b) (0,7 pt) Estratégia Não Térmica com Revestimentos: Aplicar coberturas/revestimentos comestíveis sobre os cubos de maçã após o corte/sanitização, formando barreira física que limita o contato com o O e retarda reações oxidativas. Exemplos validados nos slides para maçã: fécula de 2 mandioca e dextrina , que mantiveram a coloração no 1º dia sem escurecimento significativo (alginato também foi avaliado como matriz de cobertura)."}, {"type": "p", "text": "c) (0,8 pt) Amolecimento da Manga e Ajuste Operacional: A firmeza da polpa depende do turgor celular e da lamela média (cimento celular de pectato de cálcio formado por ligações inter e intramoleculares de protopectina com Ca 2+ ), além de hemicelulose, pectina e celulose na 1ª parede (a celulose varia pouco). Durante o amadurecimento/estresse, enzimas pectinolíticas degradam a parede: protopectinase converte protopectina insolúvel em pectina; pectinametilesterase (PME) desmetoxila a pectina em ácido péctico; e enzimas despolimerizantes ( pectina-liase , polimetilgalacturonase , pectato-liase e poligalacturonase ) clivam as cadeias poligalacturônicas até solubilização e degradação total, causando amaciamento. A centrifugação em alta rotação é inadequada para cubos macios de manga pois intensifica danos mecânicos e exsudação; deve-se substituir por drenagem suave em escorredor/caixas vazadas , selecionar mangas em estádio de maturação adequado (mais firmes, antes do amolecimento avançado), cortar com lâminas afiadas sob refrigeração e manter cadeia do frio."}, {"type": "p", "text": "Termos-chave obrigatórios: compartimentalização celular, compostos fenólicos (vacúolo), PPO (cresolase e catecolase), POD, quinonas, melaninas, desnaturação enzimática, descaracterização do frescor, coberturas comestíveis (fécula de mandioca, dextrina), lamela média, protopectina, pectato de cálcio, protopectinase, PME (pectinametilesterase), poligalacturonase/liases, drenagem em escorredor."}]}, {"num": 3, "title": "Questão 3 — Gabarito Comentado (2,5 pontos)", "blocks": [{"type": "p", "text": "a) (0,9 pt) Comparação Microbiológica e Biofilmes: Na Linha A (abacaxi, baixo pH) , a acidez restringe bactérias patogênicas, predominando deterioração por fungos (ex.: Botrytis cinerea , Aspergillus niger ) e leveduras ( Candida , Cryptococcus , Kluyveromyces , Pichia , Zygosaccharomyces e Saccharomyces cerevisiae , que fermenta os açúcares liberados nos exsudados do corte). Na Linha B (melão e melancia, pH próximo a 6,0) , a ausência da barreira de acidez permite o crescimento de bactérias patogênicas de alto risco, como Listeria monocytogenes , Salmonella spp. (associada a melancia pré-cortada), Shigella spp., Aeromonas hydrophila , Yersinia enterocolitica , Escherichia coli e Staphylococcus aureus . A formação de biofilmes nas superfícies vegetais ou equipamentos protege os microrganismos, prejudicando a eficácia da higienização e sanitização e elevando a contaminação; por isso, BPF, pré-lavagem, sanitização e remoção de exsudados são obrigatórias."}, {"type": "p", "text": "b) (0,9 pt) Seleção de Técnicas Complementares e Aroma: Para o abacaxi , a atmosfera modificada (AM) é indicada por promover inibição de leveduras e controle da produção de compostos voláteis. Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças Para melões , pode-se aplicar atmosfera modificada (que preserva os compostos voláteis característicos do aroma em melões cantaloupe e honeydew) e/ou revestimentos comestíveis (como proteína isolada de soja em melão kajari, que mantém a qualidade e estende a vida útil). Cuidado crítico: a composição gasosa da AM/AC deve ser bem dimensionada para cada espécie, pois níveis inadequados de O /CO e temperatura podem interferir negativamente no perfil de voláteis 2 2 (álcoois, aldeídos, terpenos, ésteres — \"compostos de impacto\") e gerar aromas indesejáveis."}, {"type": "p", "text": "c) (0,7 pt) Oscilação Térmica e Umidade Relativa: A quebra da cadeia do frio de 5 °C para 20 °C por apenas 1 dia provoca elevação abrupta da atividade respiratória nos arilos de romã (saltando de ~3– 4 para ~17–20 mL CO kg −1 h −1 ), acelerando o consumo de substratos, a senescência e o 2 crescimento microbiano, o que encurta drasticamente a vida útil. A umidade relativa ideal na estocagem é de 85% a 95% : abaixo dessa faixa ocorre desidratação e enrugamento; próximo a 100% UR favorece-se a proliferação e disseminação de microrganismos (além de enraizamento em hortaliças como alho e cebola)."}, {"type": "p", "text": "Termos-chave obrigatórios: baixo pH (fungos e leveduras, Saccharomyces cerevisiae ), pH próximo a 6,0 ( Listeria monocytogenes , Salmonella spp., Shigella spp., E. coli , S. aureus ), biofilmes, atmosfera modificada, compostos voláteis (\"compostos de impacto\"), proteína isolada de soja, cadeia do frio (5 °C vs. 20 °C), umidade relativa 85–95%."}]}, {"num": 4, "title": "Questão 4 — Gabarito Comentado (2,5 pontos)", "blocks": [{"type": "p", "text": "a) (0,8 pt) Seleção de Matéria-Prima e Descascamento da Cenoura: Deve-se selecionar exclusivamente hortaliças sãs (rejeitando integralmente qualquer unidade com deterioração, sem aproveitamento parcial), no estádio de maturação adequado, classificadas por defeitos, tamanho, cor e forma. A alface exige cuidado extremo por apresentar altíssima taxa respiratória (75 mL kg −1 h −1 a 20 °C) e baixíssima resistência difusiva (0,084 L kg −1 h −1 ) , o que amplifica sua perecibilidade após o corte. Para a cenoura (tecido firme e resistente), o método mais indicado é o descascamento por abrasão em batelada (superfície abrasiva rotativa com jatos de água para arraste da casca), sendo condição obrigatória a uniformidade de tamanho das raízes na classificação prévia para minimizar perdas de polpa."}, {"type": "p", "text": "b) (0,9 pt) Combinação de Barreiras Tecnológicas: Duas (ou mais) barreiras complementares validadas nos slides podem ser combinadas conforme os defeitos de cada componente do mix: (1) Atmosfera modificada (AM) na embalagem final — reduz o escurecimento enzimático e o crescimento microbiano na alface e retarda a respiração/transpiração do conjunto; (2) Ozônio na higienização/tratamento do espinafre — reduz o amarelecimento (perda de clorofila), mantém a composição e reduz populações microbianas; e/ou (3) Radiação gama — inibe diretamente a atividade da polifenoloxidase (PPO) na alface, contendo o escurecimento sem uso de calor. Na cenoura em tiras, a embalagem com barreira à umidade associada à cadeia do frio (+4 °C) previne o esbranquiçamento superficial e limita variações de carotenoides e voláteis."}, {"type": "p", "text": "c) (0,8 pt) Quatro Pontos Críticos Operacionais: (1) Corte com lâminas bem afiadas em ambiente refrigerado: lâminas cegas ou temperatura alta ampliam o dano celular, disparando respiração, etileno e atividade de PAL/PPO; (2) Sanitização, enxágue e BPF (controle de biofilmes): garantem redução da carga microbiana inicial em produtos de alta umidade (80–95%) consumidos crus; (3) Tecnologia de Frutas, Hortaliças e Derivados Tema: Processamento Mínimo de Frutas e Hortaliças Centrifugação eficiente: elimina água livre e exsudados celulares nutritivos que aceleram deterioração microbiana; (4) Embalagem adequada + Cadeia do frio ininterrupta (4–5 °C; 85–95% UR) e controle do tempo de trânsito: evitam transpiração excessiva (murchamento, perda de vitaminas A e C e esbranquiçamento da cenoura) e mantêm o metabolismo suprimido dentro da janela de 4 a 7 dias."}, {"type": "p", "text": "Termos-chave obrigatórios: rejeição integral de deteriorados, taxa respiratória da alface (75 mL kg −1 h −1 ), resistência difusiva (0,084 L kg −1 h −1 ), descascamento por abrasão em batelada, uniformidade de tamanho, atmosfera modificada, ozônio (menor amarelecimento), radiação gama (inibição de PPO), lâminas afiadas sob refrigeração, centrifugação (remoção de exsudados), cadeia do frio, 85–95% UR."}]}]}}, {"id": "aula4", "short": "Aula 4 · Matéria-Prima", "title": "Aula 4 — Matérias-Primas e sua Classificação", "subtitle": "Botânica, hortaliças, frutos climatéricos vs. não-climatéricos, etileno e injúria pelo frio", "badge": "Aula 4", "accent": "#0d9488", "hasSimulado": true, "guia": [{"type": "p", "text": "ENGENHARIA DE ALIMENTOS • TECNOLOGIA DE FRUTAS, HORTALIÇAS E DERIVADOS"}, {"type": "h2", "text": "Matérias-Primas e sua Classificação"}, {"type": "p", "text": "Material Técnico Orientado a Provas Dissertativas • Conteúdo: Guia de Estudo, Simulado (10,0 pontos) e Gabarito Comentado"}, {"type": "h2", "text": "PARTE 1"}, {"type": "h2", "text": "Guia de Estudo Orientado à Prova 1. Matéria-Prima, Terminologia Técnica e Classificações"}, {"type": "h3", "text": "1.1 Delimitação Conceitual e Anatomia"}, {"type": "p", "text": "Na Engenharia de Alimentos, o termo tecnicamente adequado para designar conjuntamente frutas e hortaliças é produtos de origem vegetal , evitando-se o uso de \"vegetal\" como sinônimo estrito de hortaliça. Dentro da horticultura, a fruticultura compreende as técnicas voltadas a plantas produtoras de frutas, enquanto a olericultura abrange o cultivo de olerícolas (hortaliças). Fruto (definição botânica): estrutura resultante do desenvolvimento do ovário de flores ou inflorescências de angiospermas após a fecundação dos óvulos, os quais originam as sementes. Fruta: denominação aplicada aos frutos carnosos ou polpudos que acumulam água e compostos orgânicos responsáveis pela suculência e atratividade sensorial. Pseudofruto (falso fruto): derivado de uma única flor em que ocorre desenvolvimento carnoso de órgãos acessórios além do ovário, como o pedúnculo floral no caju (onde o fruto verdadeiro é a castanha externa que abriga a semente) e o receptáculo floral na maçã e na pera (que envolve o ovário com sementes). Fruto partenocárpico: formado pelo desenvolvimento do ovário sem fecundação dos óvulos, apresentando ausência ou esterilidade de sementes (ex.: banana cultivada e uva Thompson). Anatomia do fruto: constituído por pedúnculo , semente e pericarpo , sendo o pericarpo subdividido em epicarpo (camada externa), mesocarpo (polpa intermediária) e endocarpo (camada interna junto à semente). Hortaliças: plantas anuais, bianuais ou perenes cultivadas em hortas, campo aberto ou cultivo protegido e utilizadas quase exclusivamente como alimento, abrangendo cinco grupos principais: subterrâneas (raízes, bulbos, rizomas e tubérculos), herbáceas/aéreas (folhas, pecíolos, caules e inflorescências), condimentos/temperos, frutos (imaturos, maduros ou sementes, incluindo melões e melancias pelo comportamento hortícola) e leguminosas (grãos e/ou vagens colhidos verdes ou secos). Tecnologia de Frutas, Hortaliças e Derivados • Matérias-Primas e sua Classificação Page 1 of 13"}, {"type": "h3", "text": "1.2 Classificação Tecnológica e Botânica dos Frutos"}, {"type": "table", "rows": [["Critério", "Categorias", "Características Estruturais e Exemplos"], ["Número de sementes", "Partenocárpicos; Monospérmicos; Dispérmicos; Trispérmicos; Polispérmicos", "Sem sementes/estéreis (banana, uva Thompson); 1 semente (abacate, manga, pêssego, ameixa); 2 sementes (café, uvaia); 3 sementes (longan, pequi, acerola); 4 ou mais (melancia, mamão, melão, maracujá)."], ["Abertura (liberação de sementes)", "Deiscentes; Indeiscentes", "Deiscentes abrem o pericarpo na maturidade (ervilha); indeiscentes permanecem fechados (nozes, avelã)."], ["Consistência do pericarpo — Secos", "Cariopse; Balaúste; Aquênio; Legume; Síliqua", "Pericarpo rígido e seco. Cariopse: indeiscente, 1 semente soldada ao pericarpo (milho, trigo, arroz). Balaúste: coriáceo, polispérmico com testa carnosa comestível (romã). Aquênio: semente não soldada (frutículos do morango sobre eixo carnoso). Legume: monocárpico, deiscência dorsal/ventral (feijão, ervilha; indeiscentes: jatobá, amendoim). Síliqua: dois carpelos com falso septo (mostarda, couve, repolho, rabanete, agrião)."], ["Consistência do pericarpo — Carnosos", "Hesperídio; Peponídeo; Sicônio; Sorose", "Polpa (mesocarpo) é a fração principal. Hesperídio: epicarpo com glândulas oleosas, mesocarpo esponjoso, endocarpo membranoso com vesículas de suco (cítricos). Peponídeo: epicarpo rijo/espesso, cavidade com sementes (melão, melancia, abóbora). Sicônio: receptáculo carnoso encerrando frutos/sementes (figo). Sorose: fusão de bagas com frutíolos/olhos sobre eixo central (abacaxi)."], ["Número de ovários de origem", "Simples/Verdadeiros (Baga, Baciforme, Drupa); Compostos (Agregados e Múltiplos/Infrutescências)", "Simples: único ovário. Baga: mesocarpo e endocarpo suculentos (uva, tomate, mamão). Baciforme: semelhante à baga (maçã). Drupa: endocarpo duro/lenhoso com 1 semente (abacate, manga, pêssego; subtipo trima: nozes, amêndoas, coco). Agregados: vários ovários de uma flor multipistilada. Múltiplos: ovários de flores de uma inflorescência (abacaxi, milho). Quanto aos carpelos: monocárpicos (1 carpelo), apocárpicos (carpelos livres, ex.: figo) e sincárpicos (fusão de ovários vizinhos, ex.: abacaxi)."]]}, {"type": "p", "text": "Tecnologia de Frutas, Hortaliças e Derivados • Matérias-Primas e sua Classificação Page 2 of 13"}, {"type": "table", "rows": [["Critério", "Categorias", "Características Estruturais e Exemplos"], ["Produção de etileno na maturação", "Climatéricos; Não-climatéricos", "Climatéricos amadurecem na planta ou após colheita imatura (banana, maçã, tomate, abacate, manga, mamão). Não- climatéricos só completam o amadurecimento na planta (citros, carambola, abacaxi, caju, uva, coco)."], ["Aptidão climática", "Tropicais; Subtropicais; Temperadas", "Tropicais: folhas persistentes, intolerantes ao frio, média anual 22–30 °C (banana, caju, abacaxi, mamão, manga, maracujá). Subtropicais: folhas persistentes, média 15– 22 °C (cítricos, nêspera, abacate). Temperadas: perdem folhas no inverno, resistentes ao frio, média 5–15 °C (uva, maçã, pêssego)."], ["Hábito de crescimento", "Arbóreas; Arbustivas; Herbáceas; Trepadeiras", "Arbóreas (manga, abacate, jaca); arbustivas (figo, amora, mamão); herbáceas (banana, morango, abacaxi); trepadeiras com gavinhas (videira, maracujazeiro)."]]}, {"type": "h3", "text": "1.3 Classificação das Hortaliças e Padronização Tecnológica"}, {"type": "p", "text": "As hortaliças classificam-se pela morfologia da parte consumida , pelo parentesco botânico (cuja unidade básica é a espécie, como Brassica oleracea nas variedades acephala — couve, capitata — repolho e botrytis — couve-flor; possui alta estabilidade frente às variações agrotecnológicas, embora falte consenso taxonômico universal) e por critérios fisiológicos pós-colheita (sensibilidade ao frio, atividade metabólica e intensidade respiratória). Partes aéreas: folhas (espinafre, couve, acelga, repolho, agrião, alface, almeirão, chicória, bertalha, endívia, rúcula, taioba, mostarda, couve-chinesa, couve-de-bruxelas), pecíolos (ervadoce, aipo, ruibarbo), hastes/talos (aspargo, aipo, alho-porró) e inflorescências (brócolis, alcachofra, couve-flor). Partes subterrâneas: raízes (cenoura, beterraba, mandioca, batata-doce, mandioquinha-salsa, nabo, rabanete), bulbos (alho, cebola) e caules modificados — rizomas (gengibre) e tubérculos (batata, inhame, taro). Frutos e sementes olerícolas: frutos imaturos carnosos (abobrinha, berinjela, pepino, pimentão, jiló, chuchu, maxixe), imaturos não-carnosos e sementes (ervilha, milho-doce, quiabo, feijãovagem), maturos polpudos e macios (tomate, melão, melancia), maturos polpudos e duros (abóbora, moranga) e sementes (feijões, lentilhas verde/vermelha com ou sem tegumento, grãode-bico tipos desi e kabuli, ervilhas lisas e rugosas). Padronização tecnológica da matéria-prima: consiste em estabelecer limites mensuráveis para atributos físicos e de qualidade do produto agrícola — tamanho, massa, forma, turbidez, coloração, grau de maturação, presença de resíduos químicos e sujidades — garantindo uniformidade operacional e adequação ao destino tecnológico. Tecnologia de Frutas, Hortaliças e Derivados • Matérias-Primas e sua Classificação Page 3 of 13"}, {"type": "h2", "text": "2. Fluxograma de Manejo Pós-Colheita e Pontos Críticos"}, {"type": "p", "text": "O aproveitamento industrial e a manutenção da qualidade de frutas e hortaliças dependem de uma sequência rigorosa de decisões pós-colheita orientadas pela classificação fisiológica da matériaprima."}, {"type": "p", "text": "Etapa 1 — Definição do Ponto de Colheita segundo Comportamento Fisiológico Objetivo tecnológico: Assegurar que a matéria-prima possua potencial completo de desenvolvimento sensorial ou já apresente a qualidade comestível plena. Parâmetros críticos e cuidados: Frutos climatéricos (banana, manga, mamão, abacate, maçã, tomate) podem ser colhidos ainda imaturos (ex.: estádios iniciais da escala de Von Loesecke na banana; acompanhamento temporal de polpa na manga aos 90–135 dias), pois completarão o amadurecimento após o desligamento da planta. Frutos não-climatéricos (citros, abacaxi, uva, caju, carambola, coco) devem permanecer na planta até a maturação completa, pois não elevam a síntese de etileno pós-colheita."}, {"type": "p", "text": "Etapa 2 — Classificação, Triagem e Padronização de Lotes Objetivo tecnológico: Homogeneizar os lotes recebidos e segregar matérias-primas segundo atributos físicos, estádio de maturação e integridade. Parâmetros críticos e cuidados: Avaliar tamanho, massa, forma, coloração, grau de maturação, turbidez (quando aplicável), além de remover unidades com sujidades ou presença de resíduos químicos. Separar frutos em estádios distintos de maturação evita que frutos mais avançados emitam etileno e acelerem a senescência do lote inteiro."}, {"type": "p", "text": "Etapa 3 — Manejo do Amadurecimento (Climatização ou Retardo Metabólico) Objetivo tecnológico: Sincronizar a maturação para consumo/processamento ou prolongar a vida útil mediante supressão da atividade respiratória. Parâmetros críticos e cuidados: Em climatéricos como a banana, a aplicação exógena de etileno (C 2 H 4 ) é benéfica para uniformizar cor e textura. Quando o objetivo é conservação, deve-se inibir a produção e ação do etileno pelo binômio temperatura segura e controle gasoso."}, {"type": "p", "text": "Etapa 4 — Resfriamento e Manutenção da Cadeia do Frio Objetivo tecnológico: Reduzir a taxa respiratória e a velocidade das transformações bioquímicas nos tecidos vegetais, maximizando a vida útil."}, {"type": "p", "text": "Parâmetros críticos e cuidados: Respeitar estritamente a Temperatura Mínima de Segurança (TMS) de cada espécie (ex.: batata 3 °C; goiaba 4,5 °C; quiabo e mamão 7 °C; abacaxi e tomate maduro 7–10 °C; banana 11,5–13 °C). Uma vez resfriado, o produto exige manutenção ininterrupta da cadeia do frio ; desvios acima ou abaixo da faixa ideal desencadeiam desordens fisiológicas. Tecnologia de Frutas, Hortaliças e Derivados • Matérias-Primas e sua Classificação Page 4 of 13"}, {"type": "p", "text": "Etapa 5 — Controle da Atmosfera e Segregação por Grupos de Compatibilidade Objetivo tecnológico: Minimizar a biossíntese de etileno, conter a taxa respiratória e impedir contaminação cruzada por etileno entre espécies. Parâmetros críticos e cuidados: Aplicar redução de O 2 (↓ 8%) e elevação de CO 2 (↑ 2%), respeitando os limites fisiológicos seguros de cada espécie. Nunca armazenar no mesmo ambiente emissores de etileno alto/muito alto (maracujá, maçã, abacate, mamão, pêssego) junto a produtos sensíveis ao hormônio (como hortaliças folhosas) ou espécies com TMS incompatíveis."}, {"type": "h2", "text": "3. Mecanismos Físico-Químicos, Bioquímicos e Fisiológicos"}, {"type": "h3", "text": "3.1 Mecanismo de Ação do Etileno (C H ) no Amadurecimento"}, {"type": "p", "text": "2 4 O etileno (C H ) é o principal fator endógeno estimulador da atividade respiratória, atuando como o 2 4 hormônio do amadurecimento. Ao ser sintetizado (ou aplicado exogenamente em climatéricos), o etileno ativa sistemas enzimáticos específicos que promovem transformações coordenadas na composição dos tecidos: Redução da acidez: ácidos orgânicos são degradados/consumidos, resultando em baixa acidez no fruto maduro. Conversão de carboidratos: hidrólise enzimática do amido em açúcares solúveis, elevando a doçura. Alteração de cor (pigmentos): degradação da clorofila (verde) acompanhada pela síntese ou revelação de outros pigmentos, como antocianinas e pigmentos amarelos/alaranjados. Modificação de textura (amaciamento): conversão enzimática de pectinas insolúveis em pectinas solúveis, reduzindo a firmeza da polpa até o estádio comestível. Desenvolvimento de aroma: quebra de moléculas grandes em moléculas pequenas voláteis responsáveis pelo perfil aromático característico. No comportamento climatérico , observa-se distinção fisiológica relevante entre espécies: em maçã e tomate, a elevação da taxa respiratória ocorre tanto com o fruto preso à planta quanto após a colheita; no abacate, o pico respiratório climatérico ocorre somente após o desligamento da planta; em abacate, banana e manga, o aumento respiratório é rápido e o estádio comestível está intimamente associado ao pico climatérico."}, {"type": "h3", "text": "3.2 Mecanismo das Desordens pelo Frio (Injúria pelo Frio)"}, {"type": "p", "text": "Produtos de origem tropical ou subtropical sofrem transtornos metabólicos quando expostos a temperaturas inferiores a 10 °C ou 13 °C, porém ainda acima do seu ponto de congelamento. Os sintomas são usualmente irreversíveis e comprometem severamente a qualidade sensorial e a vida útil. O mecanismo de desenvolvimento da injúria é governado pela interação entre dois fatores críticos: temperatura e tempo de exposição . Quanto mais baixa a temperatura em relação à Temperatura Mínima de Segurança (TMS) e mais prolongado o tempo de exposição, maior a severidade dos danos; se a temperatura estiver consideravelmente abaixo da TMS, os sintomas manifestam-se em curto espaço de tempo. Tecnologia de Frutas, Hortaliças e Derivados • Matérias-Primas e sua Classificação Page 5 of 13"}, {"type": "h3", "text": "3.3 Intensidade Respiratória e Controle Metabólico por Atmosfera"}, {"type": "p", "text": "A intensidade respiratória (medida em mg CO · kg −1 · h −1 a 10 °C) expressa a rapidez com que 2 ocorrem as transformações na composição dos tecidos e determina diretamente a perecibilidade da matéria-prima. Produtos de respiração extremamente elevada consomem suas reservas rapidamente e deterioram-se em curto prazo. Para desacelerar o metabolismo e reduzir a síntese de etileno, combinam-se duas barreiras fisiológicas: (1) abaixamento térmico até o limite seguro (TMS) e (2) modificação da composição gasosa com redução de O (↓ 8%) e elevação de CO (↑ 2%), 2 2 sempre dentro da tolerância de cada espécie. Referência Crítica — Classificação por Intensidade Respiratória (a 10 °C) e Produção de Etileno Intensidade Respiratória (mg CO · kg −1 · h −1 ): Muito baixa (< 10): alho • Baixa (10–20): pepino, 2 repolho, beterraba • Moderada (20–40): cenoura, aipo, pimentão • Elevada (40–70): aspargos, alface • Muito elevada (70–100): feijões, espinafre • Extremamente elevada (> 100): brócolis, milhoverde. Produção de Etileno: Muito baixa (cereja, citros, uva, morango, romã, hortaliças folhosas, batatas)"}, {"type": "bullet", "text": "Baixa (pepino, pimentão, abacaxi, quiabo, caqui) • Moderada (banana, figo, melão, manga, tomate)"}, {"type": "bullet", "text": "Alta (maçã, damasco, abacate, kiwi, nectarina, mamão, pêssego) • Muito alta (maracujá)."}, {"type": "h2", "text": "4. Matriz de Defeitos Tecnológicos"}, {"type": "table", "rows": [["Defeito", "Causas (Processo ou Manejo)", "Estratégias de Prevenção / Correção"], ["Escurecimento e aumento indesejado de doçura em batata", "Desordem pelo frio causada por armazenamento entre 0 °C e 3 °C (abaixo da TMS de 3 °C).", "Manter a temperatura de estocagem estritamente acima da TMS de 3 °C, evitando oscilações térmicas e monitorando o tempo de exposição."], ["Descoloração, depressões e deterioração em quiabo", "Injúria pelo frio por exposição a temperaturas entre 0 °C e 7 °C (abaixo da TMS de 7 °C).", "Ajustar a câmara fria acima da TMS de 7 °C e manter a cadeia do frio constante nessa faixa segura."], ["Amaciamento excessivo, translucidez e deterioração em tomate maduro", "Transtorno metabólico pelo frio devido a estocagem entre 0 °C e 7– 10 °C (abaixo da TMS de 7–10 °C).", "Armazenar tomate maduro acima de 7–10 °C, segregando-o de hortaliças não sensíveis ao frio mantidas próximas a 0 °C."], ["Polpa marrom ou preta em abacaxi", "Desordem fisiológica irreversível pelo frio em temperaturas entre 0 °C e 7– 10 °C (abaixo da TMS).", "Manter o armazenamento acima da TMS de 7–10 °C e evitar exposição prolongada a temperaturas subótimas."], ["Injúria na polpa e deterioração em goiaba", "Armazenamento entre 0 °C e 4,5 °C, violando a TMS de 4,5 °C.", "Operar o resfriamento e a estocagem acima de 4,5 °C, preservando a continuidade da cadeia do frio."]]}, {"type": "p", "text": "Tecnologia de Frutas, Hortaliças e Derivados • Matérias-Primas e sua Classificação Page 6 of 13"}, {"type": "table", "rows": [["Defeito", "Causas (Processo ou Manejo)", "Estratégias de Prevenção / Correção"], ["Depressões, sabor estranho e falha no amadurecimento em mamão", "Exposição entre 0 °C e 7 °C (abaixo da TMS de 7 °C), bloqueando a fisiologia normal de maturação.", "Respeitar a TMS mínima de 7 °C; controlar o binômio tempo-temperatura para não induzir falhas irreversíveis no amadurecimento."], ["Escurecimento da epiderme em banana", "Armazenamento abaixo da TMS de 11,5–13 °C (fruto tropical altamente sensível ao frio).", "Estocar banana acima de 11,5–13 °C; utilizar etileno exógeno apenas em câmaras controladas para climatização uniforme."], ["Amadurecimento precoce, perda de firmeza e senescência acelerada em câmara mista", "Armazenamento conjunto de produtos incompatíveis (emissores de alto/muito alto etileno com produtos sensíveis) ou quebra da cadeia do frio.", "Segregar em grupos de compatibilidade (por etileno e TMS), manter cadeia do frio ininterrupta e empregar atmosfera controlada (O ↓ 8% e CO ↑ 2%, quando 2 2 seguro)."], ["Frutos sem desenvolvimento sensorial (ácidos, duros e sem aroma) após colheita", "Colheita imatura de frutos não- climatéricos (abacaxi, citros, uva, caju), incapazes de elevar a produção de etileno fora da planta.", "Estabelecer rigorosamente o ponto de colheita na planta somente quando atingida a maturação completa para espécies não-climatéricas."]]}, {"type": "h2", "text": "5. Comparações e Decisões de Engenharia"}, {"type": "p", "text": "Colheita imatura + climatização vs. Colheita madura na planta: A decisão é ditada pela fisiologia do etileno. Frutos climatéricos (banana, manga, abacate, tomate, maçã) permitem colheita imatura (maior resistência mecânica ao transporte e manuseio) com amadurecimento posterior controlado, inclusive por aplicação exógena de C H (como na banana). Já frutos não2 4 climatéricos (citros, abacaxi, uva, caju, carambola) exigem colheita no estádio maduro na planta, pois a ausência de pico de etileno pós-colheita impede a conversão satisfatória de sabor, cor e textura. Refrigeração severa (próxima a 0 °C) vs. Refrigeração moderada (acima da TMS): Produtos de clima temperado ou não sensíveis ao frio (maçã, pera, uva, morango, pêssego, cenoura, brócolis, alho, repolho, espinafre) toleram temperaturas muito baixas sem transtornos metabólicos, permitindo máxima supressão respiratória. Em contrapartida, produtos tropicais e subtropicais sensíveis ao frio (banana, manga, mamão, abacaxi, abacate, quiabo, tomate maduro, pepino, batata) exigem temperaturas moderadas estritamente acima da respectiva TMS; reduzir a temperatura além desse limite troca a redução respiratória
